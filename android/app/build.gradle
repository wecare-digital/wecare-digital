apply plugin: 'com.android.application'

// Resolve version metadata before entering the Android DSL. Keeping null-coalescing inside
// versionCode was accepted syntactically but AGP evaluated that method-style expression as a
// null value on GitHub's runner before compilation started.
def envVersionCode = System.getenv("WECARE_ANDROID_VERSION_CODE")
def propVersionCode = project.findProperty("versionCodeOverride")
def resolvedVersionCode = (envVersionCode != null && !envVersionCode.trim().isEmpty())
        ? envVersionCode.trim()
        : (propVersionCode != null ? propVersionCode.toString() : "1")
def envVersionName = System.getenv("WECARE_ANDROID_VERSION_NAME")
def propVersionName = project.findProperty("versionNameOverride")
def resolvedVersionName = (envVersionName != null && !envVersionName.trim().isEmpty())
        ? envVersionName.trim()
        : (propVersionName != null ? propVersionName.toString() : "1.0")

android {
    namespace = "digital.wecare.stackcrm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "digital.wecare.stackcrm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode MUST strictly increase on every Play upload. CI derives it from the run
        // number and passes -PversionCodeOverride (or the env) so repeated uploads never collide
        // without hand-editing this file; absent an override it falls back to 1 for local builds.
        versionCode Integer.parseInt(resolvedVersionCode)
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // RELEASE SIGNING, DRIVEN BY THE ENVIRONMENT — never a committed keystore.
    //
    // Play Store requires a signed release AAB. The upload keystore is a secret, so it is NEVER
    // checked in: the four coordinates come from env vars (or gradle -P props) that CI injects
    // from its secret store. CI sets them from GitHub Actions secrets; a developer can set them
    // locally to produce a signed build.
    //
    // SAFE FALLBACK: if WECARE_ANDROID_KEYSTORE is unset (the common local / unsigned-CI case),
    // no release signingConfig is attached and the release build stays unsigned — so a plain
    // `assembleRelease`/`bundleRelease` for testing still succeeds instead of failing on a
    // missing keystore. Only a build that means to ship sets the env.
    def keystorePath = System.getenv("WECARE_ANDROID_KEYSTORE") ?: project.findProperty("WECARE_ANDROID_KEYSTORE")
    def hasReleaseKeystore = keystorePath != null && !keystorePath.toString().trim().isEmpty() && file(keystorePath).exists()

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("WECARE_ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("WECARE_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WECARE_ANDROID_KEY_ALIAS") ?: project.findProperty("WECARE_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("WECARE_ANDROID_KEY_PASSWORD") ?: project.findProperty("WECARE_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Attach the release signing config only when the keystore was supplied; otherwise
            // leave the build unsigned so non-shipping release builds still assemble.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
