<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>WECARE India Globe</title>
<style>
  :root {
    --dot-lime:#d1f470;
    --dot-dark-green:#1a3a2a;
    --dot-green:#3da35a;
    --dot-blue:#2563eb;
    --dot-purple:#9849e8;
    --dot-amber:#f0a818;
    --paper:#ffffff;
    --ink:#1a3a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#fff; }
  body {
    min-height:100vh;
    display:grid;
    place-items:start center;
    overflow-x:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  }
  .sorcerer-stage {
    position:relative;
    isolation:isolate;
    width:min(100vw,1472px);
    aspect-ratio:1472 / 1048;
    overflow:hidden;
    border-radius:38px;
    /* Transparent stage: the globe sits directly on the white hero. The only
       remaining layer is a soft lime halo that matches the home-page scheme. */
    background:radial-gradient(circle at 50% 44%, rgba(209,244,112,.16) 0 18%, rgba(209,244,112,.06) 42%, transparent 68%);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    cursor:grab;
  }
  .sorcerer-stage.is-dragging{cursor:grabbing}
  .sorcerer-stage[data-layer='air']{--mode-accent:#3da35a;--mode-soft:rgba(61,163,90,.20)}
  .sorcerer-stage[data-layer='weather']{--mode-accent:#f0a818;--mode-soft:rgba(240,168,24,.20)}
  #globe {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  /* One lime scheme for both segments: whichever side is active takes the
     #d1f470 / #1a3a2a brand pair, the other rests quiet on the white hero. */
  .data-toggle{
    position:absolute;top:4.2%;right:4.0%;z-index:20;
    width:clamp(176px,16.5%,224px);height:52px;padding:4px;
    display:grid;grid-template-columns:1fr 1.25fr;gap:4px;align-items:center;
    border:1px solid #e5e7eb;border-radius:999px;
    background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.08);
    cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent;
  }
  .data-toggle .mode{
    position:relative;display:grid;place-items:center;height:100%;border-radius:999px;
    font-size:11px;font-weight:850;letter-spacing:.09em;line-height:1;
    transition:transform .24s cubic-bezier(.16,1,.3,1),opacity .2s,box-shadow .24s;
  }
  .mode-air,
  .mode-weather{color:rgba(0,0,0,.54);background:transparent;box-shadow:none}
  .data-toggle[aria-checked='false'] .mode-air,
  .data-toggle[aria-checked='true'] .mode-weather{
    background:#d1f470;color:#1a3a2a;box-shadow:0 2px 8px rgba(26,58,42,.18);
    transform:translateY(-1px);opacity:1;
  }
  .data-toggle[aria-checked='false'] .mode-weather,
  .data-toggle[aria-checked='true'] .mode-air{opacity:.56}
  .data-toggle:focus-visible{outline:3px solid #1a3a2a;outline-offset:3px}

  /* City labels follow the real globe rotation. Their visual language borrows
     the thin leader + dot from the supplied reference, recolored for WECARE. */
  .city-marker {
    --label-y: -66px;
    --stem-top: -52px;
    --stem-height: 52px;
    position: absolute;
    left: 0;
    top: 0;
    z-index: 10;
    width: 1px;
    height: 1px;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%);
    transition: opacity .18s ease;
  }
  .city-marker.is-visible { opacity: 1; }
  /* The expanded pill must never be covered by a neighbouring collapsed chip. */
  .city-marker.is-active { z-index: 12; }
  .city-marker:hover { z-index: 13; }
  .city-marker.is-visible .city-pin{animation:cityPulse 2.8s ease-out infinite}
  @keyframes cityPulse{
    0%,100%{box-shadow:0 0 0 5px var(--city-marker-soft,var(--city-accent-soft,var(--mode-soft))),0 0 16px var(--city-marker-soft,var(--city-accent-soft,var(--mode-soft)))}
    50%{box-shadow:0 0 0 10px transparent,0 0 28px var(--city-marker-soft,var(--city-accent-soft,var(--mode-soft)))}
  }
  .city-pin {
    position: absolute;
    left: 0;
    top: 0;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background:var(--city-marker,var(--city-accent,var(--mode-accent)));
    border: 2px solid rgba(255,255,255,.96);
    box-shadow:0 0 0 6px var(--city-marker-soft,var(--city-accent-soft,var(--mode-soft))),0 0 20px var(--city-marker-soft,var(--city-accent-soft,var(--mode-soft)));
    transform: translate(-50%, -50%);
  }
  .city-pin::after {
    content: '';
    position: absolute;
    inset: 50% auto auto 50%;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background:#1a3a2a;
    transform: translate(-50%, -50%);
  }
  .city-stem {
    position: absolute;
    left: -0.75px;
    top: var(--stem-top);
    width: 1.5px;
    height: var(--stem-height);
    border-radius: 2px;
    background:linear-gradient(to top,rgba(255,255,255,.70),rgba(255,255,255,.10));
  }
  .city-card{
    position:absolute;right:15px;top:var(--label-y);min-width:154px;
    padding:9px 13px 10px;border:1px solid rgba(26,58,42,.28);border-radius:18px;
    /* Tinted glass: still see-through onto the globe, but opaque enough that the
       white type keeps contrast where the pill overhangs the white hero. */
    background:linear-gradient(135deg,rgba(10,20,16,.78),rgba(10,20,16,.62));
    box-shadow:0 10px 26px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(3px) saturate(116%);-webkit-backdrop-filter:blur(3px) saturate(116%);
    color:#fff;text-align:right;white-space:nowrap;
    transition:left .24s cubic-bezier(.16,1,.3,1),right .24s cubic-bezier(.16,1,.3,1),top .24s cubic-bezier(.16,1,.3,1),transform .24s cubic-bezier(.16,1,.3,1),border-color .28s,background .28s;
  }
  .city-marker.place-right .city-card{left:16px;right:auto;text-align:left}
  .city-marker.place-left .city-card{right:16px;left:auto;text-align:right}
  .city-marker.place-below .city-card{top:16px}
  .city-marker.place-above .city-card{top:auto;bottom:16px}
  .city-marker.place-right .city-stem{transform:rotate(-54deg);transform-origin:bottom center;height:42px;top:-34px}
  .city-marker.place-left .city-stem{transform:rotate(54deg);transform-origin:bottom center;height:42px;top:-34px}
  .city-marker.place-below .city-stem{transform:rotate(180deg);transform-origin:top center;height:34px;top:0}
  .city-marker.place-above .city-stem{height:38px;top:-38px}
  
  .sorcerer-stage[data-layer='air'] .city-card{box-shadow:0 10px 26px rgba(0,0,0,.20),inset 0 1px 0 rgba(61,163,90,.10)}
  .sorcerer-stage[data-layer='weather'] .city-card{box-shadow:0 10px 26px rgba(0,0,0,.20),inset 0 1px 0 rgba(240,168,24,.10)}
  .city-name {
    display: block;
    font-size: clamp(12px, 1.45vw, 16px);
    font-weight: 800;
    letter-spacing: 0;
    line-height: 1.05;
  }
  .city-layer {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    color:rgba(255,255,255,.82);
    font-size: clamp(8px, .82vw, 10px);
    font-weight: 800;
    letter-spacing: .08em;
    line-height: 1;
    text-transform: uppercase;
  }
  .city-layer::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    /* Every city keeps its own identity colour even when live data changes. */
    background:var(--city-marker,var(--city-accent,var(--mode-accent)));
    box-shadow:0 0 0 2px var(--city-marker-soft,var(--city-accent-soft,var(--mode-soft)));
  }
  .sorcerer-stage[data-layer='weather'] .city-layer::after { content: 'WEATHER'; }
  .sorcerer-stage[data-layer='air'] .city-layer::after { content: 'AIR'; }
  .city-reading {
    display:block;margin-top:5px;color:var(--city-accent,var(--mode-accent));
    font-size:clamp(10px,1vw,12px);font-weight:800;line-height:1.22;
    max-width:190px;white-space:normal;
  }
  .city-reading[data-state='loading']{color:rgba(255,255,255,.74)}
  .city-reading[data-state='error']{color:rgba(255,255,255,.74)}
  .city-meta{display:block;margin-top:4px;color:rgba(255,255,255,.66);font-size:8px;font-weight:750;letter-spacing:.08em;line-height:1;text-transform:uppercase}

  /* Only the selected or hovered capital expands into a full reading pill. Every
     other visible capital stays a compact dot + name chip so the globe reads clean. */
  .city-marker .city-layer,
  .city-marker .city-reading,
  .city-marker .city-meta{display:none}
  .city-marker.is-active .city-layer,
  .city-marker:hover .city-layer{display:inline-flex}
  .city-marker.is-active .city-reading,
  .city-marker.is-active .city-meta,
  .city-marker:hover .city-reading,
  .city-marker:hover .city-meta{display:block}
  .city-marker:not(.is-active):not(:hover) .city-card{min-width:0;padding:5px 10px 6px}

  /* Only the pin is interactive; the card stays pass-through so dragging the
     globe is never blocked by a label. */
  .city-pin{
    pointer-events:auto;cursor:pointer;padding:0;appearance:none;-webkit-appearance:none;
  }
  .city-pin::before{
    content:'';position:absolute;left:50%;top:50%;
    width:28px;height:28px;transform:translate(-50%,-50%);border-radius:50%;
  }
  .city-pin:focus-visible{outline:3px solid #1a3a2a;outline-offset:4px}
  @media (max-width:680px){
    .sorcerer-stage{width:100vw;border-radius:24px}
    .data-toggle{top:3%;right:3%;width:166px;height:44px}
    .city-card{min-width:118px;max-width:168px;padding:7px 9px 8px;border-radius:14px}
    .city-stem{width:1px;left:-.5px}.city-pin{width:9px;height:9px}
    .city-pin::before{width:34px;height:34px}
    /* The phone-sized disc cannot hold several name chips at once, so an
       unselected capital is just its dot here; tapping it opens the full pill. */
    .city-marker:not(.is-active):not(:hover) .city-card,
    .city-marker:not(.is-active):not(:hover) .city-stem{display:none}
  }
  @media (prefers-reduced-motion:reduce){.data-toggle .mode,.city-marker,.city-card{transition:none}.city-marker.is-visible .city-pin{animation:none}}

</style>
</head>
<body>
  <main class="sorcerer-stage" id="stage" data-layer="air" aria-label="Interactive WECARE globe with city weather and air markers">
    <canvas id="globe" aria-hidden="true"></canvas>

    <button
      class="data-toggle"
      id="dataToggle"
      type="button"
      role="switch"
      aria-label="Switch between air and weather markers"
      aria-checked="false"
      title="Air / Weather"
    >
      <span class="mode mode-air">AIR</span>
      <span class="mode mode-weather">WEATHER</span>
    </button>

    <!-- Capital-city markers are built from the CITIES registry below. -->
  </main>

<script>
(() => {
  'use strict';

  const REFERENCE={width:1472,height:1048,cx:730,cy:548,earthRadius:404};
  const canvas = document.getElementById('globe');
  const stage = document.getElementById('stage');
  const toggle = document.getElementById('dataToggle');

  // Single source of truth for every clickable capital. Each identity colour is
  // one of the globe's own palette tokens — never a red.
  const CITIES=[
    {id:'delhi',       name:'New Delhi',     lat: 28.6139, lon:  77.2090, accent:'#f0a818'},
    {id:'bengaluru',   name:'Bengaluru',     lat: 12.9716, lon:  77.5946, accent:'#9849e8'},
    {id:'dubai',       name:'Dubai',         lat: 25.2048, lon:  55.2708, accent:'#c98a2e'},
    {id:'moscow',      name:'Moscow',        lat: 55.7558, lon:  37.6173, accent:'#2563eb'},
    // London only for western Europe: at the globe's limb longitudes compress, so a
    // second capital 2.5deg away (Paris) permanently overlaps its label chip.
    {id:'london',      name:'London',        lat: 51.5072, lon:  -0.1276, accent:'#d1f470'},
    {id:'beijing',     name:'Beijing',       lat: 39.9042, lon: 116.4074, accent:'#f0a818'},
    {id:'tokyo',       name:'Tokyo',         lat: 35.6762, lon: 139.6503, accent:'#2563eb'},
    {id:'singapore',   name:'Singapore',     lat:  1.3521, lon: 103.8198, accent:'#3da35a'},
    {id:'sydney',      name:'Sydney',        lat:-33.8688, lon: 151.2093, accent:'#d1f470'},
    {id:'washington',  name:'Washington DC', lat: 38.9072, lon: -77.0369, accent:'#3da35a'},
    {id:'saopaulo',    name:'São Paulo',     lat:-23.5505, lon: -46.6333, accent:'#f0a818'},
  ];
  const CITY_BY_ID=new Map(CITIES.map(c=>[c.id,c]));
  const DEFAULT_CITY='delhi';

  const markerEls=new Map();
  const cityReadingEls=new Map();
  const cityMetaEls=new Map();
  const cityData = new Map();
  let selectedCity=null;

  function buildMarkers(){
    const frag=document.createDocumentFragment();
    for(const city of CITIES){
      const marker=document.createElement('div');
      marker.className='city-marker';
      marker.id=`city-${city.id}`;
      marker.style.setProperty('--city-marker',city.accent);
      marker.style.setProperty('--city-marker-soft',`${city.accent}4d`);
      marker.style.setProperty('--city-accent',city.accent);
      marker.style.setProperty('--city-accent-soft',`${city.accent}42`);

      const stem=document.createElement('span');
      stem.className='city-stem';
      stem.setAttribute('aria-hidden','true');

      const pin=document.createElement('button');
      pin.className='city-pin';
      pin.type='button';
      pin.dataset.city=city.id;
      pin.setAttribute('aria-label',`Show live air and weather for ${city.name}`);
      // Keyboard path only (Enter/Space report detail 0). A pointer tap is handled
      // on the stage's pointerup, because stage.setPointerCapture retargets the
      // compatibility click away from the pin.
      pin.addEventListener('click',e=>{if(e.detail===0)selectCity(city.id);});

      const card=document.createElement('span');
      card.className='city-card';
      const name=document.createElement('span');
      name.className='city-name';
      name.textContent=city.name;
      const layer=document.createElement('span');
      layer.className='city-layer';
      const reading=document.createElement('span');
      reading.className='city-reading';
      reading.dataset.cityReading=city.id;
      reading.dataset.state='idle';
      const meta=document.createElement('span');
      meta.className='city-meta';
      meta.dataset.cityMeta=city.id;
      card.append(name,layer,reading,meta);

      marker.append(stem,pin,card);
      frag.appendChild(marker);
      markerEls.set(city.id,marker);
      cityReadingEls.set(city.id,reading);
      cityMetaEls.set(city.id,meta);
    }
    stage.appendChild(frag);
  }
  const gl = canvas.getContext('webgl2', {
    alpha: true,
    antialias: true,
    depth: true,
    premultipliedAlpha: false,
    powerPreference: 'high-performance'
  });

  if (!gl) {
    const fallback = document.createElement('div');
    fallback.style.cssText = 'position:absolute;inset:7% 7% 12% 12%;border-radius:50%;background:radial-gradient(circle at 35% 32%,#0ba5da 0 4%,#05759d 23%,#003b54 62%,#00151f 88%,rgba(0,0,0,0) 100%);box-shadow:-10px 0 28px rgba(0,220,255,.45)';
    stage.insertBefore(fallback, canvas);
    canvas.remove();
    return;
  }

  // ---------- small utilities ----------
  function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) + '\n' + source);
    }
    return s;
  }

  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p));
    }
    return p;
  }

  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function normalish(rand) {
    // Box-Muller, clipped later where useful.
    const u = Math.max(1e-9, rand());
    const v = Math.max(1e-9, rand());
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function latLonToXYZ(latDeg, lonDeg, radius) {
    const lat = latDeg * Math.PI / 180;
    const lon = lonDeg * Math.PI / 180;
    const c = Math.cos(lat);
    return [radius * c * Math.sin(lon), radius * Math.sin(lat), radius * c * Math.cos(lon)];
  }

  // ---------- sphere geometry ----------
  function createSphere(latSegments = 96, lonSegments = 192) {
    const verts = [];
    const uvs = [];
    const indices = [];
    for (let i = 0; i <= latSegments; i++) {
      const v = i / latSegments;
      const lat = -Math.PI / 2 + v * Math.PI;
      const cl = Math.cos(lat);
      const sl = Math.sin(lat);
      for (let j = 0; j <= lonSegments; j++) {
        const u = j / lonSegments;
        const lon = -Math.PI + u * Math.PI * 2;
        verts.push(cl * Math.sin(lon), sl, cl * Math.cos(lon));
        uvs.push(u, v);
      }
    }
    for (let i = 0; i < latSegments; i++) {
      for (let j = 0; j < lonSegments; j++) {
        const a = i * (lonSegments + 1) + j;
        const b = a + lonSegments + 1;
        indices.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    return {
      positions: new Float32Array(verts),
      uvs: new Float32Array(uvs),
      indices: new Uint32Array(indices)
    };
  }

  const sphere = createSphere();
  const earthVAO = gl.createVertexArray();
  gl.bindVertexArray(earthVAO);
  const earthPos = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, earthPos);
  gl.bufferData(gl.ARRAY_BUFFER, sphere.positions, gl.STATIC_DRAW);
  const earthUV = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, earthUV);
  gl.bufferData(gl.ARRAY_BUFFER, sphere.uvs, gl.STATIC_DRAW);
  const earthIBO = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, earthIBO);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sphere.indices, gl.STATIC_DRAW);
  gl.bindVertexArray(null);

  const commonVertex = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPosition;
    layout(location=1) in vec2 aUV;
    uniform vec2 uRotation;
    uniform vec2 uScale;
    uniform vec2 uOffset;
    uniform float uRadius;
    out vec2 vUV;
    out vec3 vNormal;

    vec3 rotateY(vec3 p, float a) {
      float c = cos(a), s = sin(a);
      return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);
    }
    vec3 rotateX(vec3 p, float a) {
      float c = cos(a), s = sin(a);
      return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z);
    }

    void main() {
      vec3 p = rotateY(aPosition, uRotation.y);
      p = rotateX(p, uRotation.x);
      vNormal = normalize(p);
      p *= uRadius;
      gl_Position = vec4(p.x*uScale.x + uOffset.x, p.y*uScale.y + uOffset.y, -p.z*0.45, 1.0);
      vUV = aUV;
    }
  `;

  const earthFragment = `#version 300 es
    precision highp float;
    uniform sampler2D uTexture;
    in vec2 vUV;
    in vec3 vNormal;
    out vec4 outColor;
    void main() {
      vec3 n = normalize(vNormal);
      vec3 lightDir = normalize(vec3(-0.72, 0.48, 0.56));
      float diffuse = max(dot(n, lightDir), 0.0);
      float shade = 0.17 + 0.80 * pow(diffuse, 0.72);
      vec3 tex = texture(uTexture, vUV).rgb;
      tex = pow(tex, vec3(0.95));
      vec3 col = tex * shade;
      float rim = pow(1.0 - max(n.z, 0.0), 3.2);
      col += vec3(0.00, 0.025, 0.045) * rim;
      outColor = vec4(col, 1.0);
    }
  `;

  const atmosphereFragment = `#version 300 es
    precision highp float;
    in vec3 vNormal;
    out vec4 outColor;
    void main() {
      vec3 n = normalize(vNormal);
      if (n.z < -0.03) discard;
      float fresnel = pow(1.0 - clamp(n.z, 0.0, 1.0), 4.1);
      float leftBias = 1.0 - smoothstep(-0.45, 0.78, n.x);
      float topBias = 0.72 + 0.28 * smoothstep(-0.7, 0.8, n.y);
      float a = fresnel * (0.16 + 0.72 * leftBias) * topBias;
      outColor=vec4(0.055,0.705,1.000,a*1.02);
    }
  `;

  const earthProgram = program(commonVertex, earthFragment);
  const atmosphereProgram = program(commonVertex, atmosphereFragment);

  function bindSphereAttribs(p) {
    gl.bindVertexArray(earthVAO);
    const posLoc = gl.getAttribLocation(p, 'aPosition');
    gl.bindBuffer(gl.ARRAY_BUFFER, earthPos);
    if (posLoc >= 0) {
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    }
    const uvLoc = gl.getAttribLocation(p, 'aUV');
    gl.bindBuffer(gl.ARRAY_BUFFER, earthUV);
    if (uvLoc >= 0) {
      gl.enableVertexAttribArray(uvLoc);
      gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, earthIBO);
    gl.bindVertexArray(null);
  }
  bindSphereAttribs(earthProgram);
  bindSphereAttribs(atmosphereProgram);

  // ---------- texture ----------
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 56, 82, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);

  // ---------- point clouds ----------
  const pointVS = `#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPosition;
    layout(location=1) in float aSize;
    uniform vec2 uRotation;
    uniform vec2 uScale;
    uniform vec2 uOffset;
    uniform float uPointSize;
    uniform float uDPR;

    vec3 rotateY(vec3 p, float a) {
      float c = cos(a), s = sin(a);
      return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);
    }
    vec3 rotateX(vec3 p, float a) {
      float c = cos(a), s = sin(a);
      return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z);
    }

    void main() {
      vec3 p = rotateY(aPosition, uRotation.y);
      p = rotateX(p, uRotation.x);
      gl_Position = vec4(p.x*uScale.x + uOffset.x, p.y*uScale.y + uOffset.y, -p.z*0.45, 1.0);
      gl_PointSize = max(1.0, uPointSize * aSize * uDPR);
    }
  `;

  const pointFS = `#version 300 es
    precision highp float;
    uniform vec3 uColor;
    uniform float uOpacity;
    out vec4 outColor;
    void main() {
      vec2 q = gl_PointCoord - vec2(0.5);
      float d = length(q);
      if (d > 0.5) discard;
      float core = 1.0 - smoothstep(0.18, 0.48, d);
      float alpha = (0.48 + 0.52*core) * uOpacity;
      outColor = vec4(uColor, alpha);
    }
  `;
  const pointProgram = program(pointVS, pointFS);

  function makePointCloud(positions, sizes) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const pbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(pointProgram, 'aPosition');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    const sbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, sbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sizes), gl.STATIC_DRAW);
    const sizeLoc = gl.getAttribLocation(pointProgram, 'aSize');
    gl.enableVertexAttribArray(sizeLoc);
    gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { vao, count: sizes.length };
  }

  const randY = mulberry32(0x51A0C3);
  const yellowPos = [];
  const yellowSize = [];
  const YELLOW_COUNT = 6900;
  for (let i = 0; i < YELLOW_COUNT; i++) {
    const y = randY() * 2 - 1;
    const lon = (randY() * 2 - 1) * Math.PI;
    const rxy = Math.sqrt(Math.max(0, 1 - y*y));
    const radius = 1.022 + randY() * 0.032;
    yellowPos.push(radius*rxy*Math.sin(lon), radius*y, radius*rxy*Math.cos(lon));
    yellowSize.push(0.72 + randY() * 0.76);
  }

  const randG = mulberry32(0xE1197A);
  const greenPos = [];
  const greenSize = [];
  const clusters = [
    [41, -103, 260, 9, 14],
    [50,   11, 230, 8, 18],
    [-14, -59, 180, 11, 12],
    [23,   78, 280, 6, 8],
    [29,   77,  70, 2.6, 3.5],
    [13,   77,  70, 2.6, 3.5],
    [34,  111, 150, 9, 15],
    [ 4,   24,  95, 12, 16]
  ];
  for (const [lat0, lon0, count, sLat, sLon] of clusters) {
    for (let i = 0; i < count; i++) {
      let lat = lat0 + normalish(randG)*sLat;
      let lon = lon0 + normalish(randG)*sLon;
      lat = Math.max(-78, Math.min(78, lat));
      if (lon > 180) lon -= 360;
      if (lon < -180) lon += 360;
      const p = latLonToXYZ(lat, lon, 1.027 + randG()*0.027);
      greenPos.push(...p);
      greenSize.push(0.78 + randG()*0.70);
    }
  }
  for (let i = 0; i < 120; i++) {
    const y = randG()*2-1;
    const lon = (randG()*2-1)*Math.PI;
    const rr = Math.sqrt(Math.max(0,1-y*y));
    const radius = 1.028 + randG()*0.024;
    greenPos.push(radius*rr*Math.sin(lon),radius*y,radius*rr*Math.cos(lon));
    greenSize.push(0.8 + randG()*0.6);
  }

  // The user's seven WECARE hues belong to the DATA DOTS (not the panel background).
  const PALETTE=[
    {name:'lime',       rgb:new Float32Array([0.8196,0.9569,0.4392]), weight:21, size:2.65}, // #d1f470
    {name:'darkGreen',  rgb:new Float32Array([0.1020,0.2275,0.1647]), weight:7,  size:2.48}, // #1a3a2a
    {name:'green',      rgb:new Float32Array([0.2392,0.6392,0.3529]), weight:20, size:2.58}, // #3da35a
    {name:'blue',       rgb:new Float32Array([0.1451,0.3882,0.9216]), weight:17, size:2.66}, // #2563eb
    {name:'purple',     rgb:new Float32Array([0.5961,0.2863,0.9098]), weight:13, size:2.66}, // #9849e8
    {name:'amber',      rgb:new Float32Array([0.9412,0.6588,0.0941]), weight:18, size:2.70}, // #f0a818
    {name:'red',        rgb:new Float32Array([0.8627,0.1490,0.1490]), weight:4,  size:2.72}, // #dc2626 subtle
  ];
  const totalWeight=PALETTE.reduce((a,c)=>a+c.weight,0);
  const buckets=PALETTE.map(()=>({p:[],s:[]}));
  const randPalette=mulberry32(0xC01A2026);
  const allPos=yellowPos.concat(greenPos);
  const allSize=yellowSize.concat(greenSize);
  for(let i=0;i<allSize.length;i++){
    let pick=randPalette()*totalWeight,idx=0;
    for(;idx<PALETTE.length-1;idx++){pick-=PALETTE[idx].weight;if(pick<=0)break;}
    buckets[idx].p.push(allPos[i*3],allPos[i*3+1],allPos[i*3+2]);
    buckets[idx].s.push(allSize[i]);
  }
  const paletteClouds=PALETTE.map((d,i)=>({...d,cloud:makePointCloud(buckets[i].p,buckets[i].s)}));

  // ---------- layout / interaction ----------
  let dpr = 1;
  let activeLayer='air';
  let layerMix=0,layerTarget=0;
  const HOME_ROT_X=-10*Math.PI/180;
  const HOME_ROT_Y=-62*Math.PI/180;
  // Manual interaction: unlimited 360deg horizontal rotation.
  // Vertical drag is intentionally capped so the globe never flips upside-down.
  // Automatic motion remains a small India-centred drift for the best passive view.
  const ROT_X_MIN=-62*Math.PI/180;
  const ROT_X_MAX=48*Math.PI/180;
  let rotX=HOME_ROT_X;
  let rotY=HOME_ROT_Y;
  let viewRotX=rotX,viewRotY=rotY;
  let dragging=false;
  let autoResumeAt=0;
  let velocityX=0,velocityY=0;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastX = 0, lastY = 0, lastMoveAt = 0;
  let moved = false;
  // Set on pointerdown when the press started on a pin; consumed on pointerup
  // only if the pointer never travelled, so a drag never selects a city.
  let pendingCity = null;
  const clampTilt=()=>{
    rotX=Math.max(ROT_X_MIN,Math.min(ROT_X_MAX,rotX));
  };
  const nearestHomeY=(angle)=>{
    const turn=Math.PI*2;
    return HOME_ROT_Y+Math.round((angle-HOME_ROT_Y)/turn)*turn;
  };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }

  function setCityReading(cityId,state,text){
    const el=cityReadingEls.get(cityId);if(!el)return;el.dataset.state=state;el.textContent=text;
  }
  function setCityMeta(cityId,text){
    const el=cityMetaEls.get(cityId);if(el)el.textContent=text;
  }
  function ageLabel(ts){
    if(!ts)return 'LIVE · CONNECTING';
    const sec=Math.max(0,Math.floor((Date.now()-ts)/1000));
    if(sec<45)return 'LIVE · UPDATED NOW';
    const min=Math.max(1,Math.floor(sec/60));
    return `LIVE · UPDATED ${min}M AGO`;
  }
  function refreshCityMeta(){
    for(const city of CITIES){
      if(cityData.has(city.id))setCityMeta(city.id,ageLabel(cityData.get(city.id).fetchedAt));
    }
  }

  function airAccent(aqi){
    if(!Number.isFinite(aqi))return '#3da35a';
    if(aqi<=50)return '#3da35a';
    if(aqi<=100)return '#d1f470';
    if(aqi<=150)return '#f0a818';
    // Caps the ramp at warm amber instead of a red product accent, matching the
    // approved VayuLok AQI ramp (src/test/VayuLokLive.test.tsx).
    if(aqi<=200)return '#c98a2e';
    return '#9849e8';
  }
  function weatherAccent(data){
    const type=String(data?.weather?.conditionType||data?.weather?.condition||'').toLowerCase();
    if(/rain|storm|thunder|snow|sleet/.test(type))return '#2563eb';
    if(/cloud|fog|haze|mist/.test(type))return '#9849e8';
    return '#f0a818';
  }
  function updateCityAccent(cityId,data){
    const marker=markerEls.get(cityId);if(!marker)return;
    const accent=activeLayer==='air'?airAccent(data?.air?.aqi):weatherAccent(data);
    marker.style.setProperty('--city-accent',accent);
    marker.style.setProperty('--city-accent-soft',`${accent}42`);
  }
  function renderCityData(){
    for(const city of CITIES){
      const cityId=city.id;
      const data=cityData.get(cityId);
      if(!data)continue;
      updateCityAccent(cityId,data);
      if(activeLayer==='air'){
        const aqi=data.air?.aqi,category=data.air?.category,pollutant=data.air?.dominantPollutant;
        const text=Number.isFinite(aqi)?`AQI ${Math.round(aqi)}${category?` · ${category}`:''}${pollutant?` · ${String(pollutant).toUpperCase()}`:''}`:'AIR · unavailable';
        setCityReading(cityId,Number.isFinite(aqi)?'ready':'error',text);
      }else{
        const w=data.weather||{},bits=[];
        if(Number.isFinite(w.temperatureC))bits.push(`${Math.round(w.temperatureC)}°C`);
        if(w.condition)bits.push(w.condition);
        if(Number.isFinite(w.humidity))bits.push(`RH ${Math.round(w.humidity)}%`);
        if(Number.isFinite(w.precipitationPercent))bits.push(`Rain ${Math.round(w.precipitationPercent)}%`);
        setCityReading(cityId,bits.length?'ready':'error',bits.length?bits.join(' · '):'WEATHER · unavailable');
      }
    }
  }

  // Single-file mode: browser-restricted Google Maps Platform key.
  const GOOGLE_API_KEY=new URLSearchParams(location.hash.slice(1)).get('key')||'';
  async function fetchAir(meta){
    const r=await fetch(`https://airquality.googleapis.com/v1/currentConditions:lookup?key=${encodeURIComponent(GOOGLE_API_KEY)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({location:{latitude:meta.lat,longitude:meta.lon},languageCode:'en'})
    });
    if(!r.ok)throw new Error(`Air API ${r.status}`);
    const j=await r.json();
    const idx=(j.indexes||[]).find(x=>String(x.code||'').toLowerCase()==='uaqi')||(j.indexes||[])[0]||{};
    return {aqi:Number(idx.aqi),category:idx.category||'',dominantPollutant:idx.dominantPollutant||''};
  }
  async function fetchWeather(meta){
    const u=new URL('https://weather.googleapis.com/v1/currentConditions:lookup');
    u.searchParams.set('key',GOOGLE_API_KEY);
    u.searchParams.set('location.latitude',String(meta.lat));
    u.searchParams.set('location.longitude',String(meta.lon));
    u.searchParams.set('unitsSystem','METRIC');
    u.searchParams.set('languageCode','en');
    const r=await fetch(u,{headers:{'Accept':'application/json'},cache:'no-store'});
    if(!r.ok)throw new Error(`Weather API ${r.status}`);
    const j=await r.json();
    return {
      temperatureC:Number(j.temperature?.degrees),
      condition:j.weatherCondition?.description?.text||j.weatherCondition?.type||'',
      conditionType:j.weatherCondition?.type||'',
      humidity:Number(j.relativeHumidity),
      precipitationPercent:Number(j.precipitation?.probability?.percent)
    };
  }
  const inFlight=new Set();
  async function loadCityData(cityId){
    const meta=CITY_BY_ID.get(cityId);
    if(!meta||inFlight.has(cityId))return;
    // Without a browser key every request 403s, which the browser logs before any
    // JS can catch it. Short-circuit so the keyless build degrades quietly.
    if(!GOOGLE_API_KEY){
      setCityReading(cityId,'error',activeLayer==='air'?'AIR · live key not set':'WEATHER · live key not set');
      setCityMeta(cityId,'LIVE · KEY NOT SET');
      return;
    }
    inFlight.add(cityId);
    setCityReading(cityId,'loading','Loading live data…');
    setCityMeta(cityId,'LIVE · CONNECTING');
    try{
      const [air,weather]=await Promise.allSettled([fetchAir(meta),fetchWeather(meta)]);
      const data={
        air:air.status==='fulfilled'?air.value:{},
        weather:weather.status==='fulfilled'?weather.value:{},
        fetchedAt:Date.now()
      };
      cityData.set(cityId,data);renderCityData();refreshCityMeta();
    }catch(err){console.warn(`Live data failed for ${cityId}`,err);setCityReading(cityId,'error','Live data unavailable');}
    finally{inFlight.delete(cityId);}
  }
  // Lazy: only the selected city is ever fetched, and the interval refreshes
  // just the cities already loaded rather than the whole registry.
  async function refreshLiveData(){
    const ids=cityData.size?[...cityData.keys()]:[selectedCity||DEFAULT_CITY];
    await Promise.allSettled(ids.map(loadCityData));
  }
  function selectCity(cityId){
    if(!CITY_BY_ID.has(cityId)||cityId===selectedCity)return;
    const previous=markerEls.get(selectedCity);
    if(previous)previous.classList.remove('is-active');
    const marker=markerEls.get(cityId);
    if(marker)marker.classList.add('is-active');
    selectedCity=cityId;
    renderCityData();
    if(!cityData.has(cityId))loadCityData(cityId);
  }
  toggle.addEventListener('click', () => {
    activeLayer = activeLayer === 'weather' ? 'air' : 'weather';
    const weatherOn = activeLayer === 'weather';
    toggle.setAttribute('aria-checked', String(weatherOn));
    stage.dataset.layer = activeLayer;
    layerTarget=weatherOn?1:0;
    renderCityData();
  });

  // The globe's home rotation faces India, so Delhi is the sensible default
  // selection. selectCity also performs its first (and only) fetch.
  buildMarkers();
  selectCity(DEFAULT_CITY);
  setInterval(refreshLiveData, 10 * 60 * 1000);
  setInterval(refreshCityMeta, 30 * 1000);

  stage.addEventListener('pointerdown', e => {
    if (toggle.contains(e.target)) return;
    pendingCity = e.target.closest?.('.city-pin')?.dataset.city || null;
    dragging=true;stage.classList.add('is-dragging');autoResumeAt=performance.now()+5200;
    moved=false;velocityX=0;velocityY=0;
    lastX=e.clientX;lastY=e.clientY;lastMoveAt=performance.now();
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now=performance.now();
    const dt=Math.max(8,Math.min(40,now-lastMoveAt));
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
    // No horizontal clamp: drag freely through every longitude, repeatedly if desired.
    rotY+=dx*0.0036;rotX+=dy*0.0032;clampTilt();
    velocityY=(dx*0.0036)/(dt/16.67);
    velocityX=(dy*0.0032)/(dt/16.67);
    lastX=e.clientX;lastY=e.clientY;lastMoveAt=now;
  });
  stage.addEventListener('pointerup', e => {
    // A tap that never moved is a selection, not a drag.
    if(pendingCity&&!moved)selectCity(pendingCity);
    pendingCity=null;
    dragging=false;stage.classList.remove('is-dragging');autoResumeAt=performance.now()+5200;
    try{stage.releasePointerCapture(e.pointerId);}catch(_){ }
  });
  stage.addEventListener('pointercancel',()=>{pendingCity=null;dragging=false;stage.classList.remove('is-dragging');autoResumeAt=performance.now()+5200;});

  // Double click returns to the exact reference orientation.
  stage.addEventListener('dblclick', e => {
    if (toggle.contains(e.target)) return;
    if (e.target.closest?.('.city-pin')) return;
    rotX=HOME_ROT_X;rotY=HOME_ROT_Y;velocityX=0;velocityY=0;autoResumeAt=0;
  });

  const cities=CITIES.map(c=>({el:markerEls.get(c.id),lat:c.lat,lon:c.lon}));

  function rotateForView(p) {
    let [x, y, z] = p;
    let c=Math.cos(viewRotY),s=Math.sin(viewRotY);
    [x, z] = [c*x + s*z, -s*x + c*z];
    c=Math.cos(viewRotX);s=Math.sin(viewRotX);
    [y, z] = [c*y - s*z, s*y + c*z];
    return [x, y, z];
  }

  function updateCityMarkers() {
    const w = stage.clientWidth || 1;
    const h = stage.clientHeight || 1;
    for (const city of cities) {
      const p = rotateForView(latLonToXYZ(city.lat,city.lon,1.035));
      const xNdc = p[0] * scale[0] + offset[0];
      const yNdc = p[1] * scale[1] + offset[1];
      const x = (xNdc + 1) * 0.5 * w;
      const y = (1 - yNdc) * 0.5 * h;
      const visible=p[2]>0.08&&x>-40&&x<w+40&&y>-40&&y<h+40;
      city.el.classList.toggle('is-visible',visible);
      city.el.classList.toggle('place-left',x>w*.54);
      city.el.classList.toggle('place-right',x<=w*.54);
      city.el.classList.toggle('place-above',y>h*.30);
      city.el.classList.toggle('place-below',y<=h*.30);
      city.el.style.left=`${x}px`;
      city.el.style.top=`${y}px`;
    }
  }

  const ro = new ResizeObserver(resize);
  ro.observe(stage);
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // Reference proportions in NDC.
  const scale = new Float32Array([
    (REFERENCE.earthRadius / (REFERENCE.width / 2)),
    (REFERENCE.earthRadius / (REFERENCE.height / 2))
  ]);
  const offset = new Float32Array([
    (REFERENCE.cx - REFERENCE.width/2) / (REFERENCE.width/2),
    -(REFERENCE.cy - REFERENCE.height/2) / (REFERENCE.height/2)
  ]);

  function setCommonUniforms(p, radius) {
    gl.uniform2f(gl.getUniformLocation(p,'uRotation'),viewRotX,viewRotY);
    gl.uniform2fv(gl.getUniformLocation(p, 'uScale'), scale);
    gl.uniform2fv(gl.getUniformLocation(p, 'uOffset'), offset);
    const r = gl.getUniformLocation(p, 'uRadius');
    if (r) gl.uniform1f(r, radius);
  }

  function drawSphere(p, radius, withTexture = false) {
    gl.useProgram(p);
    setCommonUniforms(p, radius);
    if (withTexture) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(gl.getUniformLocation(p, 'uTexture'), 0);
    }
    gl.bindVertexArray(earthVAO);
    gl.drawElements(gl.TRIANGLES, sphere.indices.length, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(null);
  }

  function drawPoints(cloud, color, pointSize, opacity=1) {
    gl.useProgram(pointProgram);
    gl.uniform2f(gl.getUniformLocation(pointProgram,'uRotation'),viewRotX,viewRotY);
    gl.uniform2fv(gl.getUniformLocation(pointProgram, 'uScale'), scale);
    gl.uniform2fv(gl.getUniformLocation(pointProgram, 'uOffset'), offset);
    gl.uniform1f(gl.getUniformLocation(pointProgram, 'uPointSize'), pointSize);
    gl.uniform1f(gl.getUniformLocation(pointProgram, 'uDPR'), dpr);
    gl.uniform3fv(gl.getUniformLocation(pointProgram, 'uColor'), color);
    gl.uniform1f(gl.getUniformLocation(pointProgram, 'uOpacity'), opacity);
    gl.bindVertexArray(cloud.vao);
    gl.drawArrays(gl.POINTS, 0, cloud.count);
    gl.bindVertexArray(null);
  }

  function frame(){
    resize();
    const t=performance.now();
    layerMix+=((layerTarget-layerMix)*(reduceMotion?1:.055));
    if(!dragging&&!reduceMotion&&(Math.abs(velocityX)+Math.abs(velocityY)>.00005)){
      rotX+=velocityX;rotY+=velocityY;velocityX*=.91;velocityY*=.91;clampTilt();
    }
    const auto=!reduceMotion&&!dragging&&t>=autoResumeAt;
    if(auto){
      // Passive mode: return by the SHORTEST route to the India-facing equivalent,
      // then breathe only a few degrees. Manual mode is still unrestricted 360deg.
      const homeY=nearestHomeY(rotY);
      rotX+=(HOME_ROT_X-rotX)*.008;
      rotY+=(homeY-rotY)*.008;
      clampTilt();
    }
    viewRotY=rotY+(auto?Math.sin(t*0.00018)*(7*Math.PI/180):0);
    viewRotX=rotX+(auto?Math.sin(t*0.00013)*(2.2*Math.PI/180):0);

    gl.clearColor(0,0,0,0);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.depthFunc(gl.LEQUAL);
    drawSphere(earthProgram, 1.0, true);

    // Atmosphere edge glow. Does not touch depth, so the point clouds still
    // use the globe as the occluder exactly like the reference frame.
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    drawSphere(atmosphereProgram, 1.017, false);

    // Seven WECARE dot hues. AIR favours the greens; WEATHER favours blue/purple/amber.
    gl.enable(gl.DEPTH_TEST);gl.depthMask(false);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    const airOpacity={lime:.96,darkGreen:.78,green:1,blue:.80,purple:.76,amber:.84,red:.34};
    const weatherOpacity={lime:.84,darkGreen:.70,green:.78,blue:1,purple:.96,amber:1,red:.42};
    for(const d of paletteClouds){
      const opacity=airOpacity[d.name]+(weatherOpacity[d.name]-airOpacity[d.name])*layerMix;
      const breathing=reduceMotion?1:(.955+.045*Math.sin(t*.0011+d.size*2.7));
      drawPoints(d.cloud,d.rgb,d.size,opacity*breathing);
    }
    gl.depthMask(true);gl.disable(gl.BLEND);

    updateCityMarkers();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
