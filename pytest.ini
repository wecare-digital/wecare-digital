[pytest]
# Use importlib import mode so test modules with identical basenames
# (e.g. multiple `tests/test_*.py` under amplify/functions/**) can coexist
# without requiring __init__.py packages. This fixes the full-tree
# collection clash on `pytest` (bare invocation used by CI).
addopts = --import-mode=importlib
testpaths =
    tests
    amplify/functions
markers =
    live: this test genuinely needs the network, so conftest.py lifts its outbound
        socket block. Nothing in .github/workflows uses this marker and nothing should
        start to - a CI job that reaches a live provider is a CI job that fails for
        reasons unrelated to the commit. Use it for a local probe, never for a guard.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
