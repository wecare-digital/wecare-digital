steps:
  - id: Build VayuLok Weather Insights
    name: gcr.io/cloud-builders/docker
    dir: gcp/vayulok-weather-insights
    args:
      - build
      - --no-cache
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/wecare-digital:$COMMIT_SHA
      - .

  - id: Push VayuLok Weather Insights
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/wecare-digital:$COMMIT_SHA

  - id: Deploy VayuLok Weather Insights
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - wecare-digital
      - --platform=managed
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/wecare-digital:$COMMIT_SHA
      - --region=asia-south1
      - --quiet

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/wecare-digital:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
