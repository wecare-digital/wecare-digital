version: 1
# NOTE: No `backend:` phase. The Amplify Gen2 backend (auth=referenceAuth,
# data, storage) and the 42+ Python Lambdas are deployed SEPARATELY via boto3
# scripts (see scripts/deploy_task12.py etc.) and already exist in AWS — they
# are not managed by `ampx pipeline-deploy`. A pipeline-deploy here would
# collide with those existing resources. Amplify builds only the frontend. The SEO tools Lambda (wecare-seo-tools)
# is deployed via its own boto3 script.
frontend:
  phases:
    preBuild:
      commands:
        # --skip-default-packages: the build image ships /root/.nvm/default-packages, and a plain
        # `nvm install` re-installs that whole global set (1,692 packages: vue 2, webpack-chain,
        # docsearch...) for the new Node on EVERY build. Measured on jobs 276-278 (2026-10-27):
        # 51 s of each ~250 s BUILD step, roughly a fifth of every billed build minute. Nothing below
        # uses a global package; npm, npx tsc and next all resolve from this repo, and `aws` is a
        # system binary.
        # nvm requires its install options directly after `install`, before the version.
        - nvm install --skip-default-packages 24 || true
        - nvm use 24 || true
        # The two nvm lines tolerate failure, so assert the result rather than trust it: a silent
        # fall-back to the image's default Node must stop the build, not ship under another engine.
        - node -e "const m=+process.versions.node.split('.')[0]; if (m < 24) { console.error('Node >= 24 required, got ' + process.version); process.exit(1); }"
        - node -v
        - npm -v
        # Node 24 floats to newer bundled npm releases, while this root lockfile is
        # generated and verified with the exact npm version declared by packageManager.
        # Install that version before npm ci so Amplify consumes the committed lock deterministically.
        - export PINNED_NPM="$(node -e "const p=require('./package.json').packageManager;process.stdout.write(p.slice(p.lastIndexOf('@')+1))")"; npm install --global "npm@$PINNED_NPM"; test "$(npm --version)" = "$PINNED_NPM"; npm --version
        # Proved early and loudly, because the build step below depends on it. If the
        # Amplify image ever ships without python3, this fails here with an obvious
        # cause instead of turning the credential gate into a silent skip.
        - python3 --version
        # Backend Python is not deployed by Amplify, but a green website build
        # must not conceal invalid source in the customer-facing WhatsApp,
        # Referral or Vault handlers. #2146 shipped with a broken module
        # docstring/import boundary; Amplify #467 passed while its backend tests
        # failed. Standard-library syntax compilation is safe and runs offline:
        # no messages, payments, AWS mutation or runtime import side effects.
        - python3 -m compileall -q amplify/functions/auth/customer-profile amplify/functions/messaging/whatsapp-business-api amplify/functions/messaging/inbound-whatsapp-handler amplify/functions/core/secure-files amplify/functions/shared/lambda_utils
        # Derive the content-addressed staging bucket from the credentials actually
        # running this build. No production account id or live key ARN is stored in
        # source. The stack deployment still requires an explicit KMS parameter or
        # CloudFormation UsePreviousValue.
        - export AWS_REGION="${AWS_REGION:-us-east-1}"; export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"; test -n "$AWS_ACCOUNT_ID"; export CUSTOMER_COMMERCE_RUNTIME_BUCKET="${CUSTOMER_COMMERCE_RUNTIME_BUCKET:-cdk-hnb659fds-assets-${AWS_ACCOUNT_ID}-${AWS_REGION}}"; test -n "$CUSTOMER_COMMERCE_RUNTIME_BUCKET"
        # REPRODUCIBLE INSTALL for the production Amplify build.
        # `npm ci` installs exactly the committed lockfile and never writes to it, so the
        # tree that deploys is exactly the committed dependency graph. `npm install` was free to resolve a newer
        # satisfying version at deploy time, which meant the production build could differ
        # from the one that passed CI minutes earlier, with nothing recording the difference.
        #
        # This was blocked until the four @opentelemetry backend packages moved to
        # amplify/package.json: their bundled subtree is internally inconsistent and
        # `npm ci` correctly refuses it. The root lockfile no longer contains them.
        # See docs/npm-ci-backend-isolation.md.
        #
        # NO --legacy-peer-deps: the committed lockfile is generated
        # with plain `npm install`, so the flag has nothing to resolve. The exact npm version
        # is declared by packageManager and installed above before this command. Do not let
        # `nvm install 24` silently move npm underneath the lockfile again: npm 11.19.0
        # currently rejects this lock with missing @emnapi entries while the pinned npm 11.6.2
        # is the version the lock was generated and verified with.
        #
        # `rm -rf node_modules/.cache` went with the switch: `npm ci` removes node_modules
        # wholesale before installing, so the line could not have any effect.
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        # DEPLOY GATE. Store private diagnostics before failing so release blockers are inspectable
        # without relying on Amplify's service-owned log bucket.
        - export CUSTOMER_COMMERCE_DIAGNOSTICS="s3://${CUSTOMER_COMMERCE_RUNTIME_BUCKET}/customer-commerce/validation/${AWS_BRANCH:-unknown}"
        - npx tsc --noEmit > /tmp/customer-commerce-tsc.log 2>&1 || { aws s3 cp /tmp/customer-commerce-tsc.log "$CUSTOMER_COMMERCE_DIAGNOSTICS/tsc-failure.log" --only-show-errors || true; cat /tmp/customer-commerce-tsc.log; exit 1; }
        # Prepare customer-commerce backend release assets without reintroducing retired test suites.
        # The package builder still compiles exact runtime sources, validates return-path and dial
        # code contracts, and produces a deterministic content-addressed ZIP and stack template.
        # Package failure diagnostics are private; this does not deploy the backend.
        - python3 tools/customer-commerce/prepare_release.py --output /tmp/customer-commerce-release --runtime-bucket "$CUSTOMER_COMMERCE_RUNTIME_BUCKET" > /tmp/customer-commerce-package.log 2>&1 || { aws s3 cp /tmp/customer-commerce-package.log "$CUSTOMER_COMMERCE_DIAGNOSTICS/backend-package-failure.log" --only-show-errors || true; cat /tmp/customer-commerce-package.log; exit 1; }
        # Stage only the content-addressed backend artifacts. This does not update the
        # CloudFormation stack or move the live alias; deployment remains a separate reviewed step.
        - export CUSTOMER_COMMERCE_SOURCE_SHA="$(python3 -c "import json; print(json.load(open('/tmp/customer-commerce-release/release-manifest.json'))['sourceSha256'])")"; test -n "$CUSTOMER_COMMERCE_SOURCE_SHA"; export CUSTOMER_COMMERCE_RELEASE_PREFIX="s3://${CUSTOMER_COMMERCE_RUNTIME_BUCKET}/customer-commerce/$CUSTOMER_COMMERCE_SOURCE_SHA"; aws s3 cp /tmp/customer-commerce-release/customer-commerce-runtime.zip "$CUSTOMER_COMMERCE_RELEASE_PREFIX/runtime.zip" --only-show-errors; aws s3 cp /tmp/customer-commerce-release/customer-commerce-stack.json "$CUSTOMER_COMMERCE_RELEASE_PREFIX/stack.json" --only-show-errors; aws s3 cp /tmp/customer-commerce-release/release-manifest.json "$CUSTOMER_COMMERCE_RELEASE_PREFIX/release-manifest.json" --only-show-errors
    build:
      commands:
        # Browser Maps credential is build-scoped only. Do not persist a Maps public-key alias
        # in Amplify app/branch environment variables; browser consumers share this one name.
        # Preserve failures in the account-owned private CDK asset bucket (Amplify's own
        # BUILD/log.txt is not readable through the project's AWS role).
        - export WEB_BUILD_DIAGNOSTICS="s3://cdk-hnb659fds-assets-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION:-us-east-1}/customer-commerce/validation/${AWS_BRANCH:-wecare.digital}"
        - export NEXT_PUBLIC_VAYULOK_WEATHER_INSIGHTS_URL="${NEXT_PUBLIC_VAYULOK_WEATHER_INSIGHTS_URL:-https://wecare-digital-hrkl3sncxq-el.a.run.app}"; export NEXT_PUBLIC_GOOGLE_BROWSER_KEY="$(aws secretsmanager get-secret-value --secret-id wecare/google-maps --query SecretString --output text | python3 -c 'import json,sys; s=sys.stdin.read().strip(); d=json.loads(s) if s.startswith("{") else s; print((d.get("api_key") or d.get("unified_google_api_key") or "") if isinstance(d,dict) else d)')"; test -n "$NEXT_PUBLIC_GOOGLE_BROWSER_KEY"; test -n "$NEXT_PUBLIC_VAYULOK_WEATHER_INSIGHTS_URL"; npm run build > /tmp/wecare-site-build.log 2>&1 || { aws s3 cp /tmp/wecare-site-build.log "$WEB_BUILD_DIAGNOSTICS/site-build-failure.log" --only-show-errors || true; tail -n 160 /tmp/wecare-site-build.log; exit 1; }; tail -n 55 /tmp/wecare-site-build.log
        - python3 scripts/checkout_release_check.py --export-dir out > /tmp/wecare-checkout-release.log 2>&1 || { aws s3 cp /tmp/wecare-checkout-release.log "$WEB_BUILD_DIAGNOSTICS/checkout-release-failure.log" --only-show-errors || true; cat /tmp/wecare-checkout-release.log; exit 1; }; cat /tmp/wecare-checkout-release.log
        - python3 scripts/sync_faq.py --check > /tmp/wecare-faq-check.log 2>&1 || { aws s3 cp /tmp/wecare-faq-check.log "$WEB_BUILD_DIAGNOSTICS/faq-check-failure.log" --only-show-errors || true; cat /tmp/wecare-faq-check.log; exit 1; }; cat /tmp/wecare-faq-check.log
        # THE REAL CREDENTIAL GATE. It must run in the production build.
        # output:'export' inlines every NEXT_PUBLIC_* value into a JS chunk that is
        # then served to every visitor. This production build has the branch-scoped
        # environment variables, so this is the place that can catch a
        # server-side credential being published.
        #
        # Specifically it refuses the unified Google key - one value shared by
        # wecare/google/cloud, wecare/google-api-key and wecare/google-maps, read
        # server-side by wecare-whatsapp-templates. A genuine referrer-restricted Maps
        # browser key passes; that one fails the build before anything deploys.
        # Compares fingerprints only, so no secret is read or printed.
        - python3 scripts/verify_public_bundle_secrets.py > /tmp/wecare-public-bundle-check.log 2>&1 || { aws s3 cp /tmp/wecare-public-bundle-check.log "$WEB_BUILD_DIAGNOSTICS/public-bundle-failure.log" --only-show-errors || true; cat /tmp/wecare-public-bundle-check.log; exit 1; }; cat /tmp/wecare-public-bundle-check.log
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      # Cache npm's download cache, not node_modules. Amplify restores this before preBuild
      # and npm ci --cache .npm --prefer-offline can reuse it directly. Caching node_modules
      # was pure transfer/compression overhead because npm ci deletes node_modules before install.
      # Keep .next/cache intentionally absent: this repo previously proved stale compiled output
      # could survive across deploys when that cache was restored.
      - .npm/**/*
      # .next/cache REMOVED 2026-10-03. It holds Next's incremental compiler cache,
      # and a stale restore was serving OLD compiled output for changed files: a fix
      # committed to src/components/VayuLokLive.tsx (the map's waitForHost init) never
      # reached production across many builds while edits to other files did, because
      # Next reused the cached chunk for the "unchanged" file. Dropping this cache
      # forces a full recompile every build (slower, but correct), ending the
      # pushed-but-not-live drift. If re-added later, pair it with a cache key that
      # includes the commit SHA so a changed source file cannot hit a stale entry.
# ── RESPONSE HEADERS LIVE IN customHttp.yml, NOT HERE ───────────────────────────
#
# A `customHeaders:` block used to sit at this point in the file. It was INERT for
# its whole life and nobody noticed, because five of the seven headers it declared
# were ALSO set at the app level and were being served from there.
#
# Measured 2026-09-29 against the live apex: 7 declared here, 5 served, and the live
# set was not a subset of the declared one. `Strict-Transport-Security` was live
# without being declared here; both CSP headers were declared here and never shipped,
# including the one added on 2026-09-28. `aws amplify get-app --query
# app.customHeaders` held the five that were actually live.
#
# AWS documents this route as legacy and recommends migrating out of it, and
# documents a root `customHttp.yml` as overriding the app-level set:
#   https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
#   https://docs.aws.amazon.com/amplify/latest/userguide/setting-custom-headers.html
#
# DO NOT re-add a `customHeaders:` block here. It would be silently ignored again,
# and the failure mode is a security header that looks configured and is not.
# Headers, and the reasoning behind each one, are in ./customHttp.yml.
#
# Gate the DEPLOYED headers, never the file:
#   python scripts/verify_deployed_headers.py
