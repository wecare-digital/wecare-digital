<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auth phone field mock</title>
<style>
:root{--green:#1a3a2a;--lime:#d1f470;--hair:#e5e7eb;--text:#1a1a1a;--muted:rgba(0,0,0,.42)}
*{box-sizing:border-box}body{margin:0;padding:48px 24px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#fff}
.card{width:min(560px,100%);margin:auto;padding:36px 40px;border:1px solid var(--hair);border-top:4px solid var(--lime);border-radius:24px}
.eyebrow{width:52px;height:52px;margin:0 0 34px;border-radius:50%;display:grid;place-items:center;background:var(--lime)}
.eyebrow img{width:34px;height:34px;border-radius:50%;object-fit:contain}
.phone{display:flex;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--hair);background:transparent}
.phone:focus-within{border-bottom-color:var(--green);box-shadow:0 1px 0 var(--lime)}
.country{min-width:92px;border:0;background:transparent;color:var(--green);font:600 17px/1 inherit;text-align:left;padding:0 12px 0 2px;cursor:pointer}
.phone input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 2px 0 14px;font:400 17px/1.2 inherit;color:var(--text)}
.phone input::placeholder{color:var(--muted)}
.note{margin:18px 0 0;font-size:14px;line-height:1.5;color:#5f6f66}
@media(max-width:767px){body{padding:24px 16px}.card{padding:28px 20px}.eyebrow{width:48px;height:48px}.eyebrow img{width:31px;height:31px}.country{min-width:82px;font-size:16px}.phone input{font-size:16px}}
</style>
</head>
<body>
<section class="card" aria-label="Sign in">
  <div class="eyebrow" aria-hidden="true">
    <img src="https://wecare.digital/get/o/stream/media/m/wecaredigital.png" alt="">
  </div>
  <div class="phone">
    <button class="country" type="button">+91⌄</button>
    <input type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="WhatsApp number" aria-label="WhatsApp number">
  </div>
  <p class="note">Reference mock: menu-search geometry — transparent, borderless, one bottom hairline. Country code and number stay in one field without a boxed segment.</p>
</section>
</body>
</html>
