# Response headers for the Amplify-hosted app (d22dm4b0jn71jw, apex wecare.digital).
#
# ── WHY THIS FILE EXISTS, AND WHY NOT amplify.yml ────────────────────────────────
#
# `amplify.yml` used to carry a `customHeaders:` block. It was INERT and had been for
# its whole life. Measured on 2026-09-29 against the live apex, seven headers were
# declared there and five were served, and the live set was not a subset of the
# declared one:
#
#   Strict-Transport-Security          NOT declared in amplify.yml, but LIVE
#   Content-Security-Policy            declared, NOT live
#   Content-Security-Policy-Report-Only  declared, NOT live
#   Cache-Control                      declared must-revalidate, served s-maxage=31536000
#
# The reason is that `aws amplify get-app --query app.customHeaders` held its own
# five-header set - exactly the five that were live, HSTS included - and that
# app-level config is what Amplify was applying. The build log confirms it: it prints
# "Found customHttp.yml, applying custom headers" even though no such file was in the
# repository, because Amplify materialises one from the app-level setting.
#
# AWS documents the amplify.yml route as legacy and "highly recommend[s] migrating
# custom headers out of the buildspec and the amplify.yml file":
#   https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
#
# And it documents this file as winning:
#   "Custom headers set in the customHttp.yml file and deployed in the app's root
#    directory override custom headers defined in the Custom headers section in the
#    Amplify console."
#   https://docs.aws.amazon.com/amplify/latest/userguide/setting-custom-headers.html
#
# So this file is the single source of truth, it is in git, and it is reviewable.
# The practical consequence of the old arrangement was that the CSP added on
# 2026-09-28 never shipped on any build, while amplify.yml asserted in a comment
# that its values were "what actually ships". Do not re-add a `customHeaders:` block
# to amplify.yml; it would be silently ignored again.
#
# ── TREAT THE OVERRIDE AS WHOLESALE ─────────────────────────────────────────────
#
# AWS says this file overrides the console set; it does not promise a per-header
# merge. So every header that must be live is listed here, including the five that
# were already live. Deleting a line here is a live header removal, not a revert to
# the console value.
#
# `Cache-Control` IS NOW SET TO `no-store, max-age=0, must-revalidate` EVERYWHERE - on the
# sitewide `**/*` block AND on `/_next/static/**/*` AND on the VayuLok patterns. The site
# caching layer was removed wholesale (PR #1467, "Remove site cache layer completely"); the
# whole point is that NO surface is cached by the browser or the edge anymore, so there is no
# longer a distinction between HTML and hashed assets to state.
#
#   WHY no-store EVERYWHERE, INCLUDING HASHED ASSETS. VayuLok kept showing an older
#   document/globe after successful Amplify deploys - stale UI that a long browser/edge TTL
#   plus a now-removed Service Worker kept alive. The remedy chosen was to stop caching the
#   site at all: every response revalidates against the origin, so a successful deployment is
#   always what a visitor sees. This is deliberately NOT performance-optimal.
#
#   WHAT WAS GIVEN UP, STATED PLAINLY. `/_next/static/*` filenames are content-hashed by the
#   build, so their bytes at a given URL can never change and they COULD safely carry a
#   one-year `public, max-age=31536000, immutable`. That is exactly what this file used to set
#   here, and `no-store` replaces it: a returning visitor now sends a conditional request for
#   each hashed asset on every navigation and gets a 304 back every time - round trips that
#   cannot produce a different answer, and the precise thing Lighthouse's cache-insight audit
#   flags. The staleness cure was judged to outweigh that cost. If the cache is ever restored,
#   it is `/_next/static/**/*` -> `public, max-age=31536000, immutable` that is safe to bring
#   back first, because the hash in the filename makes it strand-proof; HTML is not.
#
# Amplify documents customHttp.yml's Cache-Control as taking precedence over its own
# default (userguide/managing-cache-configuration.html), and it clears the CDN cache on
# every CI/CD deployment.
#
# Verify the DEPLOYED headers, never this file:
#   python scripts/verify_deployed_headers.py
customHeaders:
  # `**/*` matches the pattern the app-level config used, kept identical so the
  # match surface does not change along with the header set.
  - pattern: "**/*"
    headers:
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"
      # ── Carried over verbatim from the app-level config, byte for byte ────────
      # Snapshot: docs/execution/snapshots/amplify-d22dm4b0jn71jw-customheaders-before-20260929.json
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      # microphone=(self) is required by the Plivo Browser SDK softphone, which calls
      # getUserMedia from this origin. Camera and geolocation stay denied.
      #
      # next.config.js also declares this, and that copy is INERT: the app is a static
      # export (artifacts baseDirectory: out), so Next.js never runs as a server and its
      # `headers()` entries are only served by `next start`. On 2026-09-19 the two
      # disagreed - next.config.js said microphone=(self) while the deployed header said
      # microphone=() - and the softphone would have been denied the microphone with no
      # visible cause in the file that appeared to configure it.
      - key: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
      # Kept at the live value. NOT broadened to includeSubDomains: that would force
      # HTTPS on every subdomain, which is a separate decision with its own blast
      # radius, and this change is not the place to make it.
      - key: Strict-Transport-Security
        value: max-age=31536000

      # ── Content-Security-Policy, in two headers, deliberately ─────────────────
      #
      # WHY TWO. A single CSP header is all-or-nothing, and the two halves of a useful
      # policy here have very different risk. The safe-to-enforce directives ship as
      # `Content-Security-Policy` and take effect now; the aspirational full policy
      # ships as `Content-Security-Policy-Report-Only`, which a browser evaluates and
      # reports on but never blocks. That is the only responsible order on a site that
      # takes payments.
      #
      # WHAT CSP CAN AND CANNOT DO HERE, stated so nobody over-credits it.
      # next.config.js sets `output: 'export'`, so there is no server to mint a
      # per-request nonce and Next's hydration bootstrap is an inline <script>. A
      # `script-src` without 'unsafe-inline' would break every page, and 'unsafe-inline'
      # defeats most of what script-src is for. So CSP here is NOT meaningful XSS
      # protection. What it genuinely buys is the three enforced directives below.
      #
      # ENFORCED NOW, because none of these can break this site:
      #   object-src 'none'       there is no <object> or <embed> anywhere in the export
      #   base-uri 'self'         nothing sets <base>; this stops an injected one
      #                           re-pointing every relative URL on the page
      #   frame-ancestors 'self'  clickjacking. Overlaps X-Frame-Options: SAMEORIGIN
      #                           above, but frame-ancestors is the modern directive and
      #                           is the one still honoured where XFO is ignored
      - key: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
      # REPORT-ONLY, so this cannot break anything while it is being proved out.
      #
      # The origin list is derived from the built export rather than guessed: fonts from
      # Google, Razorpay Checkout for payments, the Plivo Browser SDK for the softphone
      # (which is also why Permissions-Policy grants microphone=(self)), Cognito for
      # auth, and the CloudFront distribution behind /get/ for file delivery.
      #
      # IT IS ALMOST CERTAINLY STILL INCOMPLETE, and that is the point of shipping it
      # this way. Static analysis of a bundle cannot find an origin that is only
      # contacted on a code path nobody exercised - a payment retry, a call transfer, a
      # map lookup. The next step is to read the violation reports and tighten, NOT to
      # promote this to enforcing on the assumption the list is right.
      #
      # NOTE: with no `report-to` endpoint configured, violations appear in the browser
      # console only - nothing is transmitted anywhere. That is enough for a deliberate
      # review pass across the public pages, the checkout and the softphone, and it
      # avoids standing up a collector for a policy that is not enforcing yet. Add
      # `report-to` and a Reporting-Endpoints header when the tightening pass starts.
      # Safari logs a "does not specify a report-to" warning on every load until then;
      # that warning is expected and is not a violation.
      #
      # REVIEW PASS 2026-10-26, from the console. 33 public routes loaded live in Chromium
      # (desktop, phone, and no-JS for /, /contact/ and /cart/). Every violation came from an
      # origin the site really uses, so each was added here rather than left as noise:
      #   script-src   maps.googleapis.com                      Maps JS on /contact/ and /vayulok/
      #   img-src      maps.googleapis.com, maps.gstatic.com    the map on /contact/
      #   connect-src  maps.googleapis.com, weather.googleapis.com,
      #                airquality.googleapis.com                VayuLok readings and the map
      #   connect-src  api.open-meteo.com                       the weather line on /contact/
      #   frame-src    www.googletagmanager.com                 GTM's noscript iframe
      #   img-src      connect.facebook.net                     the Meta Pixel library's own error
      #                                                         beacon (//log/error), added after a
      #                                                         second 37-page pass on /elsewhere/activities/
      # NOT exercised by that pass, so still unproven: checkout, the softphone, sign-in, map
      # interaction (pan, zoom, satellite tiles), and analytics after consent is granted (the
      # pass ran with the default denied). Review those before enforcing.
      #
      # THIRD PASS 2026-10-27, IN FIREFOX AND WEBKIT. The passes above ran in headless Chromium,
      # where the Meta Pixel never runs, so they could not see its traffic. In Firefox and WebKit
      # the only violations left, on all 33 routes, are connect-src to the two hosts the Pixel's
      # own config (served by Meta for pixel 3411484995761247) posts every event to:
      #   https://fh-118116076e9a4c2a96a99fbb70bea2a0.ecs.us-west-2.on.aws
      #   https://vwdb33u4tj1q.cloud.run
      # They are deliberately NOT allowed here. Neither is in this repo or in this AWS account,
      # and this list is what enforcement would let through. Add them once the owner confirms they
      # are this business's Conversions API or Signals Gateway. GA4's collection hosts are missing
      # too: GA4 sends nothing today, so add them when it is reconnected. Both are recorded in
      # docs/execution/change-authority-matrix.md, 2026-10-27.
      #
      # ⚠ EVERY LINE BELOW MUST BE INDENTED EXACTLY THE SAME AMOUNT. ⚠
      #
      # This is a YAML folded block scalar (`>-`), and folding has a rule that is easy
      # to miss: lines indented MORE than the first content line are NOT folded. YAML
      # keeps them as literal newlines. An HTTP header value cannot contain a newline,
      # so Amplify silently drops the whole header - no build error, no warning, just an
      # absent header.
      #
      # That is not hypothetical. This value was originally written with the origin
      # lists indented one level deeper for readability, which parsed to a value
      # carrying 13 embedded newlines, and Amplify dropped it while serving the other
      # six headers. It was inherited that way from the old amplify.yml block, so this
      # header could never have shipped from there either, independently of the
      # amplify.yml/customHttp.yml problem.
      #
      # `python scripts/verify_deployed_headers.py --local` now refuses this shape, so
      # the mistake fails before a deploy rather than after one.
      - key: Content-Security-Policy-Report-Only
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval'
          https://checkout.razorpay.com https://api.razorpay.com
          https://*.plivo.com https://www.googletagmanager.com
          https://connect.facebook.net
          https://maps.googleapis.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' data: https://fonts.gstatic.com;
          img-src 'self' data: blob:
          https://img.icons8.com https://*.cloudfront.net
          https://www.googletagmanager.com https://www.facebook.com
          https://maps.googleapis.com https://maps.gstatic.com
          https://connect.facebook.net;
          connect-src 'self' https://wecare.digital
          https://*.execute-api.us-east-1.amazonaws.com
          https://cognito-idp.us-east-1.amazonaws.com
          https://cognito-identity.us-east-1.amazonaws.com
          https://api.razorpay.com https://lumberjack.razorpay.com
          https://*.plivo.com wss://*.plivo.com
          https://*.cloudfront.net https://www.googletagmanager.com
          https://www.facebook.com https://api.frankfurter.dev
          https://maps.googleapis.com https://weather.googleapis.com
          https://airquality.googleapis.com https://api.open-meteo.com;
          media-src 'self' blob: https://*.cloudfront.net;
          frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com
          https://www.googletagmanager.com;
          worker-src 'self' blob:;
          manifest-src 'self';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'self';
          form-action 'self'


  # ── VayuLok live HTML / standalone globe ───────────────────────────────────────
  #
  # VayuLok changes frequently and its globe is loaded from a stable iframe URL, and
  # production screenshots repeatedly showed an older VayuLok document/globe after
  # successful builds. These explicit `no-store` patterns were the first, VayuLok-scoped
  # fix for that (PR #1466), forcing these stable HTML URLs to revalidate from origin.
  #
  # THEY ARE NOW REDUNDANT WITH THE SITEWIDE `**/*` `no-store` ABOVE, which the full
  # cache removal (PR #1467) applied to every surface - VayuLok included. They are kept
  # rather than deleted for two reasons: they are explicit about the pages that triggered
  # the original problem, and if the sitewide default is ever relaxed back toward a TTL,
  # these keep VayuLok on `no-store` without anyone having to remember why.
  #
  # Restate the security headers because Amplify does not document whether matching
  # customHttp.yml patterns merge or replace.
  - pattern: "/vayulok"
    headers:
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"

  - pattern: "/vayulok/"
    headers:
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"

  - pattern: "/vayulok/index.html"
    headers:
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"

  - pattern: "/vayulok*"
    headers:
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

  - pattern: "/vayulok-globe.html"
    headers:
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

  # ── The build's own content-hashed assets ─────────────────────────────────────────
  #
  # EVERY HEADER HERE IS RESTATED ON PURPOSE - none is special to this block anymore.
  #
  # This pattern once existed to give hashed assets a DIFFERENT Cache-Control from the rest
  # of the site (`public, max-age=31536000, immutable`). The site cache layer was removed
  # (PR #1467), so the Cache-Control below is now the SAME `no-store, max-age=0,
  # must-revalidate` the sitewide `**/*` block already sets. The block is kept only to make
  # sure the security headers stay live on JS/CSS responses under either Amplify
  # pattern-merge semantics (see the next paragraph); it no longer carves out a caching
  # exception. See the long note at the top of this file for the why and for what it would
  # take to safely restore a long TTL here.
  #
  # AWS documents that customHttp.yml overrides the console header set, and it documents
  # `pattern` as a glob, but it does NOT document whether two matching patterns MERGE or
  # whether the more specific one replaces the other. Treating that as unknown is the
  # cheap, safe reading - the same reasoning this file already applies to the
  # file-versus-console override at the top. So every header that must be live on a JS or
  # CSS response is written out again. Under either semantics the result is correct; under
  # a replace semantics, omitting them would quietly strip nosniff and HSTS from every
  # script and stylesheet the site serves.
  #
  # The CSPs are restated too. A CSP on a .js response does not govern the page that
  # loaded it - the document's own policy does - so these are inert rather than
  # load-bearing. They are here because "list every header that must be live" is easier to
  # hold than "list the ones I judged to matter", and a judgement call in a header file is
  # how the inert-amplify.yml problem started.
  #
  # The pattern is `/_next/static/**/*` and NOT `**/*.js`. Only files under
  # /_next/static/ carry a content hash in the name. That distinction no longer changes
  # the Cache-Control (everything is `no-store` now), but the pattern is kept precise so
  # that if a long immutable TTL is ever restored here it lands only on the hashed assets
  # it is safe for - never on a stable filename like `/vendor/amplify-ui.css`, where an
  # immutable year would be a stale asset waiting for a visitor who does not hard-refresh.
  - pattern: "/_next/static/**/*"
    headers:
      # Same `no-store` as the sitewide block. The bytes at a hashed URL cannot change, so
      # these assets COULD safely carry `public, max-age=31536000, immutable`; they used to,
      # and it was removed with the rest of the site cache (PR #1467) so that a deploy is
      # never masked by a cached asset. See the long note at the top for the trade-off.
      - key: Cache-Control
        value: "no-store, max-age=0, must-revalidate"
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
