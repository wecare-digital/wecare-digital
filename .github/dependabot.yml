# Dependabot version updates.
#
# This file previously shipped as the unedited GitHub template, with
# `package-ecosystem: ""`. An empty ecosystem is not a valid value, so the whole
# config was rejected and NO version updates ever ran. Security updates were
# unaffected - those come from Dependabot alerts and need no config file - which
# is why alerts were arriving while version updates were silent.
#
# Deliberately NOT set: `target-branch`. The default branch here is `wecare.digital`, so
# Dependabot already targets the right place, and naming a target-branch
# explicitly would turn OFF Dependabot security updates for that ecosystem.
#
# Cadence is intentionally conservative. Minor and patch updates are grouped into a
# single monthly PR per manifest, while majors arrive on their own.
#
# Manifests covered (verified present, each with its own lockfile where npm):
#   /                                              package.json + package-lock.json
#   /amplify                                       package.json + package-lock.json
#   /tools/audit, /gcp/vayulok-weather-insights    package.json (no dependencies yet)
#   /requirements-dev.txt                          pip
#   /requirements-ci.in + requirements-ci.txt      pip (pip-compile, hash-locked)
#   /amplify/functions/operations/docs-scraper     requirements.txt + Dockerfile
#   /gcp/vayulok-weather-insights                  Dockerfile
#   /.github/workflows                             GitHub Actions (SHA-pinned)

version: 2

updates:
  # The site itself. Majors here mean Next / React / Amplify, all of which need a
  # real build-and-look, so they are deliberately left ungrouped.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Amplify Gen 2 backend definition: a separate install root with its own
  # lockfile (see the description in amplify/package.json). CI never installs it,
  # so the PR's Verify run does not test these updates. Before merging one, run
  # `npx npm@11.6.2 ci` in a temporary copy of amplify/. Never run `npm audit fix`
  # there: it leaves a lockfile that `npm ci` refuses.
  - package-ecosystem: "npm"
    directory: "/amplify"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(amplify-deps)"
    groups:
      amplify-backend-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Two small Node packages that have a package.json but no dependencies today:
  # the static-export audit scripts and the VayuLok weather-insights service.
  # Listed so that a dependency added later is tracked from the start.
  - package-ecosystem: "npm"
    directories:
      - "/tools/audit"
      - "/gcp/vayulok-weather-insights"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  # requirements-dev.txt is a FULL FREEZE of the local venv, not a loose set of
  # ranges, and its header documents pins that cannot move on their own -
  # pydantic==2.13.5 hard-pins pydantic_core==2.46.5, so a lone pydantic_core
  # bump would be wrong even though it looks outdated.
  #
  # Grouping every non-major update into one PR is what protects that: coupled
  # pins move together in a single coherent diff instead of arriving as separate,
  # individually-broken PRs. Read the header of requirements-dev.txt before
  # merging - this file does NOT define the Lambda runtime.
  #
  # This entry also covers requirements-ci.in and requirements-ci.txt, the
  # hash-locked set the CI Verify job installs: Dependabot reads every
  # requirements*.txt and *.in file in the directory, and a second pip entry for
  # "/" would be rejected. requirements-ci.txt is pip-compile output, and the
  # PR's own Verify run installs it with --require-hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(py-deps)"
    ignore:
      # botocore requires python-dateutil <3.0, so 3.x/4.x makes requirements-dev.txt unresolvable.
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
    groups:
      python-dev-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The docs-scraper Lambda genuinely does install these at build time, so unlike
  # requirements-dev.txt a bump here reaches production.
  - package-ecosystem: "pip"
    directory: "/amplify/functions/operations/docs-scraper"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(py-deps)"
    groups:
      docs-scraper-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base image for the same Lambda container.
  - package-ecosystem: "docker"
    directory: "/amplify/functions/operations/docs-scraper"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"

  # Base image of the VayuLok weather-insights Cloud Run service. cloudbuild.yaml
  # in the same folder runs its check step on the same node image, and nothing
  # here updates that file, so move it to the same tag when merging a bump.
  - package-ecosystem: "docker"
    directory: "/gcp/vayulok-weather-insights"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions used by the workflows. Without this the action majors silently age;
  # they were four majors behind (checkout v4 vs v7) before this entry existed.
  # Each action is pinned to a full commit SHA with its release tag as a trailing
  # comment (`@<sha> # v7.0.1`); Dependabot updates the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
