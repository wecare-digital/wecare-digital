name: Migrate product images from Wix CDN to S3

# This is a two-phase, idempotent migration, not a store or payment deployment.
# No ProductsTable refs change until every image is verified on S3/CloudFront.
on:
  pull_request:
    branches: [stack]
    paths:
      - 'scripts/migrate_wix_product_images_to_s3.py'
      - 'tests/test_catalog_media_migration.py'
      - '.github/workflows/catalog-media-migrate.yml'
  push:
    branches: [stack]
    paths:
      - 'scripts/migrate_wix_product_images_to_s3.py'
      - '.github/workflows/catalog-media-migrate.yml'
  workflow_dispatch:
    inputs:
      action:
        required: true
        default: audit
        type: choice
        options: [audit, apply]

permissions:
  contents: read

concurrency:
  group: native-storefront-catalog-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest boto3==1.43.98
      - name: Validate signatures, domain allowlist and write gates
        run: |
          python -m py_compile scripts/migrate_wix_product_images_to_s3.py
          python -m pytest -q tests/test_catalog_media_migration.py

  apply:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/stack') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/stack')
    runs-on: ubuntu-26.04
    # Pushes to `stack` with the stack-bot deploy key: the `stack: required checks` ruleset lets
    # only that key bypass, and the key lives in an environment only `stack` jobs can read.
    environment: stack-bot
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stack
          ssh-key: ${{ secrets.STACK_DEPLOY_KEY }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3==1.43.98
      - name: Assume limited migration role (only ProductsTable + catalog S3 prefix)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-product-media-migration
          aws-region: us-east-1
          role-session-name: native-catalog-media-migration
      - name: Confirm account and show read-only inventory
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "775261844268"
          python scripts/migrate_wix_product_images_to_s3.py
      - name: Copy and verify all images before updating authority
        run: python scripts/migrate_wix_product_images_to_s3.py --apply
      - name: Generate public storefront snapshot from migrated AWS catalog
        run: python scripts/build-catalog-snapshot.py --live
      - name: Validate snapshot and prevent mass product removal
        run: python scripts/check_native_catalog_snapshot.py --restore-if-unchanged
      - name: Publish materially changed catalog snapshot
        shell: bash
        run: |
          if git diff --quiet -- src/content/catalog-snapshot.json; then
            echo "No public catalog image change to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/catalog-snapshot.json
          git commit -m "chore(catalog): serve product images from AWS CloudFront"
          git push origin HEAD:stack

  audit:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'audit'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3==1.43.98
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-product-media-migration
          aws-region: us-east-1
      - run: python scripts/migrate_wix_product_images_to_s3.py
