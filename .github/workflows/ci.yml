name: CI

on:
  pull_request:
  push:
    branches:
      - wecare.digital
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@').at(-1)")"
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"
          npm ci

      - name: Install Python test deps
        run: python -m pip install boto3 pytest

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: node scripts/check_lint_warning_ratchet.mjs

      - name: Test
        run: npm test

      - name: Python tests
        run: python -m pytest tests/python -q
        env:
          PYTHONPATH: amplify/functions/shared

      - name: Offline release contracts
        run: python scripts/check_release_contracts.py


      - name: Stage checkout artifacts offline
        run: python scripts/stage_shop_checkout_packages.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/shop-release"
