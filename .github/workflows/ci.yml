name: CI

on:
  pull_request:
  push:
    branches:
      - wecare.digital
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A PR's synthetic merge checkout must include its base parent.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm_version="$(node -p "require('./package.json').packageManager.split('@').at(-1)")"
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"
          npm ci

      - name: Install Python test deps
        run: python -m pip install boto3 pytest

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        env:
          WECARE_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The event's base SHA can be older than the base parent of the depth-2 merge
          # checkout when the base branch moved just before the run ("fatal: not a tree
          # object"). Fetch that one commit so the warning budget compares against it.
          if [ -n "$WECARE_LINT_BASE_SHA" ] && ! git cat-file -e "$WECARE_LINT_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$WECARE_LINT_BASE_SHA"
          fi
          node scripts/check_lint_warning_ratchet.mjs

      - name: Test
        run: npm test

      - name: Python tests
        run: python -m pytest tests/python -q
        env:
          PYTHONPATH: amplify/functions/shared

      - name: Offline release contracts
        run: python scripts/check_release_contracts.py


      - name: Stage checkout artifacts offline
        run: python scripts/stage_shop_checkout_packages.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/shop-release"


      - name: Stage and verify Arogya artifacts offline
        run: |
          python scripts/build_arogya_booking.py --output "$RUNNER_TEMP/arogya-release"
          python scripts/build_arogya_booking.py --output "$RUNNER_TEMP/arogya-release" --verify

      - name: Stage and verify customer OTP artifact offline
        run: python scripts/stage_customer_auth_package.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/customer-auth-release"

      - name: Stage and verify security runtime artifacts offline
        run: python scripts/stage_security_runtime_packages.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/security-runtime-release"
