name: CI

on:
  pull_request:
  push:
    branches:
      - wecare.digital
      - main
      - master

jobs:
  verify:
    name: Verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production data safety guard
        run: node scripts/check_production_data_safety.cjs
