name: Menu cross-browser

on:
  pull_request:
    paths:
      - 'src/components/Header.tsx'
      - 'src/components/VoiceSearchMic.tsx'
      - 'src/components/ElsewhereTravelAssistant.tsx'
      - 'src/pages/elsewhere/activities.tsx'
      - 'src/components/Footer.tsx'
      - 'src/components/PublicShare.tsx'
      - 'src/components/SupportWidget.tsx'
      - 'src/components/WorkflowTerminal.tsx'
      - 'src/components/RotatingHero.tsx'
      - 'src/components/ProductPage.tsx'
      - 'src/pages/anew.tsx'
      - 'src/pages/expo-week.tsx'
      - 'src/pages/niji-setu.tsx'
      - 'src/pages/hunar/**'
      - 'src/pages/shipments/track.tsx'
      - 'src/pages/elsewhere/visa.tsx'
      - 'src/pages/elsewhere/trip.tsx'
      - 'src/pages/dastavez/**'
      - 'src/pages/ritual-guru/**'
      - 'src/components/LegalDocument.tsx'
      - 'src/pages/privacy.tsx'
      - 'src/pages/terms.tsx'
      - 'src/components/VayuLok*.tsx'
      - 'src/components/public/**'
      - 'src/pages/index.tsx'
      - 'src/pages/grahak-os/**'
      - 'src/pages/vayulok/**'
      - 'public/vayulok-globe.html'
      - 'src/pages/_app.tsx'
      - 'src/pages/_document.tsx'
      - 'src/styles/Layout.css'
      - 'src/styles/tokens.css'
      - 'tools/browser/menucheck.js'
      - 'tools/browser/**'
      - '.github/workflows/menu-cross-browser.yml'
  push:
    branches: [ stack ]
    paths:
      - 'src/components/Header.tsx'
      - 'src/components/VoiceSearchMic.tsx'
      - 'src/components/ElsewhereTravelAssistant.tsx'
      - 'src/pages/elsewhere/activities.tsx'
      - 'src/components/Footer.tsx'
      - 'src/components/PublicShare.tsx'
      - 'src/components/SupportWidget.tsx'
      - 'src/components/WorkflowTerminal.tsx'
      - 'src/components/RotatingHero.tsx'
      - 'src/components/ProductPage.tsx'
      - 'src/pages/anew.tsx'
      - 'src/pages/expo-week.tsx'
      - 'src/pages/niji-setu.tsx'
      - 'src/pages/hunar/**'
      - 'src/pages/shipments/track.tsx'
      - 'src/pages/elsewhere/visa.tsx'
      - 'src/pages/elsewhere/trip.tsx'
      - 'src/pages/dastavez/**'
      - 'src/pages/ritual-guru/**'
      - 'src/components/LegalDocument.tsx'
      - 'src/pages/privacy.tsx'
      - 'src/pages/terms.tsx'
      - 'src/components/VayuLok*.tsx'
      - 'src/components/public/**'
      - 'src/pages/index.tsx'
      - 'src/pages/grahak-os/**'
      - 'src/pages/vayulok/**'
      - 'public/vayulok-globe.html'
      - 'src/pages/_app.tsx'
      - 'src/pages/_document.tsx'
      - 'src/styles/Layout.css'
      - 'src/styles/tokens.css'
      - 'tools/browser/menucheck.js'
      - 'tools/browser/**'
      - '.github/workflows/menu-cross-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public export once
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm version pinned by packageManager
        shell: bash
        run: |
          PINNED_NPM="$(node -e "const p=require('./package.json').packageManager;process.stdout.write(p.slice(p.lastIndexOf('@')+1))")"
          npm install --global "npm@${PINNED_NPM}"
          echo "npm $(npm --version)"
          test "$(npm --version)" = "$PINNED_NPM"

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      # The browser matrix must not build the public site independently. Three concurrent
      # exports fan out hundreds of blog reads and can make the upstream API return HTTP 429
      # before Firefox/WebKit ever launch. Build once, then test identical exported bytes in
      # every engine.
      - name: Build production export
        run: npm run build

      - name: Upload production export
        uses: actions/upload-artifact@v7
        with:
          name: menu-public-export-${{ github.sha }}
          path: out/
          retention-days: 1

  menu:
    name: Menu - ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download production export
        uses: actions/download-artifact@v8
        with:
          name: menu-public-export-${{ github.sha }}
          path: out

      - name: Install browser harness
        run: npm ci --no-audit --no-fund --prefix tools/browser

      - name: Install ${{ matrix.browser }} and native dependencies
        run: node tools/browser/node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}

      - name: Run menu compatibility contract
        run: node tools/browser/menucheck.js --${{ matrix.browser }}

      - name: Run Elsewhere assistant touch contract
        run: node tools/browser/elsewherecheck.js --${{ matrix.browser }}

      - name: Run migrated public-page device + 200% reflow contracts
        run: |
          node tools/browser/devicecheck.js --${{ matrix.browser }} / /grahak-os/ /vayulok/ /elsewhere/activities/ /terms/ /privacy/ /anew/ /expo-week/ /niji-setu/ /hunar/kaushal/ /hunar/prastuti/ /shipments/track/ /elsewhere/visa/ /elsewhere/trip/ /dastavez/drafting/ /dastavez/registration/ /dastavez/legal-reference/ /ritual-guru/ritva/ /ritual-guru/puja-guidance/ /ritual-guru/diy-puja-kit/
          node tools/browser/rtlcheck.js --${{ matrix.browser }} / /grahak-os/ /vayulok/ /elsewhere/activities/ /terms/ /privacy/ /anew/ /expo-week/ /niji-setu/ /hunar/kaushal/ /hunar/prastuti/ /shipments/track/ /elsewhere/visa/ /elsewhere/trip/ /dastavez/drafting/ /dastavez/registration/ /dastavez/legal-reference/ /ritual-guru/ritva/ /ritual-guru/puja-guidance/ /ritual-guru/diy-puja-kit/
