name: Customer commerce OAuth and sign-in safety

on:
  pull_request:
    branches: [wecare.digital]
    paths:
      - "amplify/functions/ai/customer-commerce-mcp/**"
      - "tools/customer-commerce/**"
      - ".github/workflows/customer-commerce-auth-qa.yml"
  push:
    branches: [wecare.digital]
    paths:
      - "amplify/functions/ai/customer-commerce-mcp/**"
      - "tools/customer-commerce/**"
      - ".github/workflows/customer-commerce-auth-qa.yml"

permissions:
  contents: read

jobs:
  auth-contract:
    name: Auth and commerce contract (no AWS writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile customer-commerce source
        run: python -m compileall -q amplify/functions/ai/customer-commerce-mcp
      - name: Verify commerce tool safety
        run: python tools/customer-commerce/verify.py
      - name: Verify OAuth and web sign-in
        run: python tools/customer-commerce/verify_oauth.py
      - name: Verify website and OAuth session isolation
        run: python tools/customer-commerce/verify_auth_isolation.py
      - name: Public website sign-in routing smoke (no OTP, no payment)
        env:
          SITE_AUTH_BASE: https://wecare.digital/auth/state
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          for suffix in ('', '?utm_source=chatgpt.com'):
              uri = os.environ['SITE_AUTH_BASE'] + suffix
              request = Request(uri, headers={'Accept': 'application/json', 'User-Agent': 'WECARE-auth-qa/1'})
              try:
                  with urlopen(request, timeout=20) as response:
                      status = response.status
                      payload = json.loads(response.read(8192))
              except HTTPError as error:
                  raise AssertionError('Auth state returned HTTP ' + str(error.code) + ' for ' + ('tracked' if suffix else 'clean')) from None
              assert status == 200, 'Unexpected auth state HTTP status'
              assert payload.get('phase') == 'phone' and payload.get('website') is True, 'Unexpected auth init response'
              print(('tracked' if suffix else 'clean') + ' sign-in initialization: PASS (HTTP 200)')
          PY
