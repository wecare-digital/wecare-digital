name: Native catalog admin API deploy
# catalog-publishing-v2 deploy ownership: guarded artwork + channel fields ship through this workflow

on:
  pull_request:
    branches: [stack]
    paths:
      - 'amplify/functions/ecommerce/native-catalog-admin/**'
      - 'scripts/provision_native_catalog_api.py'
      - 'tests/test_native_catalog_admin.py'
      - '.github/workflows/native-catalog-admin-deploy.yml'
  push:
    branches: [stack]
    paths:
      - 'amplify/functions/ecommerce/native-catalog-admin/**'
      - 'scripts/provision_native_catalog_api.py'
      - '.github/workflows/native-catalog-admin-deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        required: true
        default: verify
        type: choice
        options: [verify, apply]

permissions:
  contents: read

concurrency:
  group: native-catalog-admin-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest boto3==1.43.98
      - name: Unit tests and syntax
        run: |
          python -m py_compile scripts/provision_native_catalog_api.py amplify/functions/ecommerce/native-catalog-admin/handler.py
          python -m pytest -q tests/test_native_catalog_admin.py
          python scripts/provision_native_catalog_api.py

  deploy:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/stack') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/stack')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3==1.43.98
      - name: Assume catalog-scoped GitHub OIDC deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-native-catalog-deploy
          role-session-name: native-catalog-admin-deploy
          aws-region: us-east-1
      - name: Require correct AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "775261844268"
      - name: Deploy only native catalog editor Lambda and routes
        run: python scripts/provision_native_catalog_api.py --apply
      - name: Confirm live alias and exact API Gateway targets
        run: python scripts/provision_native_catalog_api.py --verify
      - name: Anonymous access must be rejected
        # Probe the public route the editor calls, without credentials. This covers API
        # Gateway routing as well as the handler's own auth, and needs no
        # lambda:InvokeFunction on the deploy role (which deliberately does not have it).
        shell: bash
        run: |
          url="https://zllr9lrg7j.execute-api.us-east-1.amazonaws.com/prod/native-catalog/products"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --max-time 20 "$url")
          if [ "$status" != "401" ]; then
            echo "Anonymous staff API returned $status, expected 401" >&2
            exit 1
          fi
          echo "PASS: unauthenticated catalog access denied"

  verify:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3==1.43.98
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-native-catalog-deploy
          aws-region: us-east-1
      - run: python scripts/provision_native_catalog_api.py --verify
