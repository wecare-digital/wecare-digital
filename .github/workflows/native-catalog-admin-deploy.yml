name: Native catalog admin deploy

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/native-catalog-admin-deploy.yml'
      - 'amplify/functions/ecommerce/native-catalog-admin/**'
      - 'amplify/functions/shared/lambda_utils/middleware.py'
      - 'scripts/provision_native_catalog_api.py'
      - 'tests/test_native_catalog_admin.py'
      - 'tests/test_native_catalog_api_provisioner.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-catalog-admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deploy/test dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.98 pytest

      - name: Assume catalog-only deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-native-catalog-deploy
          role-session-name: native-catalog-admin-deploy
          aws-region: us-east-1

      - name: Require production account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "775261844268"

      - name: Compile and regression test
        run: |
          python -m py_compile             amplify/functions/ecommerce/native-catalog-admin/handler.py             scripts/provision_native_catalog_api.py
          python -m pytest             tests/test_native_catalog_admin.py             tests/test_native_catalog_api_provisioner.py -q

      - name: Dry-run package
        run: python scripts/provision_native_catalog_api.py

      - name: Deploy native catalog admin
        run: python scripts/provision_native_catalog_api.py --apply

      - name: Verify native catalog admin
        run: python scripts/provision_native_catalog_api.py --verify
