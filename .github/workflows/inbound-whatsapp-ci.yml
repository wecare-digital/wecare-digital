name: Inbound WhatsApp CI

on:
  pull_request:
    paths:
      - "amplify/functions/messaging/inbound-whatsapp-handler/**"
      - "amplify/functions/shared/lambda_utils/**"
      - "tests/test_whatsapp_new_webhook_fields.py"
      - "scripts/deploy_all_lambdas.py"
      - ".github/workflows/inbound-whatsapp-ci.yml"
  push:
    branches:
      - "wecare.digital"
    paths:
      - "amplify/functions/messaging/inbound-whatsapp-handler/**"
      - "amplify/functions/shared/lambda_utils/**"
      - "tests/test_whatsapp_new_webhook_fields.py"
      - "scripts/deploy_all_lambdas.py"
      - ".github/workflows/inbound-whatsapp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile inbound WhatsApp Python
        run: |
          python -m compileall -q             amplify/functions/messaging/inbound-whatsapp-handler             amplify/functions/shared/lambda_utils

      - name: Verify newer WhatsApp webhook capture
        run: python -m unittest tests/test_whatsapp_new_webhook_fields.py

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check boto3==1.43.116

      - name: Build deterministic inbound package
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          script = Path("scripts/deploy_all_lambdas.py")
          spec = importlib.util.spec_from_file_location("deploy_all_lambdas", script)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          target = "wecare-inbound-whatsapp"
          by_name = {s.name: s for s in mod.SPECS}
          payload, members = mod.build_zip(by_name[target])

          out = Path("dist/inbound-whatsapp")
          out.mkdir(parents=True, exist_ok=True)
          archive = out / f"{target}.zip"
          archive.write_bytes(payload)

          digest = hashlib.sha256(payload).digest()
          manifest = {
              "function": target,
              "file": archive.name,
              "sha256_hex": digest.hex(),
              "aws_code_sha256": base64.b64encode(digest).decode("ascii"),
              "bytes": len(payload),
              "members": len(members),
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload tested inbound package
        uses: actions/upload-artifact@v4
        with:
          name: inbound-whatsapp-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/inbound-whatsapp/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wecare.digital'
    needs: package
    concurrency:
      group: inbound-whatsapp-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: inbound-whatsapp-${{ github.sha }}
          path: dist/inbound-whatsapp

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-inbound-whatsapp-deploy-oidc
          aws-region: us-east-1
          allowed-account-ids: "775261844268"
          role-session-name: inbound-whatsapp-${{ github.run_id }}

      - name: Publish verified inbound Lambda package
        shell: bash
        run: |
          set -euo pipefail
          cd dist/inbound-whatsapp

          fn="wecare-inbound-whatsapp"
          expected="$(jq -r '.aws_code_sha256' manifest.json)"
          revision="$(aws lambda get-function-configuration             --function-name "${fn}" --query RevisionId --output text)"
          alias_revision="$(aws lambda get-alias             --function-name "${fn}" --name live --query RevisionId --output text)"

          aws lambda update-function-code             --function-name "${fn}"             --zip-file "fileb://${fn}.zip"             --revision-id "${revision}"             --no-publish >/dev/null

          aws lambda wait function-updated-v2 --function-name "${fn}"

          latest="$(aws lambda get-function-configuration             --function-name "${fn}"             --query '{sha:CodeSha256,revision:RevisionId}' --output json)"
          actual="$(jq -r .sha <<<"${latest}")"
          latest_revision="$(jq -r .revision <<<"${latest}")"

          if [[ "${actual}" != "${expected}" ]]; then
            echo "Hash mismatch for ${fn}: expected ${expected}, got ${actual}" >&2
            exit 1
          fi

          version="$(aws lambda publish-version             --function-name "${fn}"             --description "inbound-whatsapp ${GITHUB_SHA}"             --code-sha256 "${expected}"             --revision-id "${latest_revision}"             --query Version --output text)"

          aws lambda update-alias             --function-name "${fn}"             --name live             --function-version "${version}"             --revision-id "${alias_revision}" >/dev/null

          live_sha="$(aws lambda get-function-configuration             --function-name "${fn}" --qualifier live             --query CodeSha256 --output text)"

          if [[ "${live_sha}" != "${expected}" ]]; then
            echo "Live alias hash mismatch for ${fn}: expected ${expected}, got ${live_sha}" >&2
            exit 1
          fi

          echo "${fn} live -> v${version} ${live_sha}"
