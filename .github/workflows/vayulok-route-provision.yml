name: VayuLok route provision

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/vayulok-route-provision.yml'
      - 'amplify/functions/core/vayulok-environment/**'
      - 'scripts/provision_vayulok_environment.py'
      - 'tests/test_vayulok_environment.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vayulok-route-provision-production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned AWS SDK
        run: python -m pip install --disable-pip-version-check boto3==1.43.98 pytest
      - name: Assume VayuLok deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-runtime-deploy
          role-session-name: vayulok-route-provision
          aws-region: us-east-1
      - name: Validate VayuLok source
        run: |
          python -m py_compile amplify/functions/core/vayulok-environment/handler.py
          python -m py_compile scripts/provision_vayulok_environment.py
          python -m pytest -q tests/test_vayulok_environment.py
      - name: Provision VayuLok backend
        run: python scripts/provision_vayulok_environment.py
      - name: Verify VayuLok backend
        run: python scripts/provision_vayulok_environment.py --verify
