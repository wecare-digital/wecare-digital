name: Conversations publish
# Validation and live audit for Conversations batches, checked against the AWS-native blog
# contract (scripts/blog_native_contract.py).
#
# NOTHING HERE PUBLISHES. Publication belongs to AWS-native Blog Studio, where an operator
# releases a signed-off article and wecare-seo-tools performs the write. The `publish`
# input is kept only so an old dispatch that still sets it fails loudly instead of silently
# doing nothing.
#
# A push or a pull request can only validate. `validate` reports the READY_TO_PUBLISH queue:
# only records whose eleven `gate` answers a human has recorded reach it, so a manifest full
# of ungated records queues nothing. The audit reads published posts back through the
# public read route of wecare-seo-tools and needs a dispatch naming a manifest.

on:
  pull_request:
    branches: [ stack ]
    paths:
      - 'content/conversations/**'
      - 'scripts/conversations_batch.py'
      - 'scripts/conversations_archive_triage.py'
      - 'scripts/blog_native_contract.py'
      - 'scripts/blog_quality_v2.py'
      - 'scripts/blog_ledger.py'
      - 'tests/test_conversations_batch.py'
      - 'tests/test_conversations_archive_triage.py'
      - '.github/workflows/conversations-publish.yml'
  push:
    branches: [ conversations-publishing ]
    paths:
      - 'content/conversations/**'
      - 'scripts/conversations_batch.py'
      - 'scripts/conversations_archive_triage.py'
      - 'scripts/blog_native_contract.py'
      - 'tests/test_conversations_batch.py'
      - 'tests/test_conversations_archive_triage.py'
      - '.github/workflows/conversations-publish.yml'
  workflow_dispatch:
    inputs:
      manifest:
        # Optional so the workflow can be dispatched as a validate-only smoke run before
        # any manifest exists. A path that is NAMED but missing still fails loudly; only a
        # deliberately blank input skips. The audit runs only when one is named.
        description: 'Batch manifest path. Blank validates the committed batches only.'
        required: false
        default: ''
        type: string
      publish:
        description: 'Retired compatibility input; publication now belongs to AWS Blog Studio'
        required: true
        default: false
        type: boolean
      audit:
        description: 'Read the published posts back off the live site'
        required: true
        default: true
        type: boolean
      commit_ledger:
        description: 'Commit the updated ledger back to conversations-publishing'
        required: false
        default: true
        type: boolean

# Runs queue rather than overlap. Nothing here writes to the live blog, so the lock only
# keeps two dispatched audits from interleaving their reports.
concurrency:
  group: conversations-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        # pytest only. This job holds no AWS role and validation needs no AWS SDK: the
        # native contract is checked on the committed Markdown itself.
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Runner contract tests
        run: |
          python -m pytest \
            tests/test_conversations_batch.py \
            tests/test_conversations_archive_triage.py -q

      - name: Validate every committed Conversations batch
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/conversations/batches/CONV-*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No Conversations batch manifests committed yet."
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            python scripts/conversations_batch.py validate --manifest "$file" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Validate the dispatched manifest
        if: github.event_name == 'workflow_dispatch' && inputs.manifest != ''
        run: |
          python scripts/conversations_batch.py validate \
            --manifest "${{ inputs.manifest }}"

  publish-request-retired:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - name: Refuse publication from this workflow
        run: |
          echo "::error::This workflow does not publish. Publish approved content through AWS-native Blog Studio."
          exit 1

  audit-only:
    # Reads a dispatched batch back off the live site. The role only needs to invoke the
    # public read route of wecare-seo-tools; the audit writes nothing to AWS.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == false && inputs.audit == true && inputs.manifest != ''
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.98
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-bharat-stack-seo-tools
          role-session-name: conversations-auditor
          aws-region: ${{ env.AWS_REGION }}
      - name: Audit the live posts
        run: |
          python scripts/conversations_batch.py audit \
            --manifest "${{ inputs.manifest }}"
