name: Conversations publish
# The production orchestrator for Conversations publication, replacing an external
# scheduler that nobody in this repository could see, resume or audit.
#
# VALIDATION AND AUDIT ONLY. Provider publication has moved to AWS-native Blog Studio.
# The legacy publish input is retained only so old dispatch callers fail explicitly instead of
# silently doing nothing or reviving a retired provider path.
#
# MUTATION REQUIRES AN EXPLICIT DISPATCH. A push or a pull request can only validate. The
# publish job additionally requires the `publish` input to be flipped to true, which is the
# same shape the Gastronomy gate uses and is the run-level human gate.
#
# The record-level human gate is enforced inside the runner: only records whose eleven
# `gate` answers a human has recorded reach READY_TO_PUBLISH, and only READY_TO_PUBLISH
# records are sent. A manifest full of ungated records publishes nothing.

on:
  pull_request:
    branches: [ stack ]
    paths:
      - 'content/conversations/**'
      - 'scripts/conversations_batch.py'
      - 'scripts/conversations_archive_triage.py'
      - 'scripts/wix_blog_migrate.py'
      - 'scripts/blog_quality_v2.py'
      - 'scripts/blog_ledger.py'
      - 'tests/test_conversations_batch.py'
      - 'tests/test_conversations_archive_triage.py'
      - '.github/workflows/conversations-publish.yml'
  push:
    branches: [ conversations-publishing ]
    paths:
      - 'content/conversations/**'
      - 'scripts/conversations_batch.py'
      - 'scripts/conversations_archive_triage.py'
      - 'tests/test_conversations_batch.py'
      - 'tests/test_conversations_archive_triage.py'
      - '.github/workflows/conversations-publish.yml'
  workflow_dispatch:
    inputs:
      manifest:
        # Optional so the workflow can be dispatched as a validate-only smoke run before
        # any manifest exists. A path that is NAMED but missing still fails loudly; only a
        # deliberately blank input skips. Publishing without one is refused below.
        description: 'Batch manifest path. Blank validates the committed batches only.'
        required: false
        default: ''
        type: string
      publish:
        description: 'Retired compatibility input; publication now belongs to AWS Blog Studio'
        required: true
        default: false
        type: boolean
      audit:
        description: 'Read the published posts back off the live site'
        required: true
        default: true
        type: boolean
      commit_ledger:
        description: 'Commit the updated ledger back to conversations-publishing'
        required: false
        default: true
        type: boolean

# THE LOCK IS THE POINT. Publishing is idempotent by slug, but idempotence is decided by
# reading the live corpus first - so two runs overlapping between one run's read and its
# write can both conclude the same post is missing and both create it. A duplicate
# published article is the one failure here that cannot be undone afterwards, so runs
# queue rather than overlap, and nothing is cancelled mid-publish.
concurrency:
  group: conversations-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        # boto3 is needed even though this job holds no AWS role: the runner compiles each
        # body through wix_blog_migrate's Ricos compiler, and that module imports boto3 at
        # module scope. Compiling is pure and reaches no AWS API.
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 boto3==1.43.98

      - name: Runner contract tests
        run: |
          python -m pytest \
            tests/test_conversations_batch.py \
            tests/test_conversations_archive_triage.py -q

      - name: Validate every committed Conversations batch
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/conversations/batches/CONV-*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No Conversations batch manifests committed yet."
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            python scripts/conversations_batch.py validate --manifest "$file" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Validate the dispatched manifest
        if: github.event_name == 'workflow_dispatch' && inputs.manifest != ''
        run: |
          python scripts/conversations_batch.py validate \
            --manifest "${{ inputs.manifest }}"

  publish-request-retired:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - name: Refuse retired provider publication
        run: |
          echo "::error::Wix publication is retired. Publish approved content through AWS-native Blog Studio."
          exit 1

  audit-only:
    # An audit with no publish, for re-verifying a batch or rebuilding a lost VERIFIED
    # checkpoint from live state.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == false && inputs.audit == true && inputs.manifest != ''
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.98
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-bharat-stack-seo-tools
          role-session-name: conversations-auditor
          aws-region: ${{ env.AWS_REGION }}
      - name: Audit the live posts
        run: |
          python scripts/conversations_batch.py audit \
            --manifest "${{ inputs.manifest }}"
