name: Plivo drift check

# Detects changes made to the live Plivo control plane OUTSIDE this repository's
# tooling: the console, another script, or a person.
#
# Read-only by construction. `--drift` never converges, because a check that
# silently fixed drift would erase the evidence of what moved and when, and would
# make an unreviewed change to production call routing.
#
# Exit codes, which is why this job branches rather than just failing:
#   0  no drift
#   1  recoverable drift  - a callback URL or method moved. Fix with a reviewed
#                           --dry-run then --apply.
#   2  CRITICAL drift     - a protected invariant, the application identity, the
#                           number -> application binding, or the prohibited-SMS
#                           flag moved. Live call routing may be broken.
#   3  unreachable        - Plivo was never read, so NOTHING is known about live
#                           state. Distinct from 2 on purpose: this job reported a
#                           false CRITICAL on 2026-09-28 when the CI role lacked
#                           kms:Decrypt, because a failed credential read and a
#                           moved invariant shared one exit code.
#
# Scheduled daily rather than on push: drift is caused by out-of-band changes, so
# it does not correlate with commits. The manual trigger exists for use during a
# cutover window.

on:
  schedule:
    # 06:30 UTC = 12:00 IST, inside the Indian working day so a CRITICAL result
    # reaches someone who can act on it.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for the OIDC role assumption below

concurrency:
  group: plivo-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Plivo control-plane drift
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the provider SDK and boto3
        run: python -m pip install --quiet boto3 plivo

      # The drift check reads the Plivo credential from Secrets Manager, so it
      # needs AWS credentials. Configure PLIVO_DRIFT_ROLE_ARN as a repository
      # variable pointing at a role whose ONLY permission is
      # secretsmanager:GetSecretValue on the Plivo secret. Until that role exists
      # this job reports SKIPPED rather than failing, so adding the workflow does
      # not create a red build it cannot fix.
      - name: Check for an AWS role
        id: role
        run: |
          if [ -n "${{ vars.PLIVO_DRIFT_ROLE_ARN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.role.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PLIVO_DRIFT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Drift check
        if: steps.role.outputs.available == 'true'
        id: drift
        run: |
          set +e
          # plivo-reconcile has no .py suffix and re-execs into .venv only
          # when one exists, so it runs directly under the CI interpreter.
          ./scripts/plivo-reconcile --drift --json > drift.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat drift.json
          exit 0

      - name: Report
        if: always()
        run: |
          echo "### Plivo drift check" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.role.outputs.available }}" != "true" ]; then
            echo 'SKIPPED - repository variable `PLIVO_DRIFT_ROLE_ARN` is not set.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'This is not a pass. The live control plane was not inspected.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'Run `./scripts/plivo-reconcile --drift` locally in the meantime.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code="${{ steps.drift.outputs.exit_code }}"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat drift.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo 'No drift.' >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo 'RECOVERABLE drift. Review with `--dry-run`, then `--apply`.' \
                 >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            2) echo 'CRITICAL drift. Live call routing or a protected invariant moved.' \
                 >> "$GITHUB_STEP_SUMMARY"
               echo 'Do NOT `--apply` to fix it until the change is understood.' \
                 >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            # 3 is NOT a drift result. The check could not reach Plivo, so it compared
            # nothing and must not imply anything about live state. This branch exists
            # because exit 2 used to cover both, and a missing kms:Decrypt on the CI role
            # was consequently reported as live call routing having moved (2026-09-28).
            3) echo 'NOT A PASS, AND NOT DRIFT - Plivo could not be reached.' \
                 >> "$GITHUB_STEP_SUMMARY"
               echo '' >> "$GITHUB_STEP_SUMMARY"
               echo 'The live control plane was not inspected, so this run says nothing' \
                 >> "$GITHUB_STEP_SUMMARY"
               echo 'about whether it has drifted. Usual cause is the credential read:' \
                 >> "$GITHUB_STEP_SUMMARY"
               echo 'verify the role with `python scripts/provision_ci_plivo_drift_role.py --verify`.' \
                 >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            *) echo "Drift check failed to run (exit $code)." \
                 >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
