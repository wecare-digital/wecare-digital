name: VayuLok wind lock refresh

on:
  push:
    branches: [ feat/vayulok-global-wind-field ]
    paths:
      - package.json
      - .github/workflows/vayulok-wind-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[wind-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vayulok-global-wind-field
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh exact root lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(vayulok): refresh wind reader lock [wind-lock]"
          git push origin HEAD:feat/vayulok-global-wind-field