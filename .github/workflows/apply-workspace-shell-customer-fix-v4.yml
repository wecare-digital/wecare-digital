name: Apply shared Workspace shell and customer profile fix v4

on:
  push:
    branches:
      - feat/payments-home-mobile-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-home-mobile-foundation
          fetch-depth: 0

      - name: Apply corrected migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-workspace-shell-customer-fix-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''customer = replace_once(
              customer,
              "        name: formName, phone: fullPhone || undefined, email: formEmail || undefined,",
              "        name: formName, phone: fullPhone || undefined,",
              'create payload email',
          )'''
          new = '''customer = customer.replace(
              "        name: formName, phone: fullPhone || undefined, email: formEmail || undefined,",
              "        name: formName, phone: fullPhone || undefined,",
              1,
          )'''
          if script.count(old) != 1:
              raise SystemExit(f'create payload patch: expected one match, found {script.count(old)}')
          script = script.replace(old, new, 1)

          old_delete = "Path('.github/workflows/apply-workspace-shell-customer-fix-v2.yml').unlink()"
          new_delete = (
              "Path('.github/workflows/apply-workspace-shell-customer-fix-v2.yml').unlink()\n"
              "Path('.github/workflows/apply-workspace-shell-customer-fix-v3.yml').unlink()\n"
              "Path('.github/workflows/apply-workspace-shell-customer-fix-v4.yml').unlink()"
          )
          if script.count(old_delete) != 1:
              raise SystemExit(f'workflow cleanup patch: expected one match, found {script.count(old_delete)}')
          script = script.replace(old_delete, new_delete, 1)

          exec(compile(script, 'workspace-migration-v4', 'exec'))
          PY

      - name: Verify Python source contracts
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_customer_duplicate_resolution.py tests/test_workspace_shared_shell_customer_form.py

      - name: Verify TypeScript
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck --if-present

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(workspace): share auth shell and align customer profile"
          git push origin HEAD:feat/payments-home-mobile-foundation
