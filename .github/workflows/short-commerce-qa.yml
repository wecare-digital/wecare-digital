name: Short Commerce payment-safe regression

on:
  pull_request:
    branches: [wecare.digital]
    paths:
      - 'src/components/cart/**'
      - 'src/components/get/**'
      - 'src/styles/tokens.css'
      - 'scripts/check_design_drift.py'
      - 'src/lib/cart.ts'
      - 'src/components/orders/**'
      - 'src/lib/checkoutQuote.ts'
      - 'src/lib/customerInvoice.ts'
      - 'src/lib/serviceEntry.ts'
      - 'src/pages/cart.tsx'
      - 'src/pages/_app.tsx'
      - 'src/lib/whatsappBasket.ts'
      - 'src/pages/checkout/**'
      - 'src/lib/paymentVocabulary.ts'
      - 'amplify/functions/ecommerce/checkout/**'
      - 'amplify/functions/messaging/inbound-whatsapp-handler/**'
      - 'amplify/functions/payments/razorpay-webhook/**'
      - 'amplify/functions/shared/lambda_utils/**'
      - 'amplify/functions/payments/invoice-engine/**'
      - 'amplify/functions/messaging/whatsapp-business-api/**'
      - 'scripts/check_whatsapp_templates_live.py'
      - 'tests/test_whatsapp_flow_template_audit.py'
      - 'tests/test_drop_docs_published_flow_audit.py'
      - 'scripts/check_drop_docs_published_flow_live.py'
      - 'amplify/functions/shared/lambda_utils/canonical_flows.py'
      - 'amplify/functions/shared/lambda_utils/whatsapp_templates.py'
      - 'scripts/test-short-commerce-part1.mjs'
      - 'scripts/verify_whatsapp_catalog_payment_rail.py'
      - 'scripts/check_short_commerce_live.py'
      - 'tests/test_short_commerce_live.py'
      - 'tests/test_short_commerce_part1.py'
      - 'tests/test_orders_single_page_contract.py'
      - 'tests/test_vault_review_pay_image_compatibility_20261031.py'
      - 'tests/test_short_purchase_policy.py'
      - 'scripts/deploy_all_lambdas.py'
      - 'scripts/check_short_commerce_packages.py'
      - 'tests/test_short_commerce_packages.py'
      - '.github/workflows/short-commerce-qa.yml'
  push:
    branches: [wecare.digital]
    paths:
      - 'src/components/cart/**'
      - 'src/components/get/**'
      - 'src/styles/tokens.css'
      - 'scripts/check_design_drift.py'
      - 'src/lib/cart.ts'
      - 'src/components/orders/**'
      - 'src/lib/checkoutQuote.ts'
      - 'src/lib/customerInvoice.ts'
      - 'src/lib/serviceEntry.ts'
      - 'src/pages/cart.tsx'
      - 'src/pages/_app.tsx'
      - 'src/lib/whatsappBasket.ts'
      - 'src/pages/checkout/**'
      - 'src/lib/paymentVocabulary.ts'
      - 'amplify/functions/ecommerce/checkout/**'
      - 'amplify/functions/messaging/inbound-whatsapp-handler/**'
      - 'amplify/functions/payments/razorpay-webhook/**'
      - 'amplify/functions/shared/lambda_utils/**'
      - 'amplify/functions/payments/invoice-engine/**'
      - 'amplify/functions/messaging/whatsapp-business-api/**'
      - 'scripts/check_whatsapp_templates_live.py'
      - 'tests/test_whatsapp_flow_template_audit.py'
      - 'tests/test_drop_docs_published_flow_audit.py'
      - 'scripts/check_drop_docs_published_flow_live.py'
      - 'amplify/functions/shared/lambda_utils/canonical_flows.py'
      - 'amplify/functions/shared/lambda_utils/whatsapp_templates.py'
      - 'scripts/test-short-commerce-part1.mjs'
      - 'scripts/verify_whatsapp_catalog_payment_rail.py'
      - 'scripts/check_short_commerce_live.py'
      - 'tests/test_short_commerce_live.py'
      - 'tests/test_short_commerce_part1.py'
      - 'tests/test_orders_single_page_contract.py'
      - 'tests/test_vault_review_pay_image_compatibility_20261031.py'
      - 'tests/test_short_purchase_policy.py'
      - 'scripts/deploy_all_lambdas.py'
      - 'scripts/check_short_commerce_packages.py'
      - 'tests/test_short_commerce_packages.py'
      - '.github/workflows/short-commerce-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-ui-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/test-short-commerce-part1.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_short_commerce_part1.py tests/test_orders_single_page_contract.py tests/test_vault_review_pay_image_compatibility_20261031.py tests/test_drop_docs_published_flow_audit.py
      - run: python -m unittest discover -s tests -p test_short_purchase_policy.py
      - name: Release attestation checker (offline, no AWS access)
        run: python -m unittest discover -s tests -p test_short_commerce_live.py
      # The four legacy token gaps were corrected on the default branch (issue #1970).
      # Keep the canonical contract strict: design regressions now fail this job,
      # alongside the required checkout, payment, and invoice safety checks.
      - name: Public design drift gate
        run: python scripts/check_design_drift.py --gate

  hermetic-payment-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      # Use the production packager to verify the exact ZIP bytes for checkout,
      # commerce and inbound WhatsApp without accessing AWS or payment services.
      # This prevents a passing source-level test from masking an incomplete ZIP.
      - name: Off-cloud payment Lambda ZIP integrity gate
        run: |
          uv run --no-project --python 3.12 --with boto3==1.43.116 \
            python -m unittest discover -s tests -p test_short_commerce_packages.py
          uv run --no-project --python 3.12 --with boto3==1.43.116 \
            python scripts/check_short_commerce_packages.py
      # Synthetic live-template definitions only: the verifier imports the
      # production lambda_utils package, which requires boto3. No AWS calls.
      - name: Canonical WhatsApp Flow-button audit (offline)
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: >
          uv run --no-project --python 3.12 --with boto3==1.43.116
          python -m unittest discover -s tests -p test_whatsapp_flow_template_audit.py
      # Real production handlers; fake AWS in moto; fake Meta and Razorpay endpoints;
      # no cloud credentials or payment resources. Never a production smoke charge.
      - run: >
          uv run --no-project --python 3.12
          --with boto3==1.43.116
          --with 'moto[dynamodb,cognitoidp]==5.2.4'
          python scripts/verify_whatsapp_catalog_payment_rail.py
      # Preserve the base branch's native short-only payment-safety regression.
      # Website full-cart quoting stays a separate hermetic scenario in this script.
      - name: Opt-in native one-unit hermetic payment and refusal E2E
        run: >
          uv run --no-project --python 3.12
          --with boto3==1.43.116
          --with 'moto[dynamodb,cognitoidp]==5.2.4'
          python scripts/verify_whatsapp_catalog_payment_rail.py --short-only
