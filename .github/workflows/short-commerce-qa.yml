name: Short Commerce payment-safe regression

on:
  pull_request:
    branches: [wecare.digital]
    paths:
      - 'src/components/cart/**'
      - 'src/components/get/**'
      - 'src/styles/tokens.css'
      - 'scripts/check_design_drift.py'
      - 'src/lib/cart.ts'
      - 'src/lib/whatsappBasket.ts'
      - 'src/pages/checkout/**'
      - 'src/lib/paymentVocabulary.ts'
      - 'amplify/functions/ecommerce/checkout/**'
      - 'amplify/functions/messaging/inbound-whatsapp-handler/**'
      - 'amplify/functions/payments/razorpay-webhook/**'
      - 'amplify/functions/shared/lambda_utils/ecommerce/**'
      - 'scripts/test-short-commerce-part1.mjs'
      - 'scripts/verify_whatsapp_catalog_payment_rail.py'
      - 'scripts/check_short_commerce_live.py'
      - 'tests/test_short_commerce_live.py'
      - 'tests/test_short_commerce_part1.py'
      - 'tests/test_short_purchase_policy.py'
      - '.github/workflows/short-commerce-qa.yml'
  push:
    branches: [wecare.digital]
    paths:
      - 'src/components/cart/**'
      - 'src/components/get/**'
      - 'src/styles/tokens.css'
      - 'scripts/check_design_drift.py'
      - 'src/lib/cart.ts'
      - 'src/lib/whatsappBasket.ts'
      - 'src/pages/checkout/**'
      - 'src/lib/paymentVocabulary.ts'
      - 'amplify/functions/ecommerce/checkout/**'
      - 'amplify/functions/messaging/inbound-whatsapp-handler/**'
      - 'amplify/functions/payments/razorpay-webhook/**'
      - 'amplify/functions/shared/lambda_utils/ecommerce/**'
      - 'scripts/test-short-commerce-part1.mjs'
      - 'scripts/verify_whatsapp_catalog_payment_rail.py'
      - 'scripts/check_short_commerce_live.py'
      - 'tests/test_short_commerce_live.py'
      - 'tests/test_short_commerce_part1.py'
      - 'tests/test_short_purchase_policy.py'
      - '.github/workflows/short-commerce-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-ui-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/test-short-commerce-part1.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_short_commerce_part1.py
      - run: python -m unittest discover -s tests -p test_short_purchase_policy.py
      - name: Release attestation checker (offline, no AWS access)
        run: python -m unittest discover -s tests -p test_short_commerce_live.py
      # The four legacy token gaps were corrected on the default branch (issue #1970).
      # Keep the canonical contract strict: design regressions now fail this job,
      # alongside the required checkout, payment, and invoice safety checks.
      - name: Public design drift gate
        run: python scripts/check_design_drift.py --gate

  hermetic-payment-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      # Real production handlers; fake AWS in moto; fake Meta and Razorpay endpoints;
      # no cloud credentials or payment resources. Never a production smoke charge.
      - run: >
          uv run --no-project --python 3.12
          --with boto3==1.43.116
          --with 'moto[dynamodb,cognitoidp]==5.2.4'
          python scripts/verify_whatsapp_catalog_payment_rail.py
