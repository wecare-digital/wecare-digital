name: VayuLok live HTTP diagnostics

on:
  push:
    branches:
      - fix/vayulok-live-recovery-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check DNS, HTML route, and public assets (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import socket
          import urllib.error
          import urllib.parse
          import urllib.request

          HOSTS = ('wecare.digital', 'www.wecare.digital',
                   'd22dm4b0jn71jw.amplifyapp.com')
          URLS = (
              'https://wecare.digital/',
              'https://wecare.digital/vayulok/',
              'https://wecare.digital/vayulok/index.html',
              'https://wecare.digital/vayulok-globe.html',
              'https://www.wecare.digital/vayulok/',
              'https://d22dm4b0jn71jw.amplifyapp.com/vayulok/',
          )
          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'Mozilla/5.0 (compatible; VayuLokHealthCheck/1.0)',
                           'Accept': 'text/html,application/xhtml+xml,*/*'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      data = resp.read(1200000)
                      return {
                          'status': resp.status, 'final_url': resp.geturl(),
                          'content_type': resp.headers.get('content-type',''),
                          'cache': resp.headers.get('x-cache',''),
                          'body': data.decode('utf-8', errors='replace'),
                      }
              except urllib.error.HTTPError as e:
                  return {'status':e.code,'final_url':e.geturl(),
                          'content_type': e.headers.get('content-type',''),
                          'body':e.read(1024).decode('utf-8',errors='replace')}
              except Exception as e:
                  return {'error':type(e).__name__+': '+str(e)[:160]}
          for host in HOSTS:
              try:
                  ips = sorted({info[4][0] for info in socket.getaddrinfo(host,443,
                                                            proto=socket.IPPROTO_TCP)})
                  print('DNS',host,'count',len(ips),'first',ips[:2])
              except Exception as e:
                  print('DNS',host,'ERROR',type(e).__name__,str(e)[:160])
          results={}
          for url in URLS:
              r=fetch(url)
              body=r.pop('body','')
              fields=dict(r,bytes=len(body.encode('utf-8')),
                          has_vayulok='VayuLok' in body,
                          has_next_data='__NEXT_DATA__' in body,
                          has_hero='Bharat' in body)
              match=re.search(r'<script[^>]+id="__NEXT_DATA__"[^>]*>(.*?)</script>',
                              body, flags=re.S)
              if match:
                  try:
                      item=json.loads(match.group(1))
                      fields['next_page']=item.get('page')
                      fields['next_build_id']=item.get('buildId')
                  except Exception as e:
                      fields['next_parse_error']=str(e)[:100]
              assets=re.findall(r'<script[^>]+src="([^"]+)"',body)[:6]
              fields['script_count_sample']=len(assets)
              fields['scripts_sample']=assets[:3]
              results[url]={'fields':fields,'assets':assets}
              print('HTTP',url,json.dumps(fields,sort_keys=True))
          target=results.get('https://wecare.digital/vayulok/',{})
          for script in target.get('assets',[])[:5]:
              script_url=urllib.parse.urljoin('https://wecare.digital/vayulok/',script)
              r=fetch(script_url)
              print('ASSET',urllib.parse.urlsplit(script_url).path,
                    json.dumps({k:v for k,v in r.items() if k!='body'},sort_keys=True))
          route=target.get('fields',{})
          if route.get('status') != 200 or route.get('next_page') not in ('/vayulok',None):
              print('RESULT: VayuLok route appears unhealthy or serves the wrong Next page')
          else:
              print('RESULT: HTML route responds; verify client-side Maps and data API independently')
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install headless Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: Install browser runner
        run: npm install --no-save --no-audit --no-fund playwright-core@1.49.0
      - name: Render production page and classify public failures
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath:'/usr/bin/chromium',
              args:['--no-sandbox','--disable-dev-shm-usage'], headless:true});
            for (const url of ['https://wecare.digital/vayulok/',
              'https://www.wecare.digital/vayulok/']) {
              const page = await browser.newPage({viewport:{width:1280,height:800}});
              const failed=[];
              const consoleErrors=[];
              page.on('requestfailed',request=>{
                const u=new URL(request.url());
                failed.push({host:u.hostname,path:u.pathname,error:request.failure()?.errorText});
              });
              page.on('response',response=>{
                if (response.status()>=400) {
                  const u=new URL(response.url());
                  failed.push({status:response.status(),host:u.hostname,path:u.pathname});
                }
              });
              page.on('pageerror',error=>consoleErrors.push(String(error?.message||error).slice(0,240));
              page.on('console',msg=>{
                if (msg.type()==='error') {
                  const message=msg.text().replace(/AIza[0-9A-Za-z_-]{20,}/g,'[REDACTED_KEY]');
                  consoleErrors.push(message.slice(0,240));
                }
              });
              let nav=null;
              try {nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                await page.waitForTimeout(11000);
              }catch(e){consoleErrors.push('NAV '+String(e.message).slice(0,240));}
              const state=await page.evaluate(()=>{
                const txt=(s)=>document.querySelector(s)?.textContent?.trim()?.slice(0,140)||'';
                return {title:document.title,path:location.pathname,
                  h1:txt('h1'),hero:!!document.querySelector('.vl-shell'),
                  live:!!document.querySelector('.vl-live-shell'),
                  map:!!document.querySelector('.vl-live-map-canvas'),
                  mapPlaceholder:txt('.vl-live-map-placeholder'),
                  loading:txt('.vl-live-map-fallback'),
                  airText:txt('.vl-live-air-empty'),
                  mapFailed:!!document.querySelector('.vl-live-map-retry'),
                  googleMapsLoaded:!!(window.google&&window.google.maps),
                  iframeSrcHost:(()=>{
                    const frame=document.querySelector('.vag-frame');
                    if(!frame)return null;
                    try{return new URL(frame.src).hostname}catch{return 'invalid'}
                  })()}
                };
              });
              console.log('BROWSER_RESULT',JSON.stringify({url,navStatus:nav?.status(),state,
                failures:failed.slice(0,30),consoleErrors:consoleErrors.slice(0,20)}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(String(e.stack||e).replace(/AIza[0-9A-Za-z_-]{20,}/g,'[REDACTED_KEY]'));process.exitCode=1});
          JS
