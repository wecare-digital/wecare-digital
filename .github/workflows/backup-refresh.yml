name: Backup refresh

# Keeps the self-managed backups current so they never drift behind the account
# again. On 2026-10-16 the encrypted credential artifact was 20 days stale (10
# secrets had changed since), which is the failure this schedule exists to close.
#
# Runs `scripts/refresh_all_backups.py`, which rebuilds the encrypted credential
# backup from Secrets Manager (plaintext never touches disk), verifies it, refreshes
# the Cognito user export, mirrors secrets to GCP (best-effort), and reports a
# freshness check.
#
# Weekly + manual. Weekly rather than on push because backup staleness is driven by
# secret rotations and user changes, not commits. The manual trigger is for use right
# after a known rotation.
#
# Auth is gated on a repository variable so adding this workflow never creates a red
# build it cannot fix: without BACKUP_REFRESH_ROLE_ARN it reports SKIPPED, not failed.
# That role needs secretsmanager:(List|Describe|GetSecretValue), the backup KMS key's
# kms:(Encrypt|Decrypt|GenerateDataKey), s3:PutObject on the credential-backup bucket,
# and cognito-idp:(ListUsers|AdminListGroupsForUser) on the pool.

on:
  schedule:
    # 02:00 UTC Sunday — off-peak; a weekly cadence keeps the artifact well inside
    # any rotation window.
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC role assumption

concurrency:
  group: backup-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh self-managed backups
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install boto3 + cryptography
        run: python -m pip install --quiet boto3 cryptography

      - name: Check for an AWS role
        id: role
        run: |
          if [ -n "${{ vars.BACKUP_REFRESH_ROLE_ARN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.role.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.BACKUP_REFRESH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Refresh backups
        if: steps.role.outputs.available == 'true'
        id: refresh
        run: |
          set +e
          python scripts/refresh_all_backups.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: Report
        if: always()
        run: |
          echo "### Backup refresh" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.role.outputs.available }}" != "true" ]; then
            echo 'SKIPPED - repository variable `BACKUP_REFRESH_ROLE_ARN` is not set.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'This is not a pass. Backups were NOT refreshed. Run' \
              >> "$GITHUB_STEP_SUMMARY"
            echo '`python scripts/refresh_all_backups.py` locally in the meantime.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code="${{ steps.refresh.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo 'Backups refreshed and verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A required refresh step failed (exit $code). See the job log." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
