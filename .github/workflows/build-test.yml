name: Build and test

# THE GAP THIS FILLS. Before this workflow, no CI job compiled the app or ran its
# tests. The ten existing workflows cover CodeQL, route auth, provider policy, UI
# labels, plivo and the deploy jobs - all valuable, none of which would notice a
# broken build. A pull request could go green with a repo that does not compile, and
# the only build verification was whatever a human ran locally. The test suite is 181
# tests across 15 files and nothing was running it.
#
# Deliberately NOT a deploy workflow. It needs no AWS credentials and no secrets at
# all, which is why it can safely run on pull requests from any source.

on:
  pull_request:
  push:
    branches: [ stack ]
  workflow_dispatch:

# Least privilege: this job only ever reads the tree.
permissions:
  contents: read

# A second push to the same branch makes the first run redundant. Cancelling keeps the
# queue short without losing signal.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck and test
    # PINNED, not `ubuntu-latest`. GitHub moved the `ubuntu-latest` label to Ubuntu
    # 26.04 from 19 October 2026; pinning puts this job on 26.04 on our schedule rather
    # than on GitHub's, so a runner-image regression shows up in a commit we can point
    # at. It matters more here than in the other workflows because this is the only job
    # that depends on software the IMAGE ships rather than software a step installs:
    # the browser harness below resolves the preinstalled Chromium. Ubuntu 26.04 ships
    # Google Chrome and Chromium 153, so the fallback path still resolves. Bump this
    # label deliberately when the next LTS image goes GA, and re-run the harness.
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # package.json sets engines.node >= 24. Reading the version from .nvmrc rather
      # than hardcoding it keeps this file from drifting away from what developers run.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # For the "No server-side credential in the export" gate below, which is a Python
      # script because every other secret scanner in this repo is one and shares its
      # fingerprint convention. Declared explicitly rather than relying on `python`
      # happening to be on the runner's PATH: the image ships a python3, but an implicit
      # alias is precisely how a check turns into a silent no-op. The image's python3
      # also moves with the image - 26.04 carries a newer one than 24.04 did - which is
      # the second reason to pin the interpreter here rather than inherit it. Same
      # version and action as route-auth.yml. No dependencies are installed - the
      # script uses only the standard library.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # FAST PYTHON SYNTAX GATE.
      #
      # The full Python suite lives in route-auth.yml, while this primary build workflow
      # historically exercised only the web/TypeScript side. That allowed a malformed
      # Python test file to coexist with a green "Build and test" result until the separate
      # route-auth job reached pytest collection. Compile every Python source tree here
      # before dependency installation so a literal escaped newline, conflict marker, bad
      # indentation or other SyntaxError fails immediately and points at the exact file/line.
      # compileall parses bytecode only; it imports nothing and needs no third-party packages.
      - name: Gate - Python sources compile
        run: python -m compileall -q tests scripts amplify/functions

      - name: Report open braces advisory in both install roots
        run: python scripts/check_braces_advisory.py

      # `npm ci` AT LAST, AND THE PROBE THAT USED TO SIT HERE IS GONE WITH IT.
      #
      # This step was `npm install` for a long time, with a comment explaining that `npm ci`
      # could not install this repo at all: it failed with four
      # "Missing: @opentelemetry/core@2.0.0 from lock file" errors, because
      # @aws-amplify/data-construct and @aws-amplify/graphql-api-construct each bundle
      # @opentelemetry/resources@2.0.0 and sdk-trace-base@2.0.0 - which pin
      # @opentelemetry/core@2.0.0 exactly - beside a bundled @opentelemetry/core@2.8.0.
      # `npm install` trusts bundled deps; `npm ci` validates those edges and refuses.
      #
      # The defect is still real and still upstream. What changed is that those four packages
      # are no longer in THIS lockfile: they are backend-only, nothing outside amplify/ imports
      # them, and they now live in amplify/package.json as a separate install root. The web
      # app's lockfile went from 1922 packages to 783 and `npm ci` resolves it cleanly.
      # See docs/npm-ci-backend-isolation.md for the seven approaches that did not work.
      #
      # NO --legacy-peer-deps HERE, because the committed lockfile is generated with plain
      # `npm install` and there is nothing for the flag to resolve. Both spellings were
      # measured against this lockfile on npm 11.6.2 - the version `packageManager` pins -
      # and both exit 0 with the lock unchanged, so deps-upgrade.yml passing the flag to its
      # own gate is not a conflict.
      #
      # It is worth knowing that this was NOT true on npm 11.4.2, where
      # `npm ci --legacy-peer-deps` failed on an unrelated optional dependency
      # (@emnapi/runtime) against a lock generated without the flag. `setup-node` reads
      # .nvmrc for the Node version and takes whatever npm ships with it, so if that pairing
      # ever regresses, check the npm version first and match `packageManager`.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # THE LOCKFILE MUST NOT DRIFT, and `npm ci` alone does not prove that - it would happily
      # keep working while the committed lock slowly stopped matching package.json, because
      # `npm ci` is the command that never writes. This is the cheap version of the gate
      # deps-upgrade.yml runs: if `npm ci` rewrote the lock, the lock was not self-consistent.
      - name: Gate - the lockfile is self-consistent
        run: |
          if ! git diff --quiet package-lock.json; then
            echo "::error::npm ci modified package-lock.json - the committed lockfile is not self-consistent"
            git --no-pager diff --stat package-lock.json
            exit 1
          fi
          echo "package-lock.json unchanged by npm ci."

      # BEFORE THE BUILD, AND THAT ORDER IS THE WHOLE POINT.
      #
      # `npm run build` now starts by running this same generator WITHOUT --check, so it
      # rewrites config/public-pages.json in place. Run the check after the build and it can
      # never fail: the build has already repaired whatever drift existed, and the commit
      # stays stale while CI reports green.
      #
      # Stale matters here in a way it does not for most generated files, because the
      # catalogue is the one artifact that is COPIED rather than read: /mcp carries it inside
      # its deployment zip, so a stale commit means the endpoint keeps describing the old page
      # set until someone redeploys. That exact failure already happened once, when /my-order
      # became /orders.
      #
      # src/test/PublicAiSurface.test.ts asserts the same thing, and also runs after the build
      # for the same reason. Both are kept: this one names the fix in the failure annotation, and
      # the test keeps it true for anyone running `npx vitest` on a clean tree locally.
      - name: Gate - the public page catalogue matches the tree
        run: |
          if ! node scripts/generate-public-pages.js --check; then
            echo "::error::config/public-pages.json is stale. Run 'node scripts/generate-public-pages.js' and commit it, then redeploy /mcp with 'python scripts/deploy_mcp_server.py' so the endpoint stops describing the old page set."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check customer pages and public navigation
        run: |
          python3 scripts/checkout_release_check.py --export-dir out
          python3 scripts/sync_faq.py --check

      # THE BUILD MUST NOT HAVE CHANGED IT EITHER. The gate above proves the committed
      # catalogue was current before the build; this proves the build agreed, which is the
      # only way to catch a generator whose output depends on something `next build` produces.
      # It should not - the scan reads src/ and config/ only - and this is how that stays true.
      - name: Gate - the build did not rewrite the catalogue
        run: |
          if ! git diff --quiet config/public-pages.json; then
            echo "::error::npm run build modified config/public-pages.json, so the generator depends on build output. It is meant to read src/ and config/ only."
            git --no-pager diff config/public-pages.json
            exit 1
          fi
          echo "config/public-pages.json unchanged by the build."

      # A BACKSTOP, NOT THE REAL GATE, and the distinction matters enough to spell out.
      # output:'export' inlines every NEXT_PUBLIC_* value into a JS chunk served to
      # every visitor, so publishing a server-side credential is a real risk - this
      # repo has three secrets (wecare/google/cloud, wecare/google-api-key,
      # wecare/google-maps) all holding ONE unified key that is read server-side.
      #
      # But THIS workflow has no branch environment variables, so the export it builds
      # never contains that key and this step passes for free. It only catches a
      # credential committed into the source tree. The gate that can actually catch the
      # paste lives in `amplify.yml`, which runs inside the Amplify build where the
      # variables exist; `--amplify-env` answers the same question without a build.
      # Kept here anyway because a committed literal is worth catching early and the
      # step costs a second.
      - name: No server-side credential in the export (backstop; see amplify.yml)
        run: python scripts/verify_public_bundle_secrets.py

      # ORDER MATTERS: tsc must run AFTER the build, because it needs the generated
      # next-env.d.ts. Running it first produces a wall of errors about missing Next
      # types that look like real breakage.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Control skin fixture matches current source
        run: python scripts/census_control_skins.py --json | diff -u src/test/fixtures/control-skin-census.json -

      - name: Unit tests
        run: npx vitest run

      # THE BROWSER HARNESS, AND IT IS A GATE. Four of the five suites are green and
      # measure things no unit test can see, because they only exist once a browser has
      # resolved a clamp, run an animation or applied next/head's de-duplication rules.
      # Every one of them was written after a defect shipped that source inspection had
      # missed: a headline that grew 41px and shifted the page every 2400ms, a section-h2
      # rung that disagreed across pages, a language panel covering the WhatsApp button,
      # and fourteen routes sharing one og:title so every product previewed as the company
      # page. Running them here is what stops those coming back silently.
      #
      # No browser download. tools/browser depends on playwright-core, which never fetches
      # one, and lib/browser.js resolves whatever Chromium is already on the machine -
      # falling back to /usr/bin/google-chrome, which the ubuntu runner image ships. If it
      # finds nothing it throws naming every path it searched, so a missing browser reads
      # as a missing browser rather than as a test failure.
      #
      # It runs AFTER Build because the harness measures out/, the production export.
      - name: Browser harness (install)
        run: npm install --no-audit --no-fund --prefix tools/browser

      - name: Browser harness
        run: |
          node tools/browser/animcheck.js
          node tools/browser/seocheck.js
          node tools/browser/typecheck.js
          node tools/browser/uicheck.js
          node tools/browser/chromecheck.js

      # chromecheck needs no browser - it reads the built export - but it belongs in this
      # step because it needs `out/`, which only exists after the build above. It is a GATE,
      # not a report: the three failures it was written for all shipped to production, and
      # all three were invisible in the source. See the header of the file.

      # REPORTED, NOT ENFORCED, and for a reason that is not flakiness: contactcheck has
      # one assertion that cannot pass until the owner sets NEXT_PUBLIC_GOOGLE_MAPS_KEY.
      # A GATE, and it was not one before - which is exactly how 219 dead links reached the
      # live site unnoticed. blogcheck reconciles four sets against the built export: every
      # emitted /post/ page, every post linked from an index page, the sitemap, and the
      # search index. The failure it catches is structural rather than cosmetic: a per-slug
      # fetch that failed at build time became `notFound`, which under output:'export'
      # silently emits no page, while the index still rendered the card and the link.
      # Nothing in CI compared the two, so the only symptom was a 404 for a reader who
      # clicked. It runs after Build because it reads out/.
      - name: Blog export reconciliation
        run: node tools/audit/blogcheck.js
      # A GATE, alongside blogcheck and for the same class of reason: the defect it catches is
      # invisible on the page and only shows up as a rich result that never appears.
      #
      # seocheck.js already looked at JSON-LD and could not have caught any of this. It asserts
      # two things - every block parses, and no @id is defined twice on one page - and its own
      # source says "Neither is a truth check". It also drives a browser over 20 hardcoded
      # marketing routes, so /blog/ and /post/ were outside it entirely: 1,332 of the 1,353
      # URLs in the sitemap, i.e. the overwhelming majority of the indexable site.
      #
      # What that blind spot cost, measured on the live export: every one of the 1,279 post
      # pages emitted a BlogPosting with NO `image`, which Google documents as required on
      # Article - so all of them were ineligible for the rich result while the markup validated
      # cleanly. The Organization node was absent from those same pages plus ~54 blog index
      # pages, because _app.tsx renders its <Head> behind `!isContentPublic`.
      #
      # This reads out/ directly, so there is no route list to fall out of date, and it checks
      # required properties per type, @id references that resolve, and the specific self-serving
      # properties this graph removed on purpose. It runs after Build because it reads out/.
      - name: Structured data completeness
        run: node tools/audit/schemacheck.js
      # Three Google controls on the keyless map embed stay reachable without it. The
      # suite is still worth running for its other twelve assertions, so it is printed
      # rather than gated. Make it a gate on the day the key exists.
      - name: Contact map harness (reported, not enforced)
        continue-on-error: true
        run: node tools/browser/contactcheck.js

      # A GATE NOW, because the reason it could not be one is gone.
      #
      # This step used to run with `continue-on-error: true` and a note explaining that
      # lint was "pre-existing red" at 225 errors, most of them
      # react-hooks/set-state-in-effect, and that blocking on it "would fail every pull
      # request regardless of its contents, which trains people to ignore CI". That was a
      # correct read of the situation. It also meant 109 real defects sat behind a gate
      # nobody could switch on, including seven Date.now() calls during render (a genuine
      # hydration mismatch under output:'export') and nine components constructed during
      # render, whose subtrees remounted on every parent render.
      #
      # Those 109 are fixed and eslint reports 0 errors. `set-state-in-effect` is now a
      # warning, with the full reasoning recorded in eslint.config.mjs: it is a React
      # Compiler rule, React Compiler is not enabled here, and the pattern it flags is the
      # one React's own docs prescribe for synchronising with an external system.
      #
      # eslint exits non-zero on errors and zero on warnings, so this gates errors while
      # leaving the 179 advisory warnings visible in the log. No --max-warnings ceiling: a
      # warning budget is a second number to argue about, and the count is printed below
      # for anyone who wants to compare it against the base branch.
      - name: Lint
        run: |
          npx eslint . 2>&1 | tee /tmp/eslint.txt | tail -80
          exit "${PIPESTATUS[0]}"
