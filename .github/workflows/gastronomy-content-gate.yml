name: Gastronomy content gate

on:
  pull_request:
    branches: [ stack ]
    paths:
      - 'content/gastronomy/**'
      - 'scripts/gastronomy_batch.py'
      - 'tests/test_gastronomy_batch.py'
      - '.github/workflows/gastronomy-content-gate.yml'
  push:
    branches: [ gastronomy-quality ]
    paths:
      - 'content/gastronomy/**'
      - 'scripts/gastronomy_batch.py'
      - 'tests/test_gastronomy_batch.py'
      - '.github/workflows/gastronomy-content-gate.yml'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'V2 Gastronomy manifest path (1-150 posts; sequence must be reconciled before publishing)'
        required: true
        type: string
      publish:
        description: 'Retired compatibility input; publishing now belongs to AWS Blog Studio'
        required: true
        default: false
        type: boolean

concurrency:
  group: gastronomy-content-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest boto3
      - name: Run Gastronomy contract tests
        run: python -m pytest tests/test_gastronomy_batch.py -q
      - name: Validate committed manifests
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/gastronomy/batches/GAST-*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No Gastronomy manifests committed yet."
            exit 0
          fi
          for file in "${files[@]}"; do
            python scripts/gastronomy_batch.py validate --manifest "$file"
          done

  publish-request-retired:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - name: Refuse retired provider publication
        run: |
          echo "::error::This workflow is validation-only. Wix publishing is retired; publish through the AWS-native Blog Studio workflow."
          exit 1
