name: MCP catalogue drift

# Is the live /mcp describing the pages this repository actually has?
#
# THE GAP THIS CLOSES. /mcp carries its OWN COPY of config/public-pages.json inside its
# deployment zip - deploy_mcp_server.py explains at length why a copy rather than a read, and
# the reasons are good ones. The cost is that a catalogue change does not reach the endpoint
# until the Lambda is redeployed, and nothing automatic did that or even noticed. Both existing
# guards are manual:
#
#   scripts/deploy_mcp_server.py --verify        compares the deployed zip byte for byte, but
#                                               needs lambda:GetFunction, so it can only run on
#                                               the OIDC read role in public-surface-deploy.yml
#   public-surface-deploy.yml                    workflow_dispatch only, no schedule, by design:
#                                               its apply job WRITES production routing
#
# So the drift was real and silent. Measured 2026-09-30: the endpoint served 21 pages while the
# repo declared 23, missing /hunar and /vault, hours after those pages merged. Nothing reported
# it; a person had to think to look.
#
# WHY THIS ONE CAN BE SCHEDULED WHEN THE OTHER CANNOT: it needs NO AWS credentials. It POSTs to
# a public HTTPS URL and reads what any MCP client would be served. There is no OIDC role, so
# unlike plivo-drift.yml it cannot sit permanently red waiting for an IAM decision - which is
# the exact reason public-surface-deploy.yml recorded for leaving a verify cron out ("a
# scheduled job that stays red until a human acts is noise, not signal"). It also checks
# something closer to the truth that matters: what a client actually gets, not what is sitting
# in an artifact.
#
# READ-ONLY BY CONSTRUCTION. It cannot converge, and deliberately so - converging would mean a
# scheduled job redeploying a Lambda unreviewed. It reports, and names the one command to run.
#
# EXIT CODES come from verify_live() and the third one is the point:
#   0  in step
#   1  DRIFT - a real, actionable finding
#   3  UNREACHABLE - the endpoint could not be read, so nothing is known. Reported as a
#      warning, NOT as drift. plivo-drift.yml learned this the hard way: it reported a false
#      CRITICAL on 2026-09-28 because a failed credential read and a moved invariant shared an
#      exit code. A network blip here must not page anyone about a page catalogue.

on:
  # Keyed on the file, so it fires exactly when a deploy becomes necessary. This is the trigger
  # that turns "someone has to remember" into a red check on the merge that caused it. It is
  # path-filtered to the single catalogue file, so it adds nothing to the normal push fan-out
  # (that file changes rarely) — which is why it is kept here rather than dropped for queue
  # pressure: a schedule-only check would let a stale catalogue ride for up to a day.
  push:
    branches: [stack]
    paths:
      - 'config/public-pages.json'
  # Out-of-band drift needs a clock: someone can redeploy the Lambda from a laptop, or an older
  # zip can be rolled back, with no commit to key off. 06:40 UTC = 12:10 IST, inside the Indian
  # working day so a finding reaches someone who can act on it, and ten minutes after
  # plivo-drift so the two do not report at the same instant.
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # No id-token. Nothing here assumes an AWS role, and not requesting the permission is the
  # cheapest possible proof of that.

concurrency:
  group: mcp-catalogue-drift
  cancel-in-progress: true

jobs:
  drift:
    name: live /mcp vs config/public-pages.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # verify_live() itself is stdlib only - urllib and json - but deploy_mcp_server.py imports
      # boto3 at module scope for the deploy paths in the same file. Installing the pinned SDK
      # is cheaper than splitting /mcp's knowledge across two scripts, which is the duplication
      # config/public-pages.json exists to avoid in the first place. Pinned from
      # requirements-dev.txt, like every other workflow here.
      - name: Install pinned AWS SDK
        run: |
          grep -E '^(boto3|botocore)==' requirements-dev.txt > ci-aws-requirements.txt
          python -m pip install -r ci-aws-requirements.txt

      - name: Check the live catalogue
        id: check
        continue-on-error: true
        run: python scripts/deploy_mcp_server.py --verify-live

      # The step's own outcome cannot distinguish 1 from 3, so the code is re-read here. Run
      # the command again rather than parsing the log: it is a single cheap GET-shaped POST and
      # re-reading an exit code is less fragile than scraping text for it.
      - name: Classify the result
        id: classify
        run: |
          set +e
          python scripts/deploy_mcp_server.py --verify-live > result.txt 2>&1
          code=$?
          set -e
          cat result.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo '### MCP catalogue drift'
            echo ''
            case "$code" in
              0) echo '**In step.** The live endpoint serves the same pages this repo declares.' ;;
              1) echo '**DRIFT.** The live `/mcp` is not describing this repository'"'"'s pages.' ;;
              3) echo '**Unreachable.** The endpoint could not be read, so nothing is known about live state. This is not reported as drift.' ;;
              *) echo "**Unexpected exit $code.**" ;;
            esac
            echo ''
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on drift, warn on unreachable
        run: |
          code='${{ steps.classify.outputs.code }}'
          case "$code" in
            0)
              echo 'live /mcp is in step with config/public-pages.json'
              ;;
            1)
              echo "::error::The live /mcp is serving a different page set from config/public-pages.json. An agent reading /llms.txt or calling /mcp is being told about the wrong site. Converge with: gh workflow run public-surface-deploy.yml -f action=apply -f target=mcp"
              exit 1
              ;;
            3)
              echo "::warning::https://wecare.digital/mcp could not be read, so this run learned NOTHING about the live catalogue. Not treated as drift. If it repeats, the endpoint itself is the problem - check the Amplify /mcp rewrite and the Lambda with: python scripts/deploy_mcp_server.py --verify"
              ;;
            *)
              echo "::error::unexpected exit $code from --verify-live"
              exit 1
              ;;
          esac
