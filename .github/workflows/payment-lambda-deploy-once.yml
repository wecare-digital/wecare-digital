name: Payment Lambda deploy (one-shot)

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/payment-lambda-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: payment-lambda-deploy-once
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test and deploy dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run payment regression suite
        run: |
          python -m pytest -q \
            tests/test_payment_readiness.py \
            tests/test_native_wa_payment_send.py \
            tests/test_native_wa_payment_interlock.py \
            tests/test_native_wa_payment_cannot_charge_twice.py \
            tests/test_provision_checkout_contract.py
      - name: Configure exact-scope AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-digital-payment-deploy-temp-20261009
          aws-region: us-east-1
          role-session-name: payment-cleanup-deploy
      - name: Deploy affected Lambda functions through the repository deployer
        run: |
          python scripts/deploy_all_lambdas.py \
            wecare-invoice-engine \
            wecare-checkout \
            wecare-whatsapp-business-api
