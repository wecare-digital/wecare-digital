name: Vault Lambda deploy (one-shot)

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/vault-lambda-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vault-lambda-deploy-once
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test and deploy dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run focused Vault regression suite
        run: |
          python -m pytest -q \
            tests/test_paid_vault.py \
            tests/test_secure_files.py \
            tests/test_native_catalog_orchestration.py \
            tests/test_catalog_service_checkout.py
      - name: Configure exact-scope AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-digital-vault-deploy-temp-20261009
          aws-region: us-east-1
          role-session-name: vault-p0-deploy
      - name: Deploy affected Vault Lambda functions
        run: |
          python scripts/deploy_all_lambdas.py \
            wecare-secure-files \
            wecare-whatsapp-business-api
