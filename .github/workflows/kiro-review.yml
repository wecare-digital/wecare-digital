name: Kiro PR review

# Automated PR review via Kiro CLI.
#
# WHERE THE KEY HAS TO LIVE: a GITHUB ACTIONS SECRET, under
# Settings > Secrets and variables > Actions > Repository secrets, named exactly
# KIRO_API_KEY. `secrets.*` resolves GitHub Actions repository and organisation secrets
# and NOTHING ELSE. It is worth stating because the near misses all look correct from the
# outside and all present identically - the job skips and reports success:
#   - AWS Secrets Manager. A different system entirely; `secrets.` cannot reach it. This
#     is a CI-only credential consumed by one workflow, so Actions is also its right home
#     - and reading it from AWS instead would mean giving a pull_request-triggered
#     workflow an AWS role, which no other workflow here does (gastronomy-content-gate.yml
#     confines its AWS job to workflow_dispatch on purpose).
#   - An ENVIRONMENT secret. This job declares no `environment:`, so it would not see one.
#   - A DEPENDABOT secret. Separate store, not available to Actions.
#   - An ORGANISATION secret without this repository granted access.
#
# IT IS GATED ON THE SECRET EXISTING, and that is the whole reason this file is safe to
# merge today. `kiro_api_key` is a REQUIRED input to the action, so without a
# KIRO_API_KEY repository secret every run would fail - a workflow that is red on every
# pull request from the moment it lands teaches people to ignore CI, which costs more
# than the review is worth. Until the secret is added this job reports a notice and
# skips. Add the secret and it starts working with no further edit.
#
# THE SKIP REPORTS SUCCESS, WHICH IS THE ONE TRAP IN THIS DESIGN. A configured-looking
# green check on every PR is indistinguishable from a working review at a glance. To tell
# them apart, open the run and look at the "Kiro CLI review" step: `skipped` means the key
# is not visible, whatever any other system says about it being stored.
#
# The gate also handles fork pull requests correctly for free: GitHub does not expose
# secrets to workflows triggered by a fork PR, so HAS_KIRO_KEY is false there and the
# step skips instead of failing. Do NOT "fix" that by switching to
# pull_request_target - that runs the base branch's workflow with secrets available to
# code from the fork, which is the standard way this class of workflow becomes an
# credential-exfiltration path.
#
# TWO TRUST DECISIONS WORTH MAKING CONSCIOUSLY, because this repo is not a low-stakes
# target - four workflows here hold AWS credentials via
# aws-actions/configure-aws-credentials and deploy Lambdas:
#
#   1. konippi/kiro-cli-review-action is a THIRD-PARTY, personal (non-org) action. It
#      runs its own compiled JS (dist/main/index.cjs) plus a post step, and installs
#      github-mcp-server at runtime. A version tag is MUTABLE: whoever controls that
#      repo can move v1.0.1 to different code at any time, and the next run would fetch
#      it without anything here changing.
#      NOW PINNED TO THE FULL COMMIT SHA that v1.0.1 resolved to, which is the only form
#      GitHub will not silently re-point. Measured before pinning: the action is owned by
#      a USER rather than an organisation, has 3 stars, and was last pushed the day
#      before this pin - so it is small, personally controlled and actively changing,
#      against a repo where four other workflows assume AWS roles and deploy Lambdas.
#      A tag was not a defensible level of trust for that pairing.
#      TO UPDATE: read the new tag's commit with
#        gh api repos/konippi/kiro-cli-review-action/git/ref/tags/<tag> --jq .object.sha
#      and replace the SHA below, keeping the trailing comment in step with it. Review
#      the diff between the two commits before doing so - that is the point of pinning.
#   2. Its `debug` input is left at its default of false ON PURPOSE. The action's own
#      description warns that enabling it prints tool execution results that may contain
#      sensitive data into public build logs. Do not turn it on to chase a failure on a
#      repo whose logs are visible.
#
# WHY .kiro/agents/code-reviewer.json IS COMMITTED, AND WHY DELETING IT BREAKS THIS JOB.
# This step failed on every pull request with:
#
#   ENOENT: no such file or directory, copyfile
#     'agents/code-reviewer.json' -> '.kiro/agents/code-reviewer.json'
#
# That is an upstream bug, not a missing setting here. src/main.ts does:
#
#   const actionPath = process.env.GITHUB_ACTION_PATH || '.';
#   ...
#   copyFileSync(join(actionPath, 'agents', 'code-reviewer.json'), dest);
#
# and action.yml declares `using: node24`. GITHUB_ACTION_PATH is only set for COMPOSITE
# actions, so for a JavaScript action it is unset, actionPath falls back to '.', and the
# action looks for ./agents/code-reviewer.json in OUR checkout rather than in its own
# directory. The file it wants does ship inside the action (agents/code-reviewer.json,
# 553 bytes at the pinned SHA) - it just cannot find its own copy.
#
# The fix uses the action's own guard rather than working around it. That copy sits behind
# `else if (!existsSync(dest))`, so when .kiro/agents/code-reviewer.json is already
# present the broken line never executes and the agent starts from our file. Note the
# branch above it: if a `model` input were ever passed here, a DIFFERENT path runs that
# reads the same missing file, with a try/catch that also falls back to it - so adding
# `model:` to this step would reintroduce the failure. Leave it unset.
#
# THE FIX CANNOT GO GREEN ON THE PULL REQUEST THAT INTRODUCES IT, AND THAT IS CORRECT.
# Before anything else, the action runs restoreConfigFromBase() (src/security.ts), which
# logs:
#
#   Restoring .kiro, .amazonq, .gitmodules, .husky, AGENTS.md from origin/stack
#
# It backs the PR's copies up to .kiro-pr/, DELETES them, then `git checkout
# origin/<base> -- <path>` for each; a path that does not exist on the base branch
# "stays deleted" in its own words. It cites CVE-2025-59536 / CVE-2026-21852 - RCE via
# malicious config injection - and it is right to: without it, any pull request could
# ship a .kiro/agents/code-reviewer.json that runs arbitrary tooling under this job's
# credentials. A pull request must not be able to define the agent that reviews it.
#
# So on the PR that ADDS this file, .kiro is replaced by the base branch's copy, the file
# is not there, existsSync(dest) is false, and the ENOENT still happens. The check goes
# green from the NEXT pull request onward, once the file is on `stack`. Do not chase that
# first red run - and in particular do not "fix" it by passing `agent:`, which skips the
# copy but leaves the agent JSON deleted, so the CLI then fails to find the agent instead.
#
# The action also leaves the PR's own versions in .kiro-pr/ specifically so the reviewer
# can inspect what a change proposed to these paths. Worth knowing if a review ever
# comments on .kiro-pr/ contents.
#
# Our copy is upstream's schema with two deliberate differences: `resources` points at
# steering docs that exist in this repo instead of a CONTRIBUTING.md that does not, and it
# carries a repo-specific prompt. The read-only posture is upstream's and is kept - no
# fs_write or execute_bash in `tools`, plus preToolUse hooks that block both - which
# matters because this job holds a token with `pull-requests: write`.
#
# Permissions are the minimum the job needs: read the code, write PR comments. It gets
# no `contents: write`, so a review cannot push.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kiro-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review the diff
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    # `secrets` is not a context available to a job-level or step-level `if`, so the
    # presence check has to go through env, which CAN read secrets. This is the standard
    # indirection for optional-secret workflows.
    env:
      HAS_KIRO_KEY: ${{ secrets.KIRO_API_KEY != '' }}

    steps:
      - name: Explain the skip when unconfigured
        if: env.HAS_KIRO_KEY != 'true'
        run: |
          echo "::notice::Skipped - this workflow cannot see a KIRO_API_KEY. It must be a GITHUB ACTIONS secret: Settings > Secrets and variables > Actions > Repository secrets. An entry in AWS Secrets Manager is a different store and secrets.KIRO_API_KEY cannot read it - see the header of this file. Also skipped on fork PRs, which never receive secrets at all."

      - uses: actions/checkout@v7
        if: env.HAS_KIRO_KEY == 'true'
        with:
          # The reviewer needs both sides of the comparison, and a shallow clone of the
          # head commit alone cannot produce a diff against the base.
          fetch-depth: 0

      - name: Kiro CLI review
        id: kiro_review
        if: env.HAS_KIRO_KEY == 'true'
        # Advisory reviewer: a provider-side ACP failure must stay visible but must not make an
        # otherwise healthy PR red. On 2026-10-11 the pinned action failed twice, after creating
        # an ACP session, with `ACP error -32603: Internal error`; rerunning the exact job produced
        # the same provider failure before any review result existed.
        continue-on-error: true
        # v1.0.1 - pinned by SHA deliberately, see trust decision 1 in the header.
        uses: konippi/kiro-cli-review-action@1c11ef476d5722d06a0c702a041e6393c8d5310d
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Default is 10000 characters. Raised because a normal change here runs well
          # past that: the last two merged PRs were 376 and 395 lines of diff, and a
          # reviewer that silently truncates is worse than no reviewer, since its
          # approval implies it read the whole change.
          max_diff_size: '40000'

      - name: Report Kiro provider failure
        if: env.HAS_KIRO_KEY == 'true' && steps.kiro_review.outcome == 'failure'
        run: |
          echo "::warning::Kiro PR review did not complete. The external reviewer step failed; code, build, test, security and policy gates continue to determine merge health."
          {
            echo '### Kiro PR review'
            echo ''
            echo 'The external Kiro reviewer failed before producing a review. This is advisory and does not fail the PR.'
            echo 'Inspect the Kiro CLI review step for the provider error; retry manually when the service is healthy.'
          } >> "$GITHUB_STEP_SUMMARY"
