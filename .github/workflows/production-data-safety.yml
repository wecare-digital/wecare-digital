name: Production data safety
on:
  pull_request:
    paths:
      - 'src/**'
      - 'amplify/functions/**'
      - 'amplify/catalog-resources.ts'
      - 'amplify/backend.ts'
      - 'amplify.yml'
      - 'scripts/check*'
      - 'scripts/guard_braces_depth.cjs'
      - 'package*.json'
      - 'eslint.config.mjs'
      - '.github/workflows/production-data-safety.yml'
      - '.github/workflows/payflow-safety.yml'
      - '.github/workflows/retired-meta-catalog-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/check_production_data_safety.cjs
      - run: node scripts/check_action_ui_contracts.cjs
      - run: python scripts/check_f001_subscribe.py
      - run: python scripts/check_f002_leave_review.py
      - run: npm run build
