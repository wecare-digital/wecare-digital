name: Workspace MCP supplied patch
run-name: Workspace MCP ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      expected_base: {description: Exact stack SHA, required: true, type: string}
      patch_key: {description: Immutable scoped S3 patch key, required: true, type: string}
      job_id: {description: Submitted job checksum, required: true, type: string}
permissions:
  contents: read
concurrency:
  group: workspace-mcp-codechange
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: {ref: stack, persist-credentials: false}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.WORKSPACE_MCP_PATCH_READ_ROLE_ARN }}
          aws-region: us-east-1
      - name: Download only the scoped patch
        env:
          PATCH_KEY: ${{ inputs.patch_key }}
        run: |
          [[ "$PATCH_KEY" =~ ^workspace-mcp/patches/[a-f0-9]{64}/[a-f0-9]{64}\.patch$ ]] || exit 1
          aws s3 cp "s3://cdk-hnb659fds-assets-775261844268-us-east-1/$PATCH_KEY" supplied.patch --no-progress
      - uses: actions/upload-artifact@v7
        with: {name: supplied-patch, path: supplied.patch, retention-days: 7}
  test:
    needs: fetch
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {ref: stack, persist-credentials: false}
      - uses: actions/download-artifact@v8
        with: {name: supplied-patch}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Validate and apply without AWS or write credentials
        env:
          BASE_SHA: ${{ inputs.expected_base }}
          PATCH_KEY: ${{ inputs.patch_key }}
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/workspace_mcp_patch_gate.py --patch supplied.patch --base "$BASE_SHA" --key "$PATCH_KEY" --job "$JOB_ID"
      - uses: actions/setup-node@v7
        with: {node-version-file: .nvmrc, cache: npm}

      - name: Use npm version pinned by packageManager
        shell: bash
        run: |
          PINNED_NPM="$(node -e "const p=require('./package.json').packageManager;process.stdout.write(p.slice(p.lastIndexOf('@')+1))")"
          npm install --global "npm@${PINNED_NPM}"
          echo "npm $(npm --version)"
          test "$(npm --version)" = "$PINNED_NPM"
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - run: node scripts/generate-public-pages.js --check
      - run: python scripts/verify_public_bundle_secrets.py
  commit:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        # Only this trusted runner holds write auth; patched components are not executed.
        with: {ref: stack, persist-credentials: true}
      - uses: actions/download-artifact@v8
        with: {name: supplied-patch}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Revalidate against current HEAD; never force push
        env:
          BASE_SHA: ${{ inputs.expected_base }}
          PATCH_KEY: ${{ inputs.patch_key }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python scripts/workspace_mcp_patch_gate.py --patch supplied.patch --base "$BASE_SHA" --key "$PATCH_KEY" --job "$JOB_ID"
          git config user.name 'WECARE MCP'
          git config user.email 'automation@wecare.digital'
          python - <<'PY'
          import importlib.util, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('patch_policy', 'amplify/functions/ai/workspace-mcp/patch_policy.py')
          p = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(p)
          paths = p.validate_patch(Path('supplied.patch').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'commit', '--only', *paths, '-m', 'Apply tested MCP public-component patch'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:stack'], check=True)
          PY
