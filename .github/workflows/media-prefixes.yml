name: Media prefixes
# Every S3 key the Lambda fleet touches must be rooted in the right folder of the one
# media bucket, and `media_paths` must be imported above its first use.
#
# Why this workflow exists
# -----------------------
# The 2026-09-26 merge mapped `app.wecare.digital/<X>` to `wecare-digital-get/o/<X>`, but
# every handler prefix kept its pre-merge shape. For two days the fleet read and wrote one
# level above its own data, and NOTHING failed loudly, because the apex host serves the
# whole bucket: a key written to the root returns HTTP 200. The damage only showed up as an
# invoice missing its logo, a cleanup sweep deleting nothing while reporting success, and a
# document download signed against a bucket that does not exist.
#
# The second defect is the one that makes this a CI gate rather than a one-off fix. The
# repair added `from lambda_utils import media_paths` to 24 handlers, and in three of them
# the import landed BELOW the module-scope constant that used it. That is a NameError which
# `py_compile` accepts happily and which only fires when the function is invoked - so three
# functions were published, had their `live` alias moved, and were completely dead, with a
# green deploy. The test suite caught it; no source review had.
#
# Check 3 below is that check. It is cheap, it is static, and it is the difference between
# catching this in a pull request and catching it from production traffic.
#
# Two jobs, because the two questions need different inputs.
#
#   source-gate  runs on every push and PR, needs no credentials, and is BLOCKING.
#   live-gate    needs AWS read access, so it never runs on a pull request - see the
#                reasoning on route-auth.yml's live-gate, which applies verbatim: the OIDC
#                `sub` claim carries the event, and a fork cannot obtain a token at all.
#
# If source-gate fails on your PR you have either addressed an S3 key without rooting it
# through `lambda_utils.media_paths`, named a bucket that no longer exists, or placed the
# `media_paths` import below its first use. The failure message names the file and line.
on:
  push:
    branches: [stack]
  pull_request:
    branches: [stack]
  schedule:
    # 07:20 UTC daily, just after the route-auth drift job.
    - cron: '20 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # for the OIDC role assumption in live-gate
concurrency:
  group: media-prefixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-gate:
    name: Key rooting and import order (source)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # No dependencies. Checks 1-3 read the tree with the standard library only, which is
      # what lets this job run on a pull request from anywhere with no secrets at all.
      - name: Assert every S3 key is rooted and media_paths is imported before use
        run: python scripts/verify_media_prefixes.py
      - name: Summarise
        if: always()
        run: |
          {
            echo '### Media prefixes — source gate'
            echo ''
            echo 'Mode: **blocking**. Asserts three things about the Lambda fleet:'
            echo ''
            echo '1. No handler names a bucket that does not exist'
            echo '   (`app.wecare.digital`, `wecare-digital-media`, `wecare-digital-documents`).'
            echo '2. Every S3 key is rooted under `o/` (public, dual-homed) or'
            echo '   `secure/` (gated) — an un-rooted key still returns HTTP 200 from'
            echo '   the apex host, so this cannot be caught at runtime.'
            echo '3. `media_paths` is imported ABOVE its first use — below it is a'
            echo '   module-scope NameError that byte-compiles cleanly and only fails'
            echo '   on invoke.'
            echo ''
            echo 'See `amplify/functions/shared/lambda_utils/media_paths.py`.'
          } >> "$GITHUB_STEP_SUMMARY"
  live-gate:
    name: Bucket and CDN drift (live AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Skipped rather than failed when the repository variable is absent, so a fork or a
    # fresh clone is not red for a reason the contributor cannot fix. The role needs read
    # access to Lambda (GetFunctionConfiguration), S3 (ListBucket on wecare-digital-get)
    # and CloudFront (GetDistributionConfig); it is deliberately a NEW variable rather than
    # reusing ROUTE_AUTH_ROLE_ARN, because that role is scoped to API Gateway and Lambda
    # and would fail on the S3 and CloudFront calls.
    #
    # What only the live check can see: `o/` is load-bearing purely because CloudFront
    # E1DP37QIS4G0T4 serves this bucket through origin path `/o`. If someone changes that
    # origin path, every rooted key in the fleet becomes wrong and no amount of source
    # inspection would notice.
    if: github.event_name != 'pull_request' && vars.MEDIA_PREFIX_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          grep -E '^(boto3|botocore)==' requirements-dev.txt > ci-aws-requirements.txt
          python -m pip install -r ci-aws-requirements.txt
      - name: Assume read-only role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.MEDIA_PREFIX_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify live bucket roots, CDN origin path and Lambda config
        run: python scripts/verify_media_prefixes.py --live
