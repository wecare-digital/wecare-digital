name: Conversations content gate
# Enforces the Conversations Content Quality Standard v2 on the PDF/URL ingestion pipeline.
#
# DELIBERATELY VALIDATE-ONLY. Publication is owned by the AWS-native Blog Studio path.
# This gate runs on every relevant PR/push, holds no AWS role, and must never grow a
# publication mutation of its own.
on:
  pull_request:
    branches: [ stack ]
    paths:
      - 'content/conversations/**'
      - 'scripts/blog_quality_v2.py'
      - 'scripts/blog_ingest.py'
      - 'scripts/blog_ledger.py'
      - 'scripts/blog_corpus_index.py'
      - 'scripts/conversations_batch.py'
      - 'amplify/functions/shared/blog_pipeline.py'
      - 'tests/test_blog_quality_v2.py'
      - 'tests/test_conversations_batch.py'
      - 'tests/test_blog_ingest.py'
      - 'tests/test_blog_ledger.py'
      - 'tests/test_blog_pipeline.py'
      - 'tests/test_blog_corpus_index.py'
      - 'tests/blog_pdf_fixture.py'
      - '.github/workflows/conversations-content-gate.yml'
  push:
    branches: [ stack ]
    paths:
      - 'content/conversations/**'
      - 'scripts/blog_quality_v2.py'
      - 'scripts/blog_ingest.py'
      - 'scripts/blog_ledger.py'
      - 'scripts/conversations_batch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        # pypdf for PDF extraction, lxml + requests for URL extraction.
        #
        # boto3 is present because shared pipeline modules import AWS helpers at module scope.
        # This job still holds NO AWS ROLE and performs no AWS mutation.
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 pypdf==6.21.1 lxml==6.1.3 requests==2.34.2 boto3==1.43.98

      - name: Pipeline contract tests
        run: |
          python -m pytest -q \
            tests/test_blog_quality_v2.py \
            tests/test_blog_ledger.py \
            tests/test_blog_ingest.py \
            tests/test_blog_pipeline.py \
            tests/test_blog_corpus_index.py

      - name: The duplication gate has a corpus to compare against
        # THE CHECK THAT STOPS A FALSE PASS. Section 28 requires comparison against the whole
        # published corpus. Until 2026-09-29 the gate loaded committed manifests only - 383
        # records against a live corpus of 1,165 - so it reported PASS on NON_DUPLICATION
        # having checked a third of it. A gate that reports success on an unchecked corpus is
        # worse than no gate, because it is believed.
        #
        # Offline: this asserts the committed index is structurally sound and non-trivial. It
        # deliberately does NOT call the live API, because this job holds no AWS role and
        # needs none - staleness against the live listing is checked by the scheduled
        # refresh, not here.
        run: |
          python scripts/blog_corpus_index.py verify --offline
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import blog_quality_v2 as q
          health = q.published_index_health()
          print(f"published corpus index: {health}")
          if not health['present']:
              print('::error::no published corpus index; section 28 cannot be satisfied')
              sys.exit(1)
          # A handful of records would satisfy "present" while leaving the gate blind.
          if health['indexed'] < 500:
              print(f"::error::index holds only {health['indexed']} posts; expected the "
                    "whole published corpus")
              sys.exit(1)
          PY

      - name: Validate committed Conversations batches
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/conversations/batches/CONV-*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No Conversations batch manifests committed yet."
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            python scripts/blog_quality_v2.py validate --manifest "$file" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Every record carries an explicit status (section 34)
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/conversations/batches/CONV-*.json)
          (( ${#files[@]} == 0 )) && exit 0
          for file in "${files[@]}"; do
            python scripts/blog_quality_v2.py wave --manifest "$file" >/dev/null
          done

      - name: Ledger reconciles with the committed batches
        # Catches both directions: an article whose source provenance is unrecorded, and a
        # ledger row claiming an article that no batch contains. Neither is visible from
        # either file on its own.
        run: |
          if [ -f content/conversations/ledger.json ]; then
            python scripts/blog_ledger.py verify \
              --ledger content/conversations/ledger.json \
              --batches 'content/conversations/batches/*.json'
          else
            echo "No ledger committed yet."
          fi

      - name: Working files must not be committed
        # content/conversations/extracts/ and drafts/ hold verbatim third-party text. They
        # are gitignored; this is the backstop for a `git add -f`.
        shell: bash
        run: |
          leaked=$(git ls-files 'content/conversations/extracts' 'content/conversations/drafts')
          if [ -n "$leaked" ]; then
            echo "Verbatim extracted source text is committed:"
            echo "$leaked"
            exit 1
          fi
          echo "No extracted source text committed."

      - name: Published corpora still read as healthy
        # A gate that reports hard failures on live content gets switched off. This asserts
        # the pre-v2 softening keeps working, so the gate stays trustworthy.
        run: |
          python - <<'PY'
          import glob, sys
          sys.path.insert(0, 'scripts')
          from pathlib import Path
          import blog_quality_v2 as q
          failures = []
          manifests = sorted(glob.glob('content/gastronomy/batches/GAST-*.json')) + \
                      sorted(glob.glob('migration/blog/batch-*.json'))
          for manifest in manifests:
              wave = q.assess_wave(q.load_posts(Path(manifest)))
              for record in wave['records']:
                  if record['blocking']:
                      failures.append((manifest, record['slug'], record['blocking']))
                  if record['readyToPublish']:
                      failures.append((manifest, record['slug'], ['unexpectedly READY_TO_PUBLISH']))
          print(f'checked {len(manifests)} committed manifest(s)')
          for manifest, slug, problems in failures:
              print(f'  {manifest} {slug}: {problems}')
          sys.exit(1 if failures else 0)
          PY
