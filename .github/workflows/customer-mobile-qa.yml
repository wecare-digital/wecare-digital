name: Customers and Collect interaction QA

on:
  pull_request:
    branches: [wecare.digital]
    paths:
      - src/pages/workspace/customers/**
      - src/components/workspace/pay/PayFlow.tsx
      - src/lib/contactPhone.ts
      - src/lib/address-format.ts
      - src/styles/workspace.css
      - tests/customerPhone.test.mjs
      - tests/test_customer_mobile_interactions.py
      - tests/test_customer_duplicate_resolution.py
      - tests/test_customer_subscribe_form_contract.py
      - .github/workflows/customer-mobile-qa.yml

permissions:
  contents: read

jobs:
  customer-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/customerPhone.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_customer_mobile_interactions.py tests/test_customer_duplicate_resolution.py tests/test_customer_subscribe_form_contract.py
