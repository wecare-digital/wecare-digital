name: Workspace MCP CI

on:
  pull_request:
    paths:
      - "amplify/functions/ai/workspace-mcp/**"
      - "amplify/infra/workspace-mcp.json"
      - "config/workspace-mcp.json"
      - "scripts/build_workspace_mcp.py"
      - "scripts/deploy_workspace_mcp.py"
      - "scripts/verify_chat_mcp_auth.py"
      - "scripts/verify_separate_provider_mcp.py"
      - ".github/workflows/workspace-mcp-ci.yml"
  push:
    branches:
      - "wecare.digital"
    paths:
      - "amplify/functions/ai/workspace-mcp/**"
      - "amplify/infra/workspace-mcp.json"
      - "config/workspace-mcp.json"
      - "scripts/build_workspace_mcp.py"
      - "scripts/deploy_workspace_mcp.py"
      - "scripts/verify_chat_mcp_auth.py"
      - ".github/workflows/workspace-mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.40.55 cryptography==50.0.2
      - name: Compile Workspace MCP
        run: python -m compileall -q amplify/functions/ai/workspace-mcp
      - name: Validate policy JSON
        run: python -m json.tool config/workspace-mcp.json >/dev/null
      - name: Verify Chat/MCP authorization and infrastructure contracts
        run: python scripts/verify_chat_mcp_auth.py
      - name: Verify separate provider isolation and native-provider policy
        run: python scripts/verify_separate_provider_mcp.py
      - name: Verify scoped WhatsApp inventory policy
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, sys
          root = pathlib.Path(".").resolve()
          source = root / "amplify/functions/ai/workspace-mcp"
          policy = json.loads((root / "config/workspace-mcp.json").read_text())
          sys.path.insert(0, str(source))
          original = pathlib.Path.read_text
          def bundled(path, *args, **kwargs):
              if path == source / "workspace-mcp.json":
                  return original(root / "config/workspace-mcp.json", *args, **kwargs)
              return original(path, *args, **kwargs)
          pathlib.Path.read_text = bundled
          spec = importlib.util.spec_from_file_location("workspace_mcp_policy_test", source / "handler.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          expected = {
              "whatsapp_biz_businesses",
              "whatsapp_biz_accounts",
              "whatsapp_biz_phone_numbers",
              "whatsapp_biz_list_templates",
              "whatsapp_biz_onboarding_status",
          }
          assert set(policy["connections"]["whatsapp"]["tools"]) == expected
          module.safe_provider_args("whatsapp", "whatsapp_biz_accounts",
                                    {"business_id": "382642103987922"})
          module.safe_provider_args("whatsapp", "whatsapp_biz_list_templates",
                                    {"business_id": "125951953587391",
                                     "waba_id": "2513394156072604", "limit": "100"})
          module.safe_provider_args("whatsapp", "whatsapp_biz_onboarding_status",
                                    {"business_id": "382642103987922",
                                     "app_id": "2238810740192680"})
          for bad in (
              {"business_id": "999"},
              {"business_id": "382642103987922", "waba_id": "999"},
          ):
              try:
                  module.safe_provider_args("whatsapp", "whatsapp_biz_phone_numbers", bad)
              except module.Refusal:
                  pass
              else:
                  raise AssertionError("out-of-scope WhatsApp read was accepted")
          try:
              module.safe_provider_args("whatsapp", "whatsapp_biz_accounts",
                                        {"business_id": "382642103987922", "action": "delete"})
          except module.Refusal:
              pass
          else:
              raise AssertionError("provider write/action escaped read-only policy")
          print("PASS: scoped WhatsApp inventory reads; writes/out-of-scope IDs refused")
          PY

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Workspace MCP dependencies
        run: |
          mkdir -p dist/workspace-mcp-deps
          python -m pip install --disable-pip-version-check \
            --target dist/workspace-mcp-deps \
            -r amplify/functions/ai/workspace-mcp/requirements.txt
      - name: Build deterministic Workspace MCP package
        run: |
          python scripts/build_workspace_mcp.py \
            --dependencies dist/workspace-mcp-deps \
            --output dist/workspace-mcp
      - name: Upload tested Workspace MCP package
        uses: actions/upload-artifact@v4
        with:
          name: workspace-mcp-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/workspace-mcp/workspace-mcp.zip
            dist/workspace-mcp/manifest.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wecare.digital'
    needs: package
    concurrency:
      group: workspace-mcp-code-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested Workspace MCP package
        uses: actions/download-artifact@v4
        with:
          name: workspace-mcp-${{ github.sha }}
          path: dist/workspace-mcp
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-workspace-mcp-deploy-oidc
          aws-region: us-east-1
          allowed-account-ids: "775261844268"
          role-session-name: workspace-mcp-${{ github.run_id }}
      - name: Publish verified Workspace MCP package
        shell: bash
        run: |
          set -euo pipefail
          cd dist/workspace-mcp
          fn="wecare-workspace-mcp"
          expected="$(jq -r '.codeSha256' manifest.json)"
          revision="$(aws lambda get-function-configuration \
            --function-name "$fn" --query RevisionId --output text)"
          alias_revision="$(aws lambda get-alias \
            --function-name "$fn" --name live --query RevisionId --output text)"

          aws lambda update-function-code \
            --function-name "$fn" \
            --zip-file "fileb://workspace-mcp.zip" \
            --revision-id "$revision" \
            --no-publish >/dev/null
          aws lambda wait function-updated-v2 --function-name "$fn"

          latest="$(aws lambda get-function-configuration \
            --function-name "$fn" --query '{sha:CodeSha256,revision:RevisionId}' --output json)"
          actual="$(jq -r .sha <<<"$latest")"
          latest_revision="$(jq -r .revision <<<"$latest")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Hash mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

          version="$(aws lambda publish-version \
            --function-name "$fn" \
            --description "workspace-mcp ${GITHUB_SHA}" \
            --code-sha256 "$expected" \
            --revision-id "$latest_revision" \
            --query Version --output text)"

          aws lambda update-alias \
            --function-name "$fn" \
            --name live \
            --function-version "$version" \
            --revision-id "$alias_revision" >/dev/null

          live_cfg="$(aws lambda get-function-configuration \
            --function-name "$fn" --qualifier live \
            --query '{sha:CodeSha256,tracing:TracingConfig.Mode,status:LastUpdateStatus}' --output json)"
          live_sha="$(jq -r .sha <<<"$live_cfg")"
          live_tracing="$(jq -r .tracing <<<"$live_cfg")"
          live_status="$(jq -r .status <<<"$live_cfg")"
          live_concurrency="$(aws lambda get-function-concurrency \
            --function-name "$fn" --query ReservedConcurrentExecutions --output text)"
          if [[ "$live_sha" != "$expected" ]]; then
            echo "Live alias hash mismatch: expected $expected, got $live_sha" >&2
            exit 1
          fi
          if [[ "$live_tracing" != "Active" || "$live_status" != "Successful" ]]; then
            echo "Live alias config mismatch: tracing=$live_tracing status=$live_status" >&2
            exit 1
          fi
          if [[ "$live_concurrency" != "10" ]]; then
            echo "Reserved concurrency mismatch: expected 10, got $live_concurrency" >&2
            exit 1
          fi
          echo "$fn live -> v$version $live_sha tracing=$live_tracing concurrency=$live_concurrency"

