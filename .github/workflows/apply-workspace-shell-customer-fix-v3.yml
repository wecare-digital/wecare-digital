name: Apply shared Workspace shell and customer profile fix v3

on:
  push:
    branches:
      - feat/payments-home-mobile-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-home-mobile-foundation
          fetch-depth: 0

      - name: Apply corrected migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/apply-workspace-shell-customer-fix-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          pattern = re.compile(
              r"customer = replace_once\(\n"
              r"\s+customer,\n"
              r"\s+\"        name: formName, phone: fullPhone \|\| undefined, email: formEmail \|\| undefined,\",\n"
              r"\s+\"        name: formName, phone: fullPhone \|\| undefined,\",\n"
              r"\s+'create payload email',\n"
              r"\s+\)"
          )
          replacement = (
              "customer = customer.replace(\n"
              "    \"        name: formName, phone: fullPhone || undefined, email: formEmail || undefined,\",\n"
              "    \"        name: formName, phone: fullPhone || undefined,\",\n"
              "    1,\n"
              ")"
          )
          script, count = pattern.subn(replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'create payload patch: expected one match, found {count}')

          script = script.replace(
              "Path('.github/workflows/apply-workspace-shell-customer-fix-v2.yml').unlink()",
              "Path('.github/workflows/apply-workspace-shell-customer-fix-v2.yml').unlink()\nPath('.github/workflows/apply-workspace-shell-customer-fix-v3.yml').unlink()",
          )
          exec(compile(script, 'workspace-migration-v3', 'exec'))
          PY

      - name: Verify Python source contracts
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_customer_duplicate_resolution.py tests/test_workspace_shared_shell_customer_form.py

      - name: Verify TypeScript
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck --if-present

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(workspace): share auth shell and align customer profile"
          git push origin HEAD:feat/payments-home-mobile-foundation
