name: Public foundation

on:
  pull_request:
    branches: [ stack ]
  push:
    branches: [ stack ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Public build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm version pinned by packageManager
        shell: bash
        run: |
          PINNED_NPM="$(node -e "const p=require('./package.json').packageManager;process.stdout.write(p.slice(p.lastIndexOf('@')+1))")"
          npm install --global "npm@${PINNED_NPM}"
          test "$(npm --version)" = "$PINNED_NPM"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production export
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Public route census
        run: |
          npm ci --no-audit --no-fund --prefix tools/browser
          node tools/browser/pageaudit.js --public

      - name: Upload production export
        uses: actions/upload-artifact@v7
        with:
          name: public-foundation-export-${{ github.sha }}
          path: out/
          retention-days: 1

  browsers:
    name: Public browser - ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download production export
        uses: actions/download-artifact@v8
        with:
          name: public-foundation-export-${{ github.sha }}
          path: out

      - name: Install browser harness
        run: npm ci --no-audit --no-fund --prefix tools/browser

      - name: Install ${{ matrix.browser }} and native dependencies
        run: node tools/browser/node_modules/playwright-core/cli.js install --with-deps "${{ matrix.browser }}"

      - name: Device, touch and 200% reflow matrix
        run: node tools/browser/devicecheck.js "--${{ matrix.browser }}"

      - name: Frozen foundation + VayuLok RTL matrix
        run: node tools/browser/rtlcheck.js "--${{ matrix.browser }}" / /grahak-os/ /vayulok/
