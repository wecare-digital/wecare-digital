name: WhatsApp operational analytics CI

on:
  pull_request:
    paths:
      - "amplify/functions/operations/whatsapp-analytics-export/**"
      - "tests/test_whatsapp_operational_analytics.py"
      - "scripts/provision_whatsapp_operational_analytics.py"
      - ".github/workflows/whatsapp-analytics-ci.yml"
  push:
    branches: [wecare.digital]
    paths:
      - "amplify/functions/operations/whatsapp-analytics-export/**"
      - "tests/test_whatsapp_operational_analytics.py"
      - ".github/workflows/whatsapp-analytics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Compile exporter and provisioner
        run: python -m py_compile amplify/functions/operations/whatsapp-analytics-export/handler.py scripts/provision_whatsapp_operational_analytics.py
      - name: Verify privacy projections
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: python -m unittest discover -s tests -p 'test_whatsapp_operational_analytics.py'
      - name: Build deterministic package
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          source = Path("amplify/functions/operations/whatsapp-analytics-export/handler.py").read_bytes()
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
              info = zipfile.ZipInfo("handler.py", date_time=(2026, 1, 1, 0, 0, 0))
              info.external_attr = 0o644 << 16
              info.compress_type = zipfile.ZIP_DEFLATED
              z.writestr(info, source)
          blob = buf.getvalue()
          out = Path("dist/whatsapp-analytics")
          out.mkdir(parents=True, exist_ok=True)
          (out / "wecare-whatsapp-analytics-export.zip").write_bytes(blob)
          digest = hashlib.sha256(blob).digest()
          (out / "manifest.json").write_text(json.dumps({
              "codeSha256": base64.b64encode(digest).decode("ascii"),
              "sha256": digest.hex(),
              "bytes": len(blob),
          }, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-analytics-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/whatsapp-analytics/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wecare.digital'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: whatsapp-analytics-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whatsapp-analytics-${{ github.sha }}
          path: dist/whatsapp-analytics
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-whatsapp-analytics-deploy-oidc
          aws-region: us-east-1
          allowed-account-ids: "775261844268"
          role-session-name: whatsapp-analytics-${{ github.run_id }}
      - name: Publish exporter
        shell: bash
        run: |
          set -euo pipefail
          fn=wecare-whatsapp-analytics-export
          zip=dist/whatsapp-analytics/wecare-whatsapp-analytics-export.zip
          expected="$(jq -r .codeSha256 dist/whatsapp-analytics/manifest.json)"
          role=arn:aws:iam::775261844268:role/wecare-whatsapp-analytics-export-role
          env_json='{"Variables":{"ANALYTICS_BUCKET":"wecare-digital-get","ANALYTICS_PREFIX":"secure/d/public/whatsapp/analytics/operational","OUTBOUND_TABLE":"stack-wecare-digital-WhatsAppOutboundTable","FLOW_SUBMISSIONS_TABLE":"stack-wecare-digital-FlowSubmissionTable","ORDERS_TABLE":"stack-wecare-digital-OrderTable","SYSTEM_EVENT_TABLE":"stack-wecare-digital-SystemEventTable","MAX_ROWS_PER_DATASET":"100000"}}'
          if aws lambda get-function-configuration --function-name "$fn" >/dev/null 2>&1; then
            revision="$(aws lambda get-function-configuration --function-name "$fn" --query RevisionId --output text)"
            aws lambda update-function-configuration --function-name "$fn" --revision-id "$revision"               --role "$role" --runtime python3.12 --handler handler.handler --timeout 120 --memory-size 256               --tracing-config Mode=Active --environment "$env_json" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$fn"
            revision="$(aws lambda get-function-configuration --function-name "$fn" --query RevisionId --output text)"
            aws lambda update-function-code --function-name "$fn" --zip-file "fileb://$zip"               --revision-id "$revision" --no-publish >/dev/null
          else
            aws lambda create-function --function-name "$fn" --runtime python3.12 --role "$role"               --handler handler.handler --zip-file "fileb://$zip"               --description "Privacy-bounded WhatsApp operational analytics exporter"               --timeout 120 --memory-size 256 --architectures arm64               --tracing-config Mode=Active --environment "$env_json" >/dev/null
          fi
          aws lambda wait function-updated-v2 --function-name "$fn"
          latest="$(aws lambda get-function-configuration --function-name "$fn" --query '{sha:CodeSha256,revision:RevisionId}' --output json)"
          actual="$(jq -r .sha <<<"$latest")"
          revision="$(jq -r .revision <<<"$latest")"
          [[ "$actual" == "$expected" ]] || { echo "hash mismatch: $actual != $expected" >&2; exit 1; }
          version="$(aws lambda publish-version --function-name "$fn" --description "whatsapp-analytics ${GITHUB_SHA}"             --code-sha256 "$expected" --revision-id "$revision" --query Version --output text)"
          if aws lambda get-alias --function-name "$fn" --name live >/dev/null 2>&1; then
            arev="$(aws lambda get-alias --function-name "$fn" --name live --query RevisionId --output text)"
            aws lambda update-alias --function-name "$fn" --name live --function-version "$version" --revision-id "$arev" >/dev/null
          else
            aws lambda create-alias --function-name "$fn" --name live --function-version "$version" >/dev/null
          fi
          live_sha="$(aws lambda get-function-configuration --function-name "$fn" --qualifier live --query CodeSha256 --output text)"
          [[ "$live_sha" == "$expected" ]] || { echo "live alias hash mismatch" >&2; exit 1; }
          echo "$fn live -> v$version $live_sha"

  post-deploy-whatsapp-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wecare.digital'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke dependency
        run: python -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Configure read-only smoke credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-whatsapp-smoke-oidc
          aws-region: us-east-1
          allowed-account-ids: "775261844268"
          role-session-name: whatsapp-smoke-${{ github.run_id }}
      - name: Verify live WhatsApp backend
        run: python scripts/smoke_whatsapp_backend_live.py

