name: Plivo verification

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/plivo-verification.yml'
      - 'scripts/plivo*'
      - 'amplify/functions/messaging/plivo-answer/**'
      - 'amplify/functions/shared/lambda_utils/**'
      - 'tests/test_plivo*'
      - 'requirements-dev.txt'
  pull_request:
    branches: [stack]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plivo-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plivo-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Capture tested revision and tracked source
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=zip --output=verification/source.zip HEAD
      - name: Install test dependencies from repository pins
        run: |
          grep -E '^(pytest|boto3|botocore|plivo|requests|PyYAML)==' requirements-dev.txt > verification/test-requirements.txt
          python -m pip install -r verification/test-requirements.txt
      - name: Test Plivo control plane, signatures and webhooks
        run: python -m pytest tests/test_plivo*.py -v --junitxml=verification/plivo-tests.xml
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plivo-verification-${{ github.sha }}
          path: verification/
          retention-days: 7
          if-no-files-found: error
