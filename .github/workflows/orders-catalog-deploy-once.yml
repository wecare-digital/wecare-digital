name: Orders catalog Lambda deploy (one-shot)

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/orders-catalog-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: orders-catalog-deploy-once
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run focused regression suite
        run: |
          python -m pytest -q             tests/test_customer_orders_flow.py             tests/test_meta_catalog_sync_handler.py
      - name: Configure exact-scope AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-digital-orders-catalog-deploy-temp-20261009
          aws-region: us-east-1
          role-session-name: orders-catalog-deploy
      - name: Deploy current source through repository deployer
        run: |
          python scripts/deploy_all_lambdas.py             wecare-whatsapp-business-api             wecare-meta-catalog-sync
