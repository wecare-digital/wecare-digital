name: Unified WECARE Shop pricing safety

on:
  pull_request:
    paths:
      - 'amplify/functions/ecommerce/checkout/handler.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/unified_pricing.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/express_policy.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/default_coupon.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/service_pricing_native.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/service_requests.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/request_service_contracts.py'
      - 'src/config/requestServiceContracts.ts'
      - 'tests/test_shop_unified_pricing.py'
      - 'tests/test_shop_express_policy.py'
      - '.github/workflows/shop-unified-pricing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-money-contract:
    name: 29 totals, single fee, service consistency, Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import-only AWS SDK dependency (no AWS calls)
        run: python -m pip install --disable-pip-version-check --no-input boto3
      - name: Compile customer checkout pricing (no provider calls)
        run: |
          python -m compileall -q amplify/functions/ecommerce/checkout
          python -m compileall -q amplify/functions/shared/lambda_utils/ecommerce
      - name: Verify all 29 owner-approved customer prices
        env:
          PYTHONPATH: amplify/functions/shared
        run: python -m unittest discover -s tests -p 'test_shop_unified_pricing.py' -v
      - name: Verify historical Express and Contribute regression contract
        env:
          PYTHONPATH: amplify/functions/shared
        run: python -m unittest discover -s tests -p 'test_shop_express_policy.py' -v
