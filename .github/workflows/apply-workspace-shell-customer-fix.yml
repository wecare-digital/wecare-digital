name: Apply shared Workspace shell and customer profile fix

on:
  push:
    branches:
      - feat/payments-home-mobile-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payments-home-mobile-foundation
          fetch-depth: 0

      - name: Apply central shell and customer form changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          layout = r'''/**
           * Canonical authenticated WECARE.DIGITAL Workspace shell.
           * Shared Header/navigation, Stay connected and Footer stay stable; only page content changes.
           */
          import React, { ReactNode, createContext, useContext, useEffect, useState } from 'react';
          import { useRouter } from 'next/router';
          import Header from './Header';
          import Footer from './Footer';
          import PublicShare from './PublicShare';
          import SearchModal from './SearchModal';
          import PushOptIn from './PushOptIn';
          import { useKeyboardShortcuts } from '../hooks/useKeyboardShortcuts';
          import { useUserRole, isPartnerAllowed } from '../hooks/useUserRole';
          import { Breadcrumbs, KeyboardShortcuts, useKeyboardShortcutsModal } from './ui';

          interface LayoutProps { children: ReactNode; user?: any; onSignOut?: () => void; showBreadcrumbs?: boolean; }
          const WorkspaceShellContext = createContext( false );

          const SearchGlyph = () => (<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>);
          const TasksGlyph = () => (<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.4 1.4L7 5.1M3.5 12l1.4 1.4L7 11.1M3.5 18l1.4 1.4L7 17.1"/></svg>);
          const PersonGlyph = () => (<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21c.8-4.1 3.3-6.2 7.5-6.2s6.7 2.1 7.5 6.2"/></svg>);

          const Layout: React.FC<LayoutProps> = ( { children, user, onSignOut, showBreadcrumbs = true } ) => {
            const nested = useContext( WorkspaceShellContext );
            const router = useRouter();
            const { isPartner, loading: roleLoading } = useUserRole();
            const [ searchOpen, setSearchOpen ] = useState( false );
            const [ profileOpen, setProfileOpen ] = useState( false );
            const shortcutsModal = useKeyboardShortcutsModal();

            useEffect( () => {
              if ( !roleLoading && isPartner && !isPartnerAllowed( router.pathname ) ) void router.replace( '/workspace/engage/whatsapp/my-account' );
            }, [ roleLoading, isPartner, router ] );
            useEffect( () => { setProfileOpen( false ); }, [ router.pathname ] );
            useKeyboardShortcuts( [
              { key: 'k', ctrl: true, action: () => setSearchOpen( true ), description: 'Open search' },
              { key: '/', action: () => setSearchOpen( true ), description: 'Open search' },
            ] );

            if ( nested ) return <>{ children }</>;

            const isHome = router.pathname === '/workspace';
            const isPayments = router.pathname === '/workspace/payments' || router.pathname === '/workspace/pay';
            const loginId = user?.signInDetails?.loginId || user?.email || '';
            const role = user?.role || 'Operator';

            return (
              <WorkspaceShellContext.Provider value>
                <div className={ `layout workspace-shell workspace-public-shell ${isHome ? 'workspace-home-shell' : ''} ${isPayments ? 'payments-public-layout' : ''}`.trim() }>
                  <Header />
                  <main id="main-content" className="main-content workspace-main" data-wc-no-translate="true">
                    <section className="workspace-utility" aria-label="Workspace tools">
                      <div className="workspace-utility-inner">
                        <div className="workspace-context">
                          { !isHome ? <button type="button" className="workspace-back" onClick={ () => void router.push( '/workspace' ) }><span aria-hidden="true">←</span><span>Workspace</span></button> : <span className="workspace-context-label">Workspace</span> }
                        </div>
                        <div className="workspace-actions" aria-label="Workspace actions">
                          <button type="button" className="workspace-action workspace-search" onClick={ () => setSearchOpen( true ) } aria-label="Search workspace"><SearchGlyph /><span>Search</span><kbd>⌘K</kbd></button>
                          <button type="button" className="workspace-action" onClick={ () => void router.push( '/workspace/task' ) } aria-label="Tasks"><TasksGlyph /><span>Tasks</span></button>
                          <div className="workspace-profile-wrap">
                            <button type="button" className={ `workspace-action ${profileOpen ? 'active' : ''}` } aria-label="Profile" aria-expanded={ profileOpen } onClick={ () => setProfileOpen( value => !value ) }><PersonGlyph /><span>Profile</span></button>
                            { profileOpen && <><button type="button" className="profile-scrim" aria-label="Close profile" onClick={ () => setProfileOpen( false ) }/><section className="profile-menu" aria-label="Profile menu"><div className="profile-identity"><strong>{ role }</strong>{ loginId && <span>{ loginId }</span> }</div><PushOptIn />{ onSignOut && <button type="button" className="profile-signout" onClick={ onSignOut }>Sign out</button> }</section></> }
                          </div>
                        </div>
                      </div>
                    </section>
                    <div className="workspace-content-shell">
                      { showBreadcrumbs && <Breadcrumbs /> }
                      <div className="inner-content-container">{ children }</div>
                    </div>
                  </main>
                  <div className="workspace-public-action-tail"><PublicShare /></div>
                  <Footer />
                  <SearchModal isOpen={ searchOpen } onClose={ () => setSearchOpen( false ) } />
                  <KeyboardShortcuts isOpen={ shortcutsModal.isOpen } onClose={ shortcutsModal.close } />
                  <style jsx global>{`
                    .workspace-public-shell{display:block;min-height:100vh;min-height:100dvh;min-width:0;overflow-x:hidden;overflow-x:clip;background:var(--public-bg,#fff);color:var(--public-text,#111);font-family:var(--font-sans)}
                    .workspace-public-shell .workspace-main{width:100%;max-width:none;min-width:0;min-height:calc(100vh - 108px);min-height:calc(100dvh - 108px);margin:0;padding:108px 0 0;box-sizing:border-box;overflow-x:hidden;overflow-x:clip;background:#fff}
                    .workspace-utility{width:100%;border-bottom:1px solid var(--public-hairline,#e5e7eb);background:rgba(255,255,255,.96)}
                    .workspace-utility-inner{width:min(100%,var(--public-content-max,1300px));min-width:0;margin:0 auto;padding:14px var(--public-page-gutter,24px);box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px}
                    .workspace-context,.workspace-actions{min-width:0;display:flex;align-items:center;gap:8px}.workspace-context-label{color:var(--public-brand-green,#1a3a2a);font-size:var(--public-supporting-size,16px);font-weight:700}
                    .workspace-back,.workspace-action,.profile-signout{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;min-width:0;min-height:0;padding:9px 12px;border:1px solid var(--public-hairline,#e5e7eb);border-radius:10px;background:#fff;color:var(--public-brand-green,#1a3a2a);font:650 14px/1.25 var(--font-sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
                    .workspace-back{padding-inline-start:4px;border-color:transparent;background:transparent}.workspace-action:hover,.workspace-action.active,.workspace-back:hover,.profile-signout:hover{border-color:var(--public-brand-lime,#d1f470);background:var(--public-lime-tint,#f8faf3)}
                    .workspace-action:focus-visible,.workspace-back:focus-visible,.profile-signout:focus-visible{outline:2px solid var(--public-brand-green,#1a3a2a);outline-offset:2px}.workspace-search{width:min(32vw,260px);justify-content:flex-start}.workspace-search kbd{margin-inline-start:auto;padding:2px 6px;border:1px solid var(--public-hairline,#e5e7eb);border-radius:6px;background:#f8faf3;color:var(--public-muted,#6b7280);font:inherit;font-size:12px}
                    .workspace-profile-wrap{position:relative;display:inline-flex}.profile-scrim{position:fixed;inset:0;z-index:1190;border:0;background:transparent}.profile-menu{position:absolute;z-index:1200;top:calc(100% + 8px);inset-inline-end:0;width:min(320px,calc(100vw - 32px));padding:14px;border:1px solid var(--public-hairline,#e5e7eb);border-top:4px solid var(--public-brand-lime,#d1f470);border-radius:16px;background:#fff;box-shadow:0 18px 46px rgba(26,58,42,.15)}
                    .profile-identity{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;min-width:0}.profile-identity strong{font-size:14px}.profile-identity span{font-size:12px;color:var(--public-muted,#6b7280);overflow-wrap:anywhere}.profile-signout{width:100%;margin-top:10px}
                    .workspace-content-shell{width:100%;max-width:var(--public-content-max,1300px);min-width:0;margin:0 auto;box-sizing:border-box;overflow-x:hidden;overflow-x:clip}.workspace-public-shell .breadcrumbs{width:auto!important;max-width:none!important;margin:0!important;padding:14px var(--public-page-gutter,24px) 0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}.workspace-public-shell .inner-content-container{width:100%!important;max-width:var(--public-content-max,1300px)!important;min-width:0;margin:0 auto!important;box-sizing:border-box;overflow:visible!important}
                    .workspace-public-action-tail{width:100%;max-width:var(--public-content-max,1300px);min-width:0;margin:0 auto;padding:8px var(--public-page-gutter,24px) 48px;box-sizing:border-box;overflow-x:hidden;overflow-x:clip}
                    .workspace-public-shell .contacts-auth-modal input,.workspace-public-shell .contacts-auth-modal select,.workspace-public-shell .contacts-auth-modal textarea{font-size:16px!important}.workspace-public-shell .contacts-auth-modal .contacts-form-contact{grid-template-columns:minmax(0,1fr)!important}.workspace-public-shell .contacts-auth-modal .contacts-modal-body{min-width:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
                    @media(max-width:767px){.workspace-public-shell .workspace-main{min-height:calc(100vh - 96px);min-height:calc(100dvh - 96px);padding-top:96px}.workspace-utility-inner{padding:12px max(var(--public-mobile-page-gutter,16px),env(safe-area-inset-right,0px)) 12px max(var(--public-mobile-page-gutter,16px),env(safe-area-inset-left,0px));align-items:stretch;flex-direction:column;gap:10px}.workspace-context{width:100%;justify-content:flex-start}.workspace-actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.workspace-search{width:100%;min-width:0}.workspace-action span,.workspace-back span{white-space:nowrap}.workspace-public-shell .breadcrumbs{padding-inline:max(var(--public-mobile-page-gutter,16px),env(safe-area-inset-left,0px))!important;overflow-x:auto;scrollbar-width:none}.workspace-public-action-tail{padding-inline:max(var(--public-mobile-page-gutter,16px),env(safe-area-inset-left,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}.workspace-public-shell .customer-modal-overlay{align-items:flex-end!important;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))!important}.workspace-public-shell .customer-modal-panel{width:100%!important;max-width:100%!important;max-height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important;border-radius:18px 18px 0 0!important}.workspace-public-shell .contacts-form-grid{grid-template-columns:minmax(0,1fr)!important}.workspace-public-shell .contacts-phone-control{grid-template-columns:minmax(76px,92px) minmax(0,1fr)!important}.workspace-public-shell .contacts-modal-actions{position:sticky;bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))!important;background:#fff}}
                    @media(max-width:420px){.workspace-actions{grid-template-columns:minmax(0,1fr) 44px 44px}.workspace-actions .workspace-action:not(.workspace-search){padding-inline:10px}.workspace-actions .workspace-action:not(.workspace-search) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.workspace-search kbd{display:none}}
                    @media(prefers-reduced-motion:reduce){.workspace-public-shell *{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}@media(forced-colors:active){.workspace-action,.workspace-back,.profile-menu,.profile-signout{border-color:CanvasText}}
                  `}</style>
                </div>
              </WorkspaceShellContext.Provider>
            );
          };
          export default Layout;
          '''
          Path('src/components/Layout.tsx').write_text(textwrap.dedent(layout).lstrip(), encoding='utf-8')

          customer_path = Path('src/pages/workspace/customers/index.tsx')
          customer = customer_path.read_text(encoding='utf-8')
          customer = replace_once(customer, "input: { width: '100%', minHeight: 46, padding: '8px 0', border: 0, borderBottom: '1px solid #dfe4df', borderRadius: 0, fontSize: 15,", "input: { width: '100%', minHeight: 46, padding: '8px 0', border: 0, borderBottom: '1px solid #dfe4df', borderRadius: 0, fontSize: 16,", 'customer input size')

          phone_block = '''      <div className="contacts-form-contact">
                <div>
                  <label htmlFor="contact-phone" style={S.label}>Linked WhatsApp number *</label>
                  <div className="contacts-phone-control">
                    <div className="contacts-country-code">
                      <input type="text" value={showCountryDropdown ? countrySearch : formCountryCode} onChange={e => { setCountrySearch(e.target.value); setShowCountryDropdown(true); setFormError(''); }} onFocus={() => { setShowCountryDropdown(true); setCountrySearch(''); }} onBlur={(e) => { const dropdown = e.currentTarget.parentElement?.querySelector('[data-country-dropdown]'); if (dropdown && dropdown.contains(e.relatedTarget as Node)) return; setShowCountryDropdown(false); }} placeholder="Code" aria-label="Phone country code" style={{ ...S.input, width: '100%', cursor: 'pointer' }} onFocusCapture={focusStyle} onBlurCapture={blurStyle} />
                      {showCountryDropdown && <div data-country-dropdown tabIndex={-1} className="contacts-country-dropdown">{COUNTRY_CODES.filter(cc => cc.code.includes(countrySearch) || cc.country.toLowerCase().includes(countrySearch.toLowerCase())).map(cc => <div key={cc.code} tabIndex={-1} onMouseDown={() => { setFormCountryCode(cc.code); setShowCountryDropdown(false); setCountrySearch(''); setFormError(''); }} className="contacts-country-option">{cc.code} {cc.country}</div>)}</div>}
                    </div>
                    <input id="contact-phone" style={S.input} value={formPhone} onChange={e => { setFormPhone(e.target.value); setFormError(''); setDuplicateContact(null); }} placeholder="Mobile number" maxLength={20} inputMode="tel" autoComplete="tel" onFocus={focusStyle} onBlur={blurStyle} />
                  </div>
                  <p style={S.hint}>Country code is added automatically. This is the customer identity used for WhatsApp service and payment requests.</p>
                </div>
              </div>
              <div>
                <label htmlFor="contact-profile-username"'''
          customer, count = re.subn(r'      <div className="contacts-form-contact">.*?      </div>\n      <div>\n        <label htmlFor="contact-profile-username"', phone_block, customer, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'customer phone/email form replacement: {count}')

          customer = replace_once(customer, '''      <div>
                <p style={{ ...S.label, marginBottom: 8 }}>Address</p>
                <div className="contacts-form-grid">''', '''      <div>
                <p style={{ ...S.label, marginBottom: 2 }}>Your address</p>
                <p style={{ ...S.hint, marginBottom: 10 }}>Used for service, delivery, and account details.</p>
                <div className="contacts-form-grid">''', 'address heading')

          identity_start = customer.index("      <div style={{ borderTop: '1px solid var(--border)', paddingTop: 14 }}>")
          identity_end = customer.index('    </div>\n  );', identity_start)
          customer = customer[:identity_start] + customer[identity_end:]
          customer = replace_once(customer, "    if (!formPhone && !formEmail) {\n      fail('Enter a WhatsApp phone or email. For payment testing, enter the WhatsApp phone number.', 'contact-phone');\n      return;\n    }", "    if (!formPhone) {\n      fail('Enter the linked WhatsApp phone number.', 'contact-phone');\n      return;\n    }", 'create phone requirement')
          customer = customer.replace("    if (formEmail && !isValidEmail(formEmail)) {\n      fail('Invalid email format', 'contact-email'); return;\n    }\n", '', 1)
          customer = replace_once(customer, '''    const dup = checkDuplicate(formPhone, formEmail);
                if (dup) {
                  setDuplicateContact(findDuplicateContact(formPhone, formEmail));
                  fail(dup, formPhone ? 'contact-phone' : 'contact-email');
                  return;
                }''', '''    const dup = checkDuplicate(formPhone, '');
                if (dup) {
                  const existing = findDuplicateContact(formPhone, '');
                  setDuplicateContact(existing);
                  setFormError('');
                  toast.warning(existing ? 'This WhatsApp number is already saved. Open the existing customer or use it for payment.' : 'This WhatsApp number already belongs to an existing customer.');
                  return;
                }''', 'local duplicate handling')
          customer = replace_once(customer, "        name: formName, phone: fullPhone || undefined, email: formEmail || undefined,", "        name: formName, phone: fullPhone || undefined,", 'create payload email')
          customer = customer.replace('resolveDuplicateContact(formPhone, formEmail)', "resolveDuplicateContact(formPhone, '')", 1)
          old = '''          setDuplicateContact(existing);
          const message = existing
            ? (existing.archivedAt
              ? `Customer already exists and is archived: ${existing.name || existing.phone || existing.email || existing.contactId}`
              : `Customer already exists: ${existing.name || existing.phone || existing.email || existing.contactId}`)
            : (result.failure.message || 'A contact with this phone or email already exists');
          setFormError(message);
          toast.warning(message);'''
          new = '''          setDuplicateContact(existing);
          if (existing) {
            setFormError('');
            toast.warning(existing.archivedAt ? 'This WhatsApp customer already exists and is archived. Restore it below.' : 'This WhatsApp customer already exists. Open it or use it for payment below.');
          } else {
            const message = 'This WhatsApp number already belongs to an existing customer. Search by number to open it.';
            setFormError(message);
            toast.warning(message);
          }'''
          customer = replace_once(customer, old, new, 'backend duplicate message')
          customer = replace_once(customer, "    if (!editingContact || (!formPhone && !formEmail)) { toast.warning('Phone or email is required'); return; }", "    if (!editingContact || !formPhone) { toast.warning('WhatsApp phone is required'); return; }", 'update phone requirement')
          customer = customer.replace("    if (formEmail && !isValidEmail(formEmail)) {\n      toast.warning('Invalid email format'); return;\n    }\n", '', 1)
          customer = replace_once(customer, '    const dup = checkDuplicate(formPhone, formEmail, editingContact.contactId);', "    const dup = checkDuplicate(formPhone, '', editingContact.contactId);", 'update duplicate check')
          customer = customer.replace('min-width:44px !important;min-height:44px !important;', 'min-width:0 !important;min-height:0 !important;')
          customer_path.write_text(customer, encoding='utf-8')

          payment_path = Path('src/pages/workspace/payments/index.tsx')
          payment = payment_path.read_text(encoding='utf-8')
          payment = payment.replace("import Header from '../../../components/Header';\nimport Footer from '../../../components/Footer';\nimport PublicShare from '../../../components/PublicShare';\n", "import Layout from '../../../components/Layout';\n", 1)
          start = payment.index('  return (\n    <>\n      <SEO title="Payments"')
          shell_start = payment.index('            <PageShell', start)
          shell_end = payment.index('            </PageShell>', shell_start) + len('            </PageShell>')
          page_shell = textwrap.dedent(payment[shell_start:shell_end])
          new_return = '  return (\n    <Layout user={ user } onSignOut={ signOut } showBreadcrumbs={ false }>\n      <SEO title="Payments" description="Collect payments and review the authoritative payment ledger." noindex />\n' + textwrap.indent(page_shell, '      ') + '\n    </Layout>\n  );'
          return_end = payment.index('  );\n};\n\nexport default PaymentsPage;', shell_end) + len('  );')
          payment = payment[:start] + new_return + payment[return_end:]
          payment_path.write_text(payment, encoding='utf-8')

          css_path = Path('src/styles/workspace.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('min-height: var(--tap-min) !important;', 'min-height: 0 !important;')
          css = css.replace('min-height: var(--tap-min);\n  padding: 8px 14px !important;', 'min-height: 0;\n  padding: 8px 14px !important;')
          css += '''

          /* Shared Workspace shell + F001 customer form mobile containment. */
          .workspace-public-shell .contacts-auth-modal .contacts-form-contact,
          .workspace-public-shell .contacts-auth-modal .contacts-form-grid { min-width: 0; }
          .workspace-public-shell .contacts-auth-modal .contacts-modal-actions button { min-height: 0 !important; }
          @media (max-width: 767px) {
            .workspace-public-shell .contacts-auth-modal .contacts-modal-head,
            .workspace-public-shell .contacts-auth-modal .contacts-modal-body { padding-inline: 16px !important; }
            .workspace-public-shell .contacts-auth-modal .contacts-modal-actions { display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px!important;padding-inline:16px!important; }
            .workspace-public-shell .contacts-auth-modal .contacts-duplicate-card { margin-inline:16px!important; }
          }
          @media (max-width: 399px) {
            .workspace-public-shell .contacts-auth-modal .contacts-modal-actions,
            .workspace-public-shell .contacts-auth-modal .contacts-duplicate-actions { grid-template-columns:minmax(0,1fr)!important; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          test = r'''"""Source contracts for the shared Workspace shell and F001 customer form."""
          from pathlib import Path
          ROOT = Path(__file__).resolve().parents[1]
          def test_workspace_layout_uses_one_shared_public_shell():
              source = (ROOT / 'src/components/Layout.tsx').read_text()
              assert "import Header from './Header'" in source
              assert "import PublicShare from './PublicShare'" in source
              assert "import Footer from './Footer'" in source
              assert source.count('<Header />') == 1
              assert source.count('<PublicShare />') == 1
              assert source.count('<Footer />') == 1
              assert 'WorkspaceShellContext' in source
              assert 'data-wc-no-translate="true"' in source
              assert 'BottomNav' not in source
          def test_payments_uses_canonical_layout_not_a_copied_shell():
              source = (ROOT / 'src/pages/workspace/payments/index.tsx').read_text()
              assert "import Layout from '../../../components/Layout'" in source
              assert '<Layout user={ user } onSignOut={ signOut }' in source
              assert "import Header from" not in source
              assert '<PublicShare />' not in source
              assert '<Footer />' not in source
          def test_customer_modal_matches_subscribe_profile_and_resolves_duplicates():
              source = (ROOT / 'src/pages/workspace/customers/index.tsx').read_text()
              form = source[source.index('const renderContactForm'):source.index('  return (', source.index('const renderContactForm'))]
              for label in ('Full name *','Linked WhatsApp number *','WhatsApp username','Organization','Job title','Your address'): assert label in form
              assert 'contact-email' not in form
              assert 'Contact &amp; system identity' not in form
              assert "checkDuplicate(formPhone, '')" in source
              assert 'Open existing customer' in source
              assert 'Use for payment' in source
              assert 'HTTP 409' not in source
          '''
          Path('tests/test_workspace_shared_shell_customer_form.py').write_text(textwrap.dedent(test).lstrip(), encoding='utf-8')
          Path('.github/workflows/apply-workspace-shell-customer-fix.yml').unlink()
          PY

      - name: Verify source contracts
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_customer_duplicate_resolution.py tests/test_workspace_shared_shell_customer_form.py

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(workspace): share auth shell and align customer profile"
