name: Customer release gates

on:
  pull_request:
    branches: [wecare.digital]
  push:
    branches: [wecare.digital]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, customer action contracts and Lambda syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproduce Amplify npm install
        run: |
          npm install --global npm@11.6.2
          npm ci --no-audit --no-fund
      - name: Type-check customer frontend
        run: npx tsc --noEmit
      - name: Guard customer action and notification source contracts
        run: |
          node --test tests/customer_menu_referral_contract.test.mjs tests/public_toast_before_style_contract.test.mjs tests/public_action_feedback_contract.test.mjs tests/public_single_action_feedback_contract.test.mjs tests/public_customer_notification_copy.test.mjs tests/amplify_customer_lambda_syntax_gate.test.mjs
      - name: Compile customer-facing Python Lambda source without execution
        run: |
          python3 -m compileall -q amplify/functions/auth/customer-profile amplify/functions/messaging/whatsapp-business-api amplify/functions/messaging/inbound-whatsapp-handler amplify/functions/core/secure-files amplify/functions/shared/lambda_utils
