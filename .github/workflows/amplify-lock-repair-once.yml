name: Repair Amplify lockfile once

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/amplify-lock-repair-once.yml'
      - 'amplify/package.json'

permissions:
  contents: write

concurrency:
  group: amplify-lock-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stack

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: amplify/package-lock.json

      - name: Use npm version pinned by root packageManager
        run: |
          PINNED_NPM="$(node -e "const p=require('./package.json').packageManager;process.stdout.write(p.slice(p.lastIndexOf('@')+1))")"
          npm install --global "npm@${PINNED_NPM}"
          test "$(npm --version)" = "$PINNED_NPM"

      - name: Regenerate Amplify lockfile from package.json
        working-directory: amplify
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit npm-resolved lockfile
        run: |
          if git diff --quiet -- amplify/package-lock.json; then
            echo "Amplify lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amplify/package-lock.json
          git commit -m "Repair Amplify lockfile from npm resolver"
          for attempt in 1 2 3; do
            git fetch origin stack
            git rebase origin/stack
            if git push origin HEAD:stack; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to fast-forward stack after three attempts." >&2
          exit 1
