name: Retired Meta workspace safety
on:
  pull_request:
    paths:
      - 'src/components/workspace/commerce/Catalog.tsx'
      - '.github/workflows/retired-meta-workspace-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Use the same locked, reproducible install as the verified Amplify production build.
      - name: Install declared npm and locked dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci --no-audit --no-fund
      - name: Typecheck native product workspace
        run: npm run typecheck
      - name: Ensure retired Meta UI is inaccessible
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('src/components/workspace/commerce/Catalog.tsx','utf8');
          if (src.includes("(['products', 'meta'] as Tab[])")) throw Error('Meta tab restored');
          if (src.includes("{tab === 'meta' && (")) throw Error('Retired Meta controls restored');
          if (src.includes("metaEnabled: editMetaEnabled,")) throw Error('Native product save still writes Meta flag');
          if (!src.includes("['products'] as Tab[]")) throw Error('Native Products tab unavailable');
          NODE
