name: SEO tools Lambda

# Public blog reads use Wix Headless anonymous OAuth via the public client ID.
# Pull requests run focused tests only. A push to stack deploys and then invokes
# the real Lambda to verify the approved Integrity post end to end.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ stack ]
    paths:
      - 'amplify/functions/operations/seo-tools/**'
      - 'amplify/functions/seo_tools_handler.py'
      - 'amplify/functions/shared/lambda_utils/*.py'
      - 'amplify/functions/shared/static_knowledge_base.py'
      - 'tests/test_task12_seo.py'
      - 'tests/test_current_public_page_catalog.py'
      - 'scripts/deploy_seo_tools.py'
      - 'config/public-pages.json'
      - '.github/workflows/seo-tools-deploy.yml'
      - 'scripts/seo_deployment_scope.py'
      - 'tests/test_seo_deployment_scope.py'
  push:
    branches: [ stack ]
    paths:
      - 'amplify/functions/operations/seo-tools/**'
      - 'amplify/functions/seo_tools_handler.py'
      - 'amplify/functions/shared/lambda_utils/*.py'
      - 'amplify/functions/shared/static_knowledge_base.py'
      - 'tests/test_task12_seo.py'
      - 'tests/test_current_public_page_catalog.py'
      - 'scripts/deploy_seo_tools.py'
      - 'config/public-pages.json'
      - '.github/workflows/seo-tools-deploy.yml'
      - 'scripts/seo_deployment_scope.py'
      - 'tests/test_seo_deployment_scope.py'

env:
  AWS_REGION: us-east-1
  FUNCTION: wecare-seo-tools

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest boto3

      - name: Determine whether packaged SEO source changed
        if: github.event_name == 'push'
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/seo_deployment_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run SEO tools tests
        run: python -m pytest tests/test_task12_seo.py tests/test_current_public_page_catalog.py tests/test_seo_deployment_scope.py -q

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.test.outputs.deploy == 'true')
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Package SEO tools Lambda
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          functions = root / 'amplify' / 'functions'
          out = Path('/tmp/seo-tools.zip')

          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(functions / 'seo_tools_handler.py', 'seo_tools_handler.py')
              for f in sorted((functions / 'operations' / 'seo-tools').glob('*.py')):
                  z.write(f, f'operations/seo-tools/{f.name}')
              for f in sorted((functions / 'shared' / 'lambda_utils').glob('*.py')):
                  z.write(f, f'shared/lambda_utils/{f.name}')
              skb = functions / 'shared' / 'static_knowledge_base.py'
              if skb.exists():
                  z.write(skb, 'shared/static_knowledge_base.py')

          print(f'Built {out} ({out.stat().st_size} bytes)')
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # "bharat-stack" here is an AWS IAM role name, not a repository reference, and the
          # repo rename to wecare-digital/wecare-digital did not rename it. Do not "fix" this
          # string - it would point at a role that does not exist.
          # The rename DOES affect the role's trust policy, which matches the OIDC token's
          # `sub` claim containing the repository path. See the longer note in
          # docs-scraper-deploy.yml; the repair is on the AWS side.
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-bharat-stack-seo-tools
          role-session-name: bharat-stack-seo-tools
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb:///tmp/seo-tools.zip \
            --region "$AWS_REGION" >/tmp/deploy.json
          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION" \
            --region "$AWS_REGION"
          python - <<'PY'
          import json
          value = json.load(open('/tmp/deploy.json'))
          print('Deployed code SHA:', value.get('CodeSha256'))
          print('Last modified:', value.get('LastModified'))
          PY

      - name: Verify the live Headless read path on a post discovered at run time
        run: |
          # NO HARDCODED SLUG. Until 2026-10-01 this invoked
          # /seo-tools/blog-public/integrity-honoring-our-word and asserted that post's
          # title, slug, author and category. The post was renamed or removed in Wix, the
          # endpoint began answering 404 {"ok": false, "error": "Blog post not found"},
          # and this job went red on FIVE consecutive pushes to `stack` - on a Lambda that
          # deployed perfectly each time. The deploy step succeeds and only this
          # verification fails, so a red badge here was actively misleading.
          #
          # This is the SECOND time the same coupling broke the job. On 2026-09-28 it was
          # verbatim prose, unpinned then with the reasoning recorded below: Wix Blog is
          # the content source of truth, so an editor changing it is doing the sanctioned
          # thing, and a third-party CMS edit must not block an unrelated and possibly
          # urgent Lambda deploy. That principle was applied to the post's PROSE but not
          # to its IDENTITY, which is why a slug change reset the same trap. It now covers
          # identity too: the slug is discovered from the list route at run time.
          #
          # What this still proves, and it is the point of the job: that the deployed
          # Lambda can reach Wix Headless, list the corpus, fetch a single post by slug,
          # return the post that was ASKED for rather than some other one, and serve real
          # prose with no migrated media. Those hold for any post, so they cannot drift on
          # an edit - and they still fail loudly if the read path breaks.
          cat >/tmp/list-event.json <<'JSON'
          {
            "requestContext": {
              "apiId": "smoke",
              "http": {
                "method": "GET",
                "path": "/seo-tools/blog-public",
                "sourceIp": "127.0.0.1"
              }
            },
            "rawPath": "/seo-tools/blog-public"
          }
          JSON

          aws lambda invoke \
            --function-name "$FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/list-event.json \
            --region "$AWS_REGION" \
            /tmp/list-response.json >/tmp/list-invoke.json

          # Pick a slug off the live list. A corpus that lists zero posts is itself a
          # failure: it means the Headless read path is broken or serving an empty stale
          # cache, which is exactly what this job exists to catch.
          SLUG="$(python - <<'PY'
          import json, sys
          response = json.load(open('/tmp/list-response.json'))
          assert response.get('statusCode') == 200, response
          body = json.loads(response.get('body') or '{}')
          assert body.get('ok') is True, body
          posts = body.get('posts') or []
          assert posts, f'the live corpus listed zero posts: {str(body)[:400]}'
          slug = (posts[0] or {}).get('slug')
          assert slug, f'first listed post carries no slug: {posts[0]}'
          sys.stdout.write(slug)
          PY
          )"
          echo "Discovered live slug: $SLUG"

          python - "$SLUG" <<'PY' >/tmp/event.json
          import json, sys
          slug = sys.argv[1]
          path = f'/seo-tools/blog-public/{slug}'
          json.dump({'requestContext': {'apiId': 'smoke',
                                        'http': {'method': 'GET', 'path': path,
                                                 'sourceIp': '127.0.0.1'}},
                     'rawPath': path}, sys.stdout)
          PY

          aws lambda invoke \
            --function-name "$FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/event.json \
            --region "$AWS_REGION" \
            /tmp/response.json >/tmp/invoke.json

          echo "$SLUG" >/tmp/expected-slug.txt

          python - <<'PY'
          import json

          response = json.load(open('/tmp/response.json'))
          assert response.get('statusCode') == 200, response
          body = json.loads(response.get('body') or '{}')
          assert body.get('ok') is True, body
          post = body.get('post') or {}

          # IDENTITY, not content. The slug is asserted against the one we ASKED for, and
          # that is the assertion carrying the weight: it proves the endpoint returns the
          # REQUESTED post rather than a default, the first row, or a stale cached other.
          # Title, author and category are asserted PRESENT and non-empty rather than equal
          # to fixed strings. Every post has them; no post is guaranteed to keep a given
          # value, and pinning values is precisely what broke this job twice.
          expected_slug = open('/tmp/expected-slug.txt').read().strip()
          assert post.get('slug') == expected_slug, (
              f'asked for {expected_slug!r} but got {post.get("slug")!r}: {post}')
          for field in ('title', 'authorName', 'category'):
              assert str(post.get(field) or '').strip(), f'{field} empty on {expected_slug}: {post}'
          assert not post.get('coverImage'), post

          nodes = (post.get('richContent') or {}).get('nodes') or []
          node_types = []
          text_parts = []

          def walk(value):
              if isinstance(value, dict):
                  node_type = str(value.get('type') or '').upper()
                  if node_type:
                      node_types.append(node_type)
                  text = (value.get('textData') or {}).get('text')
                  if text:
                      text_parts.append(text)
                  for nested in value.values():
                      walk(nested)
              elif isinstance(value, list):
                  for nested in value:
                      walk(nested)

          walk(nodes)
          text = '\n'.join(text_parts)

          # DELIBERATELY NOT PINNED TO VERBATIM PROSE. Until 2026-09-28 this asserted
          # two exact sentences quoted from docs/blog-migration-standard.md. The post
          # was then edited in Wix - the opening became the explicit bicycle analogy and
          # "We can always choose it again." lost its "always" - and this deploy job went
          # red with `AssertionError` on a Lambda that had deployed perfectly.
          #
          # That is the wrong coupling in two ways. blog-migration-standard.md opens by
          # naming Wix Blog the content source of truth, so an editor changing copy there
          # is doing the sanctioned thing; and a copy edit in a third-party CMS must not
          # be able to block an unrelated, possibly urgent, Lambda deploy.
          #
          # What is asserted instead is everything the standard fixes as a *rule* rather
          # than as cadence - author, category, slug, no cover or inline media - plus
          # proof that real prose came back rather than an empty or truncated body. Those
          # cannot drift on an edit, and they still fail loudly if the Headless read path
          # breaks, returns the wrong post, or starts serving migrated imagery.
          assert len(text_parts) >= 4, f'expected >=4 text nodes, got {len(text_parts)}: {text_parts}'
          assert len(text) >= 400, f'body too short to be the real article ({len(text)} chars): {text}'
          # Removed 2026-10-01: `assert 'integrity' in text.lower()`. That was the last
          # content-coupled assertion left, and it only held while the slug was hardcoded to
          # an integrity post. Now that the post is discovered at run time it would fail on
          # any other article - a Gastronomy recipe, say - so it asserted the corpus's
          # subject matter rather than the read path. The length and node-count checks above
          # already prove real prose came back rather than an empty or truncated body.
          assert not ({'IMAGE', 'GALLERY', 'GIF', 'VIDEO', 'AUDIO'} & set(node_types))

          print(f'Live Integrity Headless smoke test passed '
                f'({len(text_parts)} paragraphs, {len(text)} chars, no media nodes)')
          PY
