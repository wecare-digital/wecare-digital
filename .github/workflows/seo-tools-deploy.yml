name: SEO tools Lambda

# Public blog reads are served from the AWS-native SeoToolsTable.
# Pull requests run focused tests only. A push to stack deploys and then invokes
# the real Lambda to verify the approved Integrity post end to end.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ stack ]
    paths:
      - 'amplify/functions/operations/seo-tools/**'
      - 'amplify/functions/seo_tools_handler.py'
      - 'amplify/functions/shared/lambda_utils/*.py'
      - 'amplify/functions/shared/static_knowledge_base.py'
      - 'amplify/functions/shared/blog_pipeline.py'
      - 'scripts/blog_quality_v2.py'
      - 'content/conversations/corpus-index.json'
      - 'config/public-pages.json'
      - 'tests/test_task12_seo.py'
      - 'tests/test_current_public_page_catalog.py'
      - 'tests/test_blog_sources.py'
      - 'tests/test_blog_queue.py'
      - 'tests/test_blog_analysis.py'
      - 'tests/test_blog_qa.py'
      - 'tests/test_blog_publish.py'
      - 'tests/test_blog_verify.py'
      - 'tests/test_blog_site_bridge.py'
      - 'tests/test_blog_repetition.py'
      - 'tests/test_blog_catalog.py'
      - 'tests/test_blog_production.py'
      - 'scripts/deploy_seo_tools.py'
      - 'config/public-pages.json'
      - '.github/workflows/seo-tools-deploy.yml'
      - 'scripts/seo_deployment_scope.py'
      - 'tests/test_seo_deployment_scope.py'
  push:
    branches: [ stack ]
    paths:
      - 'amplify/functions/operations/seo-tools/**'
      - 'amplify/functions/seo_tools_handler.py'
      - 'amplify/functions/shared/lambda_utils/*.py'
      - 'amplify/functions/shared/static_knowledge_base.py'
      - 'amplify/functions/shared/blog_pipeline.py'
      - 'scripts/blog_quality_v2.py'
      - 'content/conversations/corpus-index.json'
      - 'config/public-pages.json'
      - 'tests/test_task12_seo.py'
      - 'tests/test_current_public_page_catalog.py'
      - 'tests/test_blog_sources.py'
      - 'tests/test_blog_queue.py'
      - 'tests/test_blog_analysis.py'
      - 'tests/test_blog_qa.py'
      - 'tests/test_blog_publish.py'
      - 'tests/test_blog_verify.py'
      - 'tests/test_blog_site_bridge.py'
      - 'tests/test_blog_repetition.py'
      - 'tests/test_blog_catalog.py'
      - 'tests/test_blog_production.py'
      - 'scripts/deploy_seo_tools.py'
      - 'config/public-pages.json'
      - '.github/workflows/seo-tools-deploy.yml'
      - 'scripts/seo_deployment_scope.py'
      - 'tests/test_seo_deployment_scope.py'

env:
  AWS_REGION: us-east-1
  FUNCTION: wecare-seo-tools

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest boto3 pypdf==6.19.0

      - name: Determine whether packaged SEO source changed
        if: github.event_name == 'push'
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/seo_deployment_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run SEO tools tests
        run: >-
          python -m pytest
          tests/test_task12_seo.py
          tests/test_current_public_page_catalog.py
          tests/test_seo_deployment_scope.py
          tests/test_seo_package_contract.py
          tests/test_blog_sources.py
          tests/test_blog_queue.py
          tests/test_blog_analysis.py
          tests/test_blog_qa.py
          tests/test_blog_publish.py
          tests/test_blog_verify.py
          tests/test_blog_site_bridge.py
          tests/test_blog_repetition.py
          tests/test_blog_catalog.py
          tests/test_blog_production.py
          -q

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.test.outputs.deploy == 'true')
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      # A fresh runner: nothing the test job installed is here. The shared package
      # builder imports boto3 at module level and vendors the locally installed pypdf,
      # refusing any version other than PYPDF_VERSION in scripts/deploy_seo_tools.py.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install packaging dependencies
        run: python -m pip install --disable-pip-version-check boto3 pypdf==6.19.0

      - name: Package SEO tools Lambda
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.deploy_seo_tools import package

          out = Path('/tmp/seo-tools.zip')
          out.write_bytes(package())
          print(f'Built {out} ({out.stat().st_size} bytes)')
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # "bharat-stack" here is an AWS IAM role name, not a repository reference, and the
          # repo rename to wecare-digital/wecare-digital did not rename it. Do not "fix" this
          # string - it would point at a role that does not exist.
          # The rename DOES affect the role's trust policy, which matches the OIDC token's
          # `sub` claim containing the repository path. See the longer note in
          # docs-scraper-deploy.yml; the repair is on the AWS side.
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-bharat-stack-seo-tools
          role-session-name: bharat-stack-seo-tools
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb:///tmp/seo-tools.zip \
            --region "$AWS_REGION" >/tmp/deploy.json
          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION" \
            --region "$AWS_REGION"
          python - <<'PY'
          import json
          value = json.load(open('/tmp/deploy.json'))
          print('Deployed code SHA:', value.get('CodeSha256'))
          print('Last modified:', value.get('LastModified'))
          PY

      - name: Verify the AWS-native blog corpus and representative articles
        # The SEO Lambda serves SeoToolsTable content/contentText. This verifies
        # 1,400+ unique slugs, full pagination, and real article bodies at the start,
        # middle and end of the index.
        run: |
          python scripts/verify_seo_blog_lambda_native.py \
            --function "$FUNCTION" \
            --region "$AWS_REGION" \
            --min-posts 1400
