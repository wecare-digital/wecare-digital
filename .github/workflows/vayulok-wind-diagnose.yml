name: VayuLok wind dependency fingerprint diagnostic

on:
  push:
    branches: [ fix/vayulok-wind-http-range-store ]
    paths:
      - .github/workflows/vayulok-wind-diagnose.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Locate target fingerprints without printing values
        shell: python
        run: |
          import hashlib, re
          from pathlib import Path
          targets = {
              "a319dbdf2041", "25b3c9880103",
              "1cbb1adb8621", "7fb6cb4173b3",
          }
          rx = re.compile(r"(?:AKIA|ASIA)[0-9A-Z]{16}")
          found = []
          for path in Path("node_modules").rglob("*"):
              if not path.is_file() or path.suffix not in {".js",".mjs",".cjs",".json",".ts"}:
                  continue
              try:
                  text = path.read_text(errors="replace")
              except OSError:
                  continue
              for match in rx.findall(text):
                  fp = hashlib.sha256(match.encode()).hexdigest()[:12]
                  if fp in targets:
                      found.append((path.as_posix(), fp, len(match)))
          for path, fp, length in sorted(found):
              print(f"{path} sha256:{fp} length={length}")
          print(f"matches={len(found)}")
