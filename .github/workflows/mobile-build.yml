name: Mobile build (Capacitor)

# THE GAP THIS FILLS. The repo ships a Capacitor Android/iOS app (Phase 3) but no CI ever
# compiled it. A PR could break the native build - a bad gradle edit, a cap-sync mismatch, a
# web export that no longer produces out/ - and nothing would notice until a human ran a local
# build. This workflow exports the web app, runs `cap sync`, and BUILDS the Android project on
# every PR so a native-breaking change fails here instead of at release time.
#
# Signing is OPTIONAL and secret-gated. The unconditional signal is the DEBUG build, which needs
# no secrets and so runs on PRs from any source. A signed RELEASE AAB is produced only when the
# four keystore secrets are present (release pushes / manual runs), matching the env-driven
# signingConfig in android/app/build.gradle.
#
# iOS is NOT built here: xcodebuild needs a macOS runner plus Apple certificates/provisioning,
# which are not available to this Linux CI. The iOS archive/upload is done on a macOS runner or
# locally per docs/mobile/ios-entitlements-push.md; this workflow still validates that `cap sync`
# succeeds for the iOS platform so a web/plugin change that breaks the iOS project is caught.

on:
  pull_request:
    # Only when something that affects the native build changes, to keep PR noise down.
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'capacitor.public.config.ts'
      # Every src change is bundled into the native WebView. Without this, Home/shared UI
      # changes can skip Capacitor CI even though they ship inside the installed app.
      - 'src/**'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-build.yml'
  push:
    branches: [ stack ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build (export + cap sync + gradle)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Java for Gradle. Temurin 21 is the current LTS AGP supports; keep in step with the
      # android/ Gradle/AGP version if that is bumped.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Static export -> out/, then copy the web assets + plugins into the native project. This is
      # exactly `cap:build` minus the implicit watch; NODE_ENV=production flips next.config's
      # output:'export'.
      - name: Export web app and sync Capacitor
        run: NODE_ENV=production npm run cap:build

      # versionCode MUST increase on every Play upload. Derive it from the run number so repeated
      # CI builds never collide, without hand-editing build.gradle. (A release pipeline can instead
      # pass -PversionCodeOverride; this is the floor.)
      - name: Build Android (debug always; signed release when secrets present)
        working-directory: android
        env:
          WECARE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WECARE_ANDROID_KEYSTORE_PASSWORD }}
          WECARE_ANDROID_KEY_ALIAS: ${{ secrets.WECARE_ANDROID_KEY_ALIAS }}
          WECARE_ANDROID_KEY_PASSWORD: ${{ secrets.WECARE_ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.WECARE_ANDROID_KEYSTORE_BASE64 }}
          # Floor the versionCode at 1 + the run number so repeated uploads strictly increase.
          WECARE_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          # Debug build is the unconditional signal (no secrets needed).
          ./gradlew --no-daemon assembleDebug
          # Signed release only when a base64 keystore secret is configured.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Keystore secret present -> building signed release AAB"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export WECARE_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks"
            ./gradlew --no-daemon bundleRelease
          else
            echo "No keystore secret -> skipping signed release (debug build is the CI signal)."
          fi

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  public-shell-sync-check:
    name: Public app cap sync check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # CI-only identifier validates capacitor.public.config.ts without release credentials.
      WECARE_PUBLIC_APP_ID: digital.wecare.public.ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export public web app and sync both public shells
        run: |
          NODE_ENV=production npm run build
          # Capacitor 8 does not expose a --config CLI flag. For this isolated CI job,
          # make the public config the canonical filename the CLI loads, then sync both
          # already-added platform projects. The worktree is disposable.
          cp capacitor.public.config.ts capacitor.config.ts
          npx cap sync android
          npx cap sync ios

  ios-sync-check:
    name: iOS cap sync check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Linux cannot xcodebuild, but `cap sync ios` validates the web export + the iOS project
      # config/plugins so a change that breaks the iOS project is still caught in CI.
      - name: Export web app and sync iOS project
        run: |
          NODE_ENV=production npm run build
          npx cap sync ios

  ios-xcodebuild:
    name: iOS xcodebuild (real compile on macOS)
    # THE GAP THIS FILLS. The ios-sync-check lane above only proves `cap sync ios` succeeds on
    # Linux; it can NOT invoke xcodebuild (that needs a macOS runner + the Xcode toolchain). So a
    # change that compiles fine in the web export but breaks the native iOS target - a Swift/plugin
    # mismatch, a bad Info.plist, a broken SPM dependency graph - would slip through until a human
    # built locally. This job performs the REAL iOS compile the Linux lane could not provide.
    #
    # It is UNSIGNED on PRs (CODE_SIGNING_ALLOWED=NO), so it needs no Apple certificates and runs
    # on PRs from any source, exactly like the Android DEBUG build is the unconditional signal.
    # Producing a SIGNED archive/IPA and uploading it stays secret-gated and out-of-band on a
    # release runner per docs/mobile/ios-entitlements-push.md - this lane is the compile gate, not
    # the distribution pipeline.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export public web app and sync iOS project
        run: |
          NODE_ENV=production npm run build
          # Capacitor 8 has no --config CLI flag; make the PUBLIC shell canonical for this
          # isolated job (same pattern as public-shell-sync-check) so the iOS compile validates
          # the public WECARE.DIGITAL app shell. The worktree is disposable.
          cp capacitor.public.config.ts capacitor.config.ts
          npx cap sync ios
      # Capacitor 8 uses Swift Package Manager (ios/App/CapApp-SPM), so there is NO .xcworkspace
      # and NO CocoaPods/Podfile - the target is the plain project at ios/App/App.xcodeproj.
      # No shared xcscheme is committed; xcodebuild autocreates the default `App` scheme on demand
      # for the primary target. UNSIGNED Release build for iOS device SDK: no certificates needed.
      - name: xcodebuild (unsigned Release compile)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

  webkit-device-matrix:
    name: WebKit device matrix (iOS Safari / WKWebView engine)
    # THE GAP THIS FILLS. tools/browser/devicecheck.js supports --webkit, but Playwright WebKit
    # CANNOT launch on the Amazon-Linux sandbox/local harness (ICU + GTK native-dep mismatch), so
    # iOS Safari / WKWebView's engine behaviour (no horizontal overflow, h1 in-viewport, menu
    # height, 44px tap targets across the foldable/device postures) is never exercised there. This
    # job runs the SAME matrix on a WebKit-capable image so the iOS engine gap is closed in CI.
    runs-on: ubuntu-26.04
    # Microsoft's Playwright image ships WebKit's native dependencies preinstalled. Playwright
    # browser builds are revision-locked to the client version, and `npm ci` in tools/browser
    # installs the LOCKFILE-resolved playwright-core (tools/browser/package-lock.json -> 1.63.0),
    # NOT the ^1.49.0 semver floor in package.json. The image tag MUST track that resolved client
    # version so webkit.launch() (called with no executablePath) finds the matching WebKit binary.
    # Keep this tag in lockstep with the lockfile: bump it whenever playwright-core is bumped.
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser harness dependencies
        # tools/browser is a SEPARATE package.json (playwright-core) - install it on its own.
        working-directory: tools/browser
        run: npm ci || npm install
      - name: Export web app
        run: NODE_ENV=production npm run build
      # The harness spins up its own static server (tools/browser/lib/serve, serving out/) and
      # runs the device/posture matrix under the WebKit engine. Scoped to the key public routes
      # to keep runtime sane; drop the trailing args to sweep the full ROUTES list.
      - name: Run WebKit device matrix
        run: node tools/browser/devicecheck.js --webkit / /grahak-os/ /vayulok/ /contact/
