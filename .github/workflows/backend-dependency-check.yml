name: Backend dependency compatibility
on:
  pull_request:
    paths:
      - 'amplify/package.json'
      - 'amplify/package-lock.json'
      - 'scripts/check_backend_graphql_security.mjs'
      - 'scripts/guard_braces_depth.cjs'
      - 'scripts/check_braces_depth_guard.cjs'
      - '.github/workflows/backend-dependency-check.yml'
  push:
    branches: [stack]
    paths:
      - 'amplify/package.json'
      - 'amplify/package-lock.json'
      - 'scripts/check_backend_graphql_security.mjs'
      - 'scripts/guard_braces_depth.cjs'
      - 'scripts/check_braces_depth_guard.cjs'
      - '.github/workflows/backend-dependency-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: amplify/package-lock.json
      # The upstream bundled OpenTelemetry inconsistency prevents backend npm ci;
      # use the documented isolated install and require that its lock stays stable.
      - run: npm install --prefix amplify --ignore-scripts --no-audit --no-fund
      - run: node scripts/guard_braces_depth.cjs
      - run: node scripts/guard_braces_depth.cjs --check
      - run: node scripts/check_braces_depth_guard.cjs
      - run: git diff --exit-code -- amplify/package-lock.json
      - run: node scripts/check_backend_graphql_security.mjs
      - run: npm run amplify -- --help
