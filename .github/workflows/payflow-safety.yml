name: Payflow source and template safety
on:
  pull_request:
    paths:
      - '.github/workflows/payflow-safety.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/api/client.ts'
      - 'src/components/workspace/**'
      - 'src/content/paymentTemplateSnapshot.json'
      - 'src/lib/paymentFramework.ts'
      - 'amplify/functions/**'
      - 'scripts/check_f001_subscribe.py'
      - 'scripts/check_action_ui_contracts.cjs'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the declared npm version and locked dependencies
        run: |
          npm install --global npm@11.6.2
          npm ci --no-audit --no-fund
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Install pinned AWS SDK for isolated Python imports
        run: python -m pip install boto3==1.43.121
      - name: Check supported transport and approved form contracts without provider calls
        run: |
          PYTHONPATH=amplify/functions/shared python -m unittest discover -s tests -v
          python scripts/check_f001_subscribe.py
          node scripts/check_action_ui_contracts.cjs
