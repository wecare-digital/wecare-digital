name: Storage layout runtime deploy

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/storage-layout-runtime-deploy.yml'
      - 'amplify/functions/shared/lambda_utils/media_paths.py'
      - 'amplify/functions/shared/lambda_utils/template_media.py'
      - 'amplify/functions/shared/lambda_utils/ecommerce/dropdocs_storage.py'
      - 'amplify/functions/messaging/inbound-whatsapp-handler/**'
      - 'amplify/functions/messaging/waba-management/**'
      - 'amplify/functions/messaging/whatsapp-voice/**'
      - 'amplify/functions/messaging/whatsapp-calling/**'
      - 'amplify/functions/messaging/whatsapp-template-management/**'
      - 'amplify/functions/core/secure-files/**'
      - 'amplify/functions/operations/system-cleanup/**'
      - 'amplify/functions/edge/get-miss-redirect/**'
      - 'amplify/functions/ecommerce/catalog-media/**'
      - 'scripts/provision_catalog_media.py'
      - 'tests/test_catalog_media_delivery.py'
      - 'scripts/deploy_all_lambdas.py'
      - 'scripts/snapstart_publish.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-layout-runtime-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deploy/test dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.98 pytest

      - name: Assume exact-scope deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-runtime-deploy
          role-session-name: storage-layout-runtime-deploy
          aws-region: us-east-1

      - name: Require production account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "775261844268"

      - name: Compile storage migration sources
        run: |
          python -m py_compile             amplify/functions/shared/lambda_utils/media_paths.py             amplify/functions/shared/lambda_utils/template_media.py             amplify/functions/shared/lambda_utils/ecommerce/dropdocs_storage.py             amplify/functions/messaging/inbound-whatsapp-handler/handler.py             amplify/functions/messaging/waba-management/handler.py             amplify/functions/messaging/whatsapp-voice/handler.py             amplify/functions/messaging/whatsapp-calling/handler.py             amplify/functions/messaging/whatsapp-template-management/handler.py             amplify/functions/core/secure-files/handler.py             amplify/functions/operations/system-cleanup/handler.py             amplify/functions/edge/get-miss-redirect/handler.py             amplify/functions/ecommerce/catalog-media/handler.py             scripts/provision_catalog_media.py

      - name: Focused storage regression tests
        run: |
          python -m pytest             tests/test_dropdocs_document_privacy.py             tests/test_customer_receipt.py             tests/test_media_prefix_constant_flow.py             tests/test_create_s3_prefix.py             tests/test_catalog_media_delivery.py -q

      - name: Package validation
        run: |
          python scripts/deploy_all_lambdas.py --dry-run             wecare-inbound-whatsapp             wecare-waba-management             wecare-whatsapp-voice             wecare-whatsapp-calling             wecare-whatsapp-template-management             wecare-secure-files             wecare-system-cleanup

      - name: Deploy affected runtimes
        run: |
          python scripts/deploy_all_lambdas.py             wecare-inbound-whatsapp             wecare-waba-management             wecare-whatsapp-voice             wecare-whatsapp-calling             wecare-whatsapp-template-management             wecare-secure-files             wecare-system-cleanup

      # Pre-flight: the next step runs provision_catalog_media.py, whose first act is
      # iam:GetRole on wecare-catalog-media-role. That grant lives on the assumed deploy
      # role (GitHubActions-wecare-runtime-deploy) and is written by
      # scripts/provision_ci_runtime_deploy_role.py --apply, which an IAM admin must run
      # out of band (a CI deploy role may not rewrite its own permissions - that boundary
      # is deliberate). If the grant is missing, fail HERE with the exact remediation
      # instead of letting the deploy step die on a raw botocore AccessDenied traceback.
      - name: Preflight catalog-media IAM grant
        run: |
          python - <<'PY'
          import sys
          import boto3
          from botocore.exceptions import ClientError

          role = "wecare-catalog-media-role"
          try:
              boto3.client("iam", region_name="us-east-1").get_role(RoleName=role)
          except ClientError as exc:
              code = exc.response["Error"]["Code"]
              if code == "AccessDenied":
                  sys.stderr.write(
                      "\n".join([
                          "",
                          "Deploy role lacks iam:GetRole on " + role + ".",
                          "The committed grant is in scripts/provision_ci_runtime_deploy_role.py",
                          "(Sid ReadOnlyCatalogMediaExecutionRole) but has not been reconciled live.",
                          "An IAM admin must run, once:",
                          "    python scripts/provision_ci_runtime_deploy_role.py --apply",
                          "    python scripts/provision_ci_runtime_deploy_role.py --verify",
                          "Then re-run this workflow.",
                          "",
                      ])
                  )
                  sys.exit(1)
              # NoSuchEntity etc. means the exec role itself is absent - a different problem,
              # surfaced by the deploy step. Do not mask it here.
              print("preflight: get_role returned " + code + "; leaving to the deploy step")

      - name: Deploy catalog media on canonical storage
        run: |
          python scripts/provision_catalog_media.py --apply
          python scripts/provision_catalog_media.py --verify

      - name: Publish and associate Lambda Edge version
        run: |
          python - <<'PY'
          import io
          import pathlib
          import zipfile
          import boto3

          region = "us-east-1"
          fn_name = "wecare-get-miss-redirect"
          dist_id = "E2GP22R4BIFGQ3"
          source = pathlib.Path("amplify/functions/edge/get-miss-redirect/handler.py").read_bytes()

          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.writestr("handler.py", source)

          lam = boto3.client("lambda", region_name=region)
          cf = boto3.client("cloudfront")

          lam.update_function_code(FunctionName=fn_name, ZipFile=buf.getvalue(), Publish=False)
          waiter = lam.get_waiter("function_updated_v2")
          waiter.wait(FunctionName=fn_name)

          published = lam.publish_version(
              FunctionName=fn_name,
              Description="Allow secure/d/public public-delivery subtree",
          )
          new_arn = published["FunctionArn"]

          response = cf.get_distribution_config(Id=dist_id)
          cfg = response["DistributionConfig"]
          changed = 0

          behaviors = [cfg["DefaultCacheBehavior"]]
          behaviors.extend(cfg.get("CacheBehaviors", {}).get("Items", []))
          for behavior in behaviors:
              items = behavior.get("LambdaFunctionAssociations", {}).get("Items", [])
              for assoc in items:
                  if (
                      assoc.get("EventType") == "origin-response"
                      and "wecare-get-miss-redirect" in assoc.get("LambdaFunctionARN", "")
                  ):
                      assoc["LambdaFunctionARN"] = new_arn
                      changed += 1

          if changed != 1:
              raise SystemExit(f"expected exactly one edge association, found {changed}")

          cf.update_distribution(
              Id=dist_id,
              IfMatch=response["ETag"],
              DistributionConfig=cfg,
          )
          print(f"Lambda@Edge associated: {new_arn}")
          PY

      - name: Verify live aliases
        run: |
          python - <<'PY'
          import boto3
          lam = boto3.client("lambda", region_name="us-east-1")
          names = [
              "wecare-inbound-whatsapp",
              "wecare-waba-management",
              "wecare-whatsapp-voice",
              "wecare-whatsapp-calling",
              "wecare-whatsapp-template-management",
              "wecare-secure-files",
              "wecare-system-cleanup",
          ]
          bad = []
          for name in names:
              latest = lam.get_function_configuration(FunctionName=name)["CodeSha256"]
              alias = lam.get_alias(FunctionName=name, Name="live")["FunctionVersion"]
              served = lam.get_function_configuration(
                  FunctionName=f"{name}:{alias}"
              )["CodeSha256"]
              print(f"{name}: live=v{alias} current={served == latest}")
              if served != latest:
                  bad.append(name)
          if bad:
              raise SystemExit("live alias mismatch: " + ", ".join(bad))
          PY
