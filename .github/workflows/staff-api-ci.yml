name: Staff API CI

# Tests, packages and deploys the staff configuration APIs (WhatsApp template management and
# AI/settings config) on relevant production pushes. Deployment uses the scoped GitHub OIDC role
# `wecare-staff-api-deploy-oidc`; see docs/operations/staff-api-deploy.md for the exact policy.

on:
  pull_request:
    paths:
      - "amplify/functions/messaging/whatsapp-template-management/**"
      - "amplify/functions/ai/ai-config-management/**"
      - "amplify/functions/shared/lambda_utils/**"
      - "tests/test_staff_api_authorization.py"
      - "scripts/deploy_all_lambdas.py"
      - ".github/workflows/staff-api-ci.yml"
  push:
    branches:
      - "wecare.digital"
    paths:
      - "amplify/functions/messaging/whatsapp-template-management/**"
      - "amplify/functions/ai/ai-config-management/**"
      - "amplify/functions/shared/lambda_utils/**"
      - "tests/test_staff_api_authorization.py"
      - "scripts/deploy_all_lambdas.py"
      - ".github/workflows/staff-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hermetic test dependency
        run: python -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Compile staff API Python
        run: |
          python -m compileall -q \
            amplify/functions/messaging/whatsapp-template-management \
            amplify/functions/ai/ai-config-management \
            amplify/functions/shared/lambda_utils
      - name: Verify staff API authorization
        run: python -m unittest discover -s tests -p 'test_staff_api_authorization.py'

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check boto3==1.43.116
      - name: Build deterministic staff API packages
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          script = Path("scripts/deploy_all_lambdas.py")
          spec = importlib.util.spec_from_file_location("deploy_all_lambdas", script)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          targets = ["wecare-whatsapp-template-management", "wecare-ai-config-management"]
          by_name = {s.name: s for s in mod.SPECS}
          out = Path("dist/staff-api")
          out.mkdir(parents=True, exist_ok=True)
          manifest = {}
          for name in targets:
              payload, _members = mod.build_zip(by_name[name])
              archive = out / f"{name}.zip"
              archive.write_bytes(payload)
              digest = hashlib.sha256(payload).digest()
              manifest[name] = {
                  "file": archive.name,
                  "sha256_hex": digest.hex(),
                  "aws_code_sha256": base64.b64encode(digest).decode("ascii"),
                  "bytes": len(payload),
              }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload tested staff API packages
        uses: actions/upload-artifact@v4
        with:
          name: staff-api-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/staff-api/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wecare.digital'
    needs: package
    concurrency:
      group: staff-api-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          name: staff-api-${{ github.sha }}
          path: dist/staff-api
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-staff-api-deploy-oidc
          aws-region: us-east-1
          allowed-account-ids: "775261844268"
          role-session-name: staff-api-${{ github.run_id }}
      - name: Publish verified staff API packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist/staff-api
          for fn in wecare-whatsapp-template-management wecare-ai-config-management; do
            echo "::group::Deploy ${fn}"
            expected="$(jq -r --arg fn "${fn}" '.[$fn].aws_code_sha256' manifest.json)"
            revision="$(aws lambda get-function-configuration --function-name "${fn}" --query RevisionId --output text)"
            alias_revision="$(aws lambda get-alias --function-name "${fn}" --name live --query RevisionId --output text)"
            aws lambda update-function-code --function-name "${fn}" --zip-file "fileb://${fn}.zip" --revision-id "${revision}" --no-publish >/dev/null
            aws lambda wait function-updated-v2 --function-name "${fn}"
            latest="$(aws lambda get-function-configuration --function-name "${fn}" --query '{sha:CodeSha256,revision:RevisionId}' --output json)"
            actual="$(jq -r .sha <<<"${latest}")"
            latest_revision="$(jq -r .revision <<<"${latest}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Hash mismatch for ${fn}: expected ${expected}, got ${actual}" >&2
              exit 1
            fi
            version="$(aws lambda publish-version --function-name "${fn}" --description "staff-api ${GITHUB_SHA}" --code-sha256 "${expected}" --revision-id "${latest_revision}" --query Version --output text)"
            aws lambda update-alias --function-name "${fn}" --name live --function-version "${version}" --revision-id "${alias_revision}" >/dev/null
            live_sha="$(aws lambda get-function-configuration --function-name "${fn}" --qualifier live --query CodeSha256 --output text)"
            if [[ "${live_sha}" != "${expected}" ]]; then
              echo "Live alias hash mismatch for ${fn}: expected ${expected}, got ${live_sha}" >&2
              exit 1
            fi
            echo "${fn} live -> v${version} ${live_sha}"
            echo "::endgroup::"
          done
