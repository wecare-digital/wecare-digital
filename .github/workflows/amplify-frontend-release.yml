name: Amplify frontend release
# Builds the static site only when a frontend input changes (2026-10-27 audit, cost plan C2).
#
# Amplify's own auto-build rebuilt the site on every push to wecare.digital, and 136 of 256
# measured builds changed only backend, docs or test files. This workflow starts an Amplify
# RELEASE job instead, and only for the paths below, plus every 6 hours, because published blog
# posts reach the static export only through a build.
#
# SAFE TO MERGE BEFORE THE SWITCH. While the branch's Amplify auto-build is still on, push and
# schedule runs do nothing (Amplify builds the push itself), so there are never two builds. The
# switch is one setting, `enableAutoBuild=false` on the wecare.digital branch, made after a
# workflow_dispatch run has proved the role works. Rollback: set it back to true.
#
# The role can only be assumed from this repository's wecare.digital branch, and may only call
# amplify:StartJob and amplify:GetBranch on that one branch.
#
# THE PATH LIST ERRS BROAD. A missing path delays a frontend change until the next scheduled
# build (at most 6 hours, or a manual run); an extra path only costs one build.
on:
  push:
    branches:
      - "wecare.digital"
    paths:
      - "src/**"
      - "public/**"
      - "content/**"
      - "shared/**"
      - "config/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "next-env.d.ts"
      - "tsconfig.json"
      - "amplify.yml"
      - "customHttp.yml"
      - ".nvmrc"
      - "scripts/generate-*.js"
      - "scripts/blog-merges.js"
      - "scripts/guard_braces_depth.cjs"
      - "scripts/checkout_release_check.py"
      - "scripts/sync_faq.py"
      - "scripts/verify_public_bundle_secrets.py"
      - "amplify/functions/core/faq-handler/**"
      - ".github/workflows/amplify-frontend-release.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: amplify-frontend-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assume the frontend-release role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-amplify-frontend-release-oidc
          aws-region: us-east-1
      - name: Start an Amplify release
        env:
          APP_ID: d22dm4b0jn71jw
          BRANCH: wecare.digital
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          auto="$(aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH" --query 'branch.enableAutoBuild' --output text)"
          if [ "$auto" = "True" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Amplify auto-build is still on, so Amplify builds this push itself. Nothing to start."
            exit 0
          fi
          args=(--app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE --query 'jobSummary.[jobId,status]' --output text)
          if [ "$EVENT" = "schedule" ]; then
            args+=(--job-reason "scheduled content rebuild")
          else
            args+=(--commit-id "$SHA" --job-reason "$EVENT ${SHA:0:9}")
          fi
          # Amplify refuses a new job while the branch already has one queued (LimitExceededException).
          # Wait and retry rather than fail: a refused push would otherwise not build until the next
          # frontend push or the 6-hourly run (run 40618788503, 2026-10-28).
          for attempt in $(seq 1 12); do
            if out="$(aws amplify start-job "${args[@]}" 2>&1)"; then echo "$out"; exit 0; fi
            case "$out" in
              *LimitExceededException*) echo "Branch busy (attempt $attempt of 12); retrying in 60 s"; sleep 60 ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          done
          echo "Amplify still refused a new job after 12 minutes" >&2
          exit 1
