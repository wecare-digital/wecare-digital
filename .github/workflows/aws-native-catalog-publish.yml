name: AWS-native storefront catalog publish

# Unlike the deleted Wix polling workflow, this reads only our ProductsTable.
# The static Next.js export still needs a committed snapshot to build /shop/{slug}.
on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:
    inputs:
      allow_large_removal:
        description: 'Allow an editor-approved removal of more than half the visible shop'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

concurrency:
  group: native-storefront-catalog-publish
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/stack'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stack
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the pinned AWS SDK
        run: |
          python -m pip install --disable-pip-version-check \
            boto3==1.43.98

      - name: Obtain short-lived read-only AWS catalog credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-native-catalog-reader
          role-session-name: native-catalog-static-publish
          aws-region: us-east-1

      - name: Build the snapshot from our ProductsTable
        run: python scripts/build-catalog-snapshot.py --live

      - name: Refuse empty, truncated or unexpected mass removal
        shell: bash
        env:
          ALLOW_REMOVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_removal && 'true' || 'false' }}
        run: |
          args=(--restore-if-unchanged)
          if [[ "$ALLOW_REMOVAL" == "true" ]]; then
            args+=(--allow-large-removal)
          fi
          python scripts/check_native_catalog_snapshot.py "${args[@]}"

      - name: Commit material catalog updates only
        shell: bash
        run: |
          if git diff --quiet -- src/content/catalog-snapshot.json; then
            echo "No material ProductsTable change; no rebuild."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/content/catalog-snapshot.json
          git commit -m "chore(catalog): publish AWS-native ProductsTable snapshot"
          git push origin HEAD:stack
