name: Catalog approval deploy (one-shot)

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/catalog-approval-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-approval-deploy-once
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci
      - name: Focused backend security regression suite
        run: |
          python -m pytest -q             tests/test_meta_catalog_sync_handler.py             tests/test_meta_catalog_sync_iam.py             tests/test_catalog_sync_admin_control.py
      - name: TypeScript and focused Workspace test
        run: |
          npx tsc --noEmit
          npx vitest run src/test/MetaCatalogApprovalControl.test.ts
      - name: Configure exact-scope AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-catalog-approval-deploy-20261009
          aws-region: us-east-1
          role-session-name: catalog-approval-deploy
      - name: Deploy exact affected Lambda functions
        run: |
          python scripts/deploy_all_lambdas.py             wecare-whatsapp-business-api             wecare-meta-catalog-sync
