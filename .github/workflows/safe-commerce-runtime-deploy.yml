name: Safe commerce runtime deploy

on:
  push:
    branches: [stack]
    paths:
      - '.github/workflows/safe-commerce-runtime-deploy.yml'
      - 'amplify/functions/ecommerce/checkout/**'
      - 'amplify/functions/payments/invoice-engine/**'
      - 'amplify/functions/messaging/whatsapp-business-api/**'
      - 'amplify/functions/shared/lambda_utils/**'
      - 'scripts/deploy_all_lambdas.py'
      - 'scripts/snapstart_publish.py'
      - 'tests/test_payments.py'
      - 'tests/test_whatsapp_commerce_gap_closure.py'
      - 'tests/test_order_status_transitions.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-commerce-runtime-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deploy/test dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.98 pytest

      - name: Assume exact-scope deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-wecare-runtime-deploy
          role-session-name: safe-commerce-runtime-deploy
          aws-region: us-east-1

      - name: Require production account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "775261844268"

      - name: Compile and regression test
        run: |
          python -m py_compile             amplify/functions/ecommerce/checkout/handler.py             amplify/functions/ecommerce/checkout/invoice_engine.py             amplify/functions/payments/invoice-engine/handler.py             amplify/functions/messaging/whatsapp-business-api/handler.py             amplify/functions/messaging/whatsapp-business-api/flows/paid_submit_request.py
          python -m pytest             tests/test_whatsapp_commerce_gap_closure.py             tests/test_payments.py -q

      - name: Package validation
        run: |
          python scripts/deploy_all_lambdas.py --dry-run             wecare-checkout             wecare-invoice-engine             wecare-whatsapp-business-api

      - name: Deploy safe commerce runtimes
        run: |
          python scripts/deploy_all_lambdas.py             wecare-checkout             wecare-invoice-engine             wecare-whatsapp-business-api

      - name: Verify live aliases
        run: |
          python - <<'PY'
          import boto3
          lam = boto3.client("lambda", region_name="us-east-1")
          names = [
              "wecare-checkout",
              "wecare-invoice-engine",
              "wecare-whatsapp-business-api",
          ]
          bad = []
          for name in names:
              latest = lam.get_function_configuration(FunctionName=name)["CodeSha256"]
              alias = lam.get_alias(FunctionName=name, Name="live")["FunctionVersion"]
              served = lam.get_function_configuration(
                  FunctionName=f"{name}:{alias}")["CodeSha256"]
              print(f"{name}: live=v{alias} current={served == latest}")
              if served != latest:
                  bad.append(name)
          if bad:
              raise SystemExit("live alias mismatch: " + ", ".join(bad))
          PY
