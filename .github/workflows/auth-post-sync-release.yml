name: One-shot auth post-sync release
on:
  push:
    branches:
      - auth-post-sync-release-20261028
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-post-sync-release-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify customer commerce and OAuth contracts
        run: |
          python3 tools/customer-commerce/verify.py
          python3 tools/customer-commerce/verify_oauth.py
      - name: Build generated runtime
        run: |
          rm -rf /tmp/customer-commerce-release
          python3 tools/customer-commerce/prepare_release.py --output /tmp/customer-commerce-release
          python3 tools/customer-commerce/verify_release.py /tmp/customer-commerce-release/index.py
          cp /tmp/customer-commerce-release/index.py amplify/functions/ai/customer-commerce-mcp/index.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path('/tmp/customer-commerce-release/customer-commerce-stack.json')
          dst = Path('amplify/functions/ai/customer-commerce-mcp/template.json')
          dst.write_text(json.dumps(json.loads(src.read_text()), indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit generated artifacts and remove helper
        run: |
          rm .github/workflows/auth-post-sync-release.yml
          git config user.name "WECARE.DIGITAL"
          git config user.email "319896805+wecare-digital@users.noreply.github.com"
          git add amplify/functions/ai/customer-commerce-mcp/index.py amplify/functions/ai/customer-commerce-mcp/template.json .github/workflows/auth-post-sync-release.yml
          git commit -m "build(auth): regenerate post-sync runtime"
          git push origin HEAD:auth-post-sync-release-20261028
