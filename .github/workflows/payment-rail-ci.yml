name: Payment rail CI

on:
  pull_request:
    paths:
      - "amplify/functions/payments/**"
      - "amplify/functions/messaging/outbound-whatsapp/**"
      - "amplify/functions/messaging/whatsapp-business-api/**"
      - "amplify/functions/shared/lambda_utils/ecommerce/**"
      - "amplify/functions/shared/lambda_utils/template_media.py"
      - "amplify/functions/shared/lambda_utils/whatsapp_templates.py"
      - "amplify/functions/shared/lambda_utils/direct_send.py"
      - "config/lambda-env-manifest.json"
      - "scripts/env_manifest.py"
      - "scripts/provision_payment_rail_alarms.py"
      - "scripts/provision_whatsapp_delivery_reconciliation.py"
      - "scripts/smoke_whatsapp_backend_live.py"
      - "scripts/provision_order_status_template.py"
      - "tests/test_env_manifest_aliases.py"
      - "tests/test_direct_send_dual_account_regression.py"
      - "tests/test_whatsapp_marketing_policy.py"
      - "tests/test_commerce_audit_hardening.py"
      - "tests/test_invoice_customer_receipt_v8.py"
      - "tests/test_architecture_closeout.py"
      - "tests/test_order_status_single_producer.py"
      - "tests/test_staff_api_authorization.py"
      - "amplify/functions/ecommerce/checkout/**"
      - "amplify/functions/core/service-api/**"
      - "amplify/functions/core/secure-files/**"
      - "amplify/functions/ai/ai-generate-response/**"
      - "src/components/workspace/pay/**"
      - "src/components/workspace/commerce/Orders.tsx"
      - "src/lib/orderFulfilment.ts"
      - "src/api/client.ts"
      - "amplify/functions/ecommerce/service-requests/**"
      - "src/components/get/**"
      - "src/components/ServiceBuyBox.tsx"
      - "src/pages/vault.tsx"
      - "src/lib/serviceRequests.ts"
      - "src/lib/cart.ts"
      - "src/lib/serviceEntry.ts"
      - "amplify/functions/ai/customer-commerce-mcp/**"
      - "tools/customer-commerce/**"
      - "scripts/verify_whatsapp_catalog_payment_rail.py"
      - "scripts/audit_whatsapp_message_history.py"
      - "scripts/commerce_release_audit.py"
      - "docs/operations/whatsapp-payment-collection-stack.md"
      - ".github/workflows/payment-rail-ci.yml"
  push:
    branches:
      - "wecare.digital"
    paths:
      - "amplify/functions/payments/**"
      - "amplify/functions/messaging/outbound-whatsapp/**"
      - "amplify/functions/messaging/whatsapp-business-api/**"
      - "amplify/functions/shared/lambda_utils/ecommerce/**"
      - "amplify/functions/shared/lambda_utils/template_media.py"
      - "amplify/functions/shared/lambda_utils/whatsapp_templates.py"
      - "amplify/functions/shared/lambda_utils/direct_send.py"
      - "config/lambda-env-manifest.json"
      - "scripts/env_manifest.py"
      - "scripts/provision_payment_rail_alarms.py"
      - "scripts/provision_whatsapp_delivery_reconciliation.py"
      - "scripts/smoke_whatsapp_backend_live.py"
      - "tests/test_env_manifest_aliases.py"
      - "tests/test_direct_send_dual_account_regression.py"
      - "tests/test_commerce_audit_hardening.py"
      - "tests/test_invoice_customer_receipt_v8.py"
      - "tests/test_architecture_closeout.py"
      - "tests/test_order_status_single_producer.py"
      - "tests/test_staff_api_authorization.py"
      # wecare-commerce and wecare-checkout are built from this source; a change to it alone
      # must still test and deploy the canonical commerce writer.
      - "amplify/functions/ecommerce/checkout/**"
      - "amplify/functions/core/service-api/**"
      - "amplify/functions/core/secure-files/**"
      - "amplify/functions/ai/ai-generate-response/**"
      - "src/components/workspace/pay/**"
      - "src/components/workspace/commerce/Orders.tsx"
      - "src/lib/orderFulfilment.ts"
      - "src/api/client.ts"
      - "amplify/functions/ecommerce/service-requests/**"
      - "src/components/get/**"
      - "src/components/ServiceBuyBox.tsx"
      - "src/pages/vault.tsx"
      - "src/lib/serviceRequests.ts"
      - "src/lib/cart.ts"
      - "src/lib/serviceEntry.ts"
      - "amplify/functions/ai/customer-commerce-mcp/**"
      - "tools/customer-commerce/**"
      - "scripts/verify_whatsapp_catalog_payment_rail.py"
      - "scripts/audit_whatsapp_message_history.py"
      - "scripts/commerce_release_audit.py"
      - "docs/operations/whatsapp-payment-collection-stack.md"
      - ".github/workflows/payment-rail-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hermetic test dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.116 "moto[dynamodb,cognitoidp]==5.2.4" pillow==13.0.0

      - name: Compile payment Python
        run: |
          python -m compileall -q             amplify/functions/payments             amplify/functions/messaging/outbound-whatsapp             amplify/functions/messaging/whatsapp-business-api             amplify/functions/ecommerce/service-requests             amplify/functions/core/secure-files             amplify/functions/shared/lambda_utils/ecommerce             amplify/functions/shared/lambda_utils/template_media.py

      - name: Verify customer commerce auth contract
        run: |
          python -m compileall -q amplify/functions/ai/customer-commerce-mcp tools/customer-commerce
          python tools/customer-commerce/verify.py
          python tools/customer-commerce/verify_oauth.py
          python tools/customer-commerce/prepare_release.py --output /tmp/customer-commerce-release
          python tools/customer-commerce/verify_release.py /tmp/customer-commerce-release/index.py
          diff -u amplify/functions/ai/customer-commerce-mcp/index.py /tmp/customer-commerce-release/index.py || true
          cmp /tmp/customer-commerce-release/index.py amplify/functions/ai/customer-commerce-mcp/index.py
          python -c "import json; assert json.load(open('/tmp/customer-commerce-release/customer-commerce-stack.json')) == json.load(open('amplify/functions/ai/customer-commerce-mcp/template.json'))"

      - name: Preserve generated customer commerce release for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-commerce-release
          path: /tmp/customer-commerce-release/
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify commerce audit hardening
        run: python -m unittest discover -s tests -p 'test_commerce_audit_hardening.py'

      - name: Verify invoice customer receipt v8
        run: python -m unittest discover -s tests -p 'test_invoice_customer_receipt_v8.py'

      - name: Verify architecture closeout (payment-order rail, invoice claim, alarms)
        run: |
          python -m unittest discover -s tests -p 'test_architecture_closeout.py'
          python -m unittest discover -s tests -p 'test_order_status_single_producer.py'
          python -m unittest discover -s tests -p 'test_staff_api_authorization.py'

      - name: Verify WhatsApp payment rail
        run: python scripts/verify_whatsapp_catalog_payment_rail.py

      - name: Verify Direct Send account/config gate
        run: python -m unittest discover -s tests -p 'test_direct_send_dual_account_regression.py'

      - name: Verify Marketing Messages product policy
        run: python -m unittest discover -s tests -p 'test_whatsapp_marketing_policy.py'

      - name: Verify audit and alarm provisioning scripts
        run: |
          python -m py_compile scripts/env_manifest.py scripts/provision_payment_rail_alarms.py scripts/provision_whatsapp_delivery_reconciliation.py scripts/audit_whatsapp_message_history.py scripts/smoke_whatsapp_backend_live.py
          python -m unittest discover -s tests -p 'test_env_manifest_aliases.py'

      - name: Verify Drop Docs replacement invariants
        run: python -m unittest discover -s tests -p 'test_dropdocs_reupload_regression.py'

  workspace-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck


  package-payment-lambdas:
    needs: [payment-rail, workspace-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check boto3==1.43.116

      - name: Build deterministic payment Lambda packages
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          script = Path("scripts/deploy_all_lambdas.py")
          spec = importlib.util.spec_from_file_location("deploy_all_lambdas", script)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          targets = [
              "wecare-commerce",
              "wecare-checkout",
              "wecare-invoice-engine",
              "wecare-razorpay-webhook",
              "wecare-outbound-whatsapp",
              "wecare-whatsapp-business-api",
              "wecare-service-api",
              "wecare-secure-files",
              "wecare-ai-generate-response",
          ]
          by_name = {s.name: s for s in mod.SPECS}
          out = Path("dist/payment-lambdas")
          out.mkdir(parents=True, exist_ok=True)
          manifest = {}
          for name in targets:
              z, _members = mod.build_zip(by_name[name])
              p = out / f"{name}.zip"
              p.write_bytes(z)
              digest = hashlib.sha256(z).digest()
              manifest[name] = {
                  "file": p.name,
                  "sha256_hex": digest.hex(),
                  "aws_code_sha256": base64.b64encode(digest).decode("ascii"),
                  "bytes": len(z),
              }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload tested Lambda packages
        uses: actions/upload-artifact@v4
        with:
          name: payment-lambdas-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/payment-lambdas/
          if-no-files-found: error
          retention-days: 7


  deploy-payment-lambdas:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wecare.digital'
    needs: package-payment-lambdas
    # One payment release at a time. Pushes land in bursts; parallel deploy jobs would trip each
    # other's preconditions below. A queued deploy waits, and a newer push supersedes it.
    concurrency:
      group: payment-lambda-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: payment-lambdas-${{ github.sha }}
          path: dist/payment-lambdas

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::775261844268:role/wecare-payment-deploy-oidc
          aws-region: us-east-1
          allowed-account-ids: "775261844268"
          role-session-name: payment-rail-${{ github.run_id }}

      - name: Publish verified Lambda packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist/payment-lambdas

          # wecare-secure-files goes last: if its release ever fails, the payment functions
          # before it are already published (run 40305056349 stopped at it and left the two
          # functions after it unpublished).
          functions=(
            wecare-outbound-whatsapp
            wecare-whatsapp-business-api
            wecare-commerce
            wecare-checkout
            wecare-invoice-engine
            wecare-service-api
            wecare-ai-generate-response
            wecare-razorpay-webhook
            wecare-secure-files
          )

          for fn in "${functions[@]}"; do
            echo "::group::Deploy ${fn}"
            expected="$(jq -r --arg fn "${fn}" '.[$fn].aws_code_sha256' manifest.json)"
            revision="$(aws lambda get-function-configuration               --function-name "${fn}" --query RevisionId --output text)"
            # Every write below is conditional, as in scripts/snapstart_publish.py: if another
            # deployer changes this function or moves `live` during the release, the step fails
            # instead of publishing their code or moving production back onto older code.
            alias_revision="$(aws lambda get-alias --function-name "${fn}" --name live --query RevisionId --output text)"

            aws lambda update-function-code               --function-name "${fn}"               --zip-file "fileb://${fn}.zip"               --revision-id "${revision}"               --no-publish >/dev/null

            aws lambda wait function-updated-v2 --function-name "${fn}"

            latest="$(aws lambda get-function-configuration               --function-name "${fn}" --query '{sha: CodeSha256, revision: RevisionId}' --output json)"
            actual="$(jq -r .sha <<<"${latest}")"
            latest_revision="$(jq -r .revision <<<"${latest}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Hash mismatch for ${fn}: expected ${expected}, got ${actual}" >&2
              exit 1
            fi

            version="$(aws lambda publish-version               --function-name "${fn}"               --description "payment-rail ${GITHUB_SHA}" --code-sha256 "${expected}" --revision-id "${latest_revision}"               --query Version --output text)"

            snap="$(aws lambda get-function-configuration               --function-name "${fn}"               --qualifier "${version}"               --query 'SnapStart.ApplyOn' --output text 2>/dev/null || true)"
            if [[ "${snap}" == "PublishedVersions" ]]; then
              for _ in {1..60}; do
                opt="$(aws lambda get-function-configuration                   --function-name "${fn}" --qualifier "${version}"                   --query 'SnapStart.OptimizationStatus' --output text)"
                [[ "${opt}" == "On" ]] && break
                [[ "${opt}" == "Failed" ]] && {
                  echo "SnapStart optimization failed for ${fn}:${version}" >&2
                  exit 1
                }
                sleep 5
              done
            fi

            aws lambda update-alias               --function-name "${fn}"               --name live               --function-version "${version}" --revision-id "${alias_revision}" >/dev/null

            live_sha="$(aws lambda get-function-configuration               --function-name "${fn}" --qualifier live               --query CodeSha256 --output text)"
            if [[ "${live_sha}" != "${expected}" ]]; then
              echo "Live alias hash mismatch for ${fn}: expected ${expected}, got ${live_sha}" >&2
              exit 1
            fi
            echo "${fn} live -> v${version} ${live_sha}"
            echo "::endgroup::"
          done
