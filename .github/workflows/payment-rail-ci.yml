name: Payment rail CI

on:
  pull_request:
    paths:
      - "amplify/functions/payments/**"
      - "amplify/functions/messaging/outbound-whatsapp/**"
      - "amplify/functions/messaging/whatsapp-business-api/**"
      - "amplify/functions/shared/lambda_utils/ecommerce/**"
      - "amplify/functions/shared/lambda_utils/template_media.py"
      - "amplify/functions/core/service-api/**"
      - "amplify/functions/ai/ai-generate-response/**"
      - "src/components/workspace/pay/**"
      - "src/api/client.ts"
      - "scripts/verify_whatsapp_catalog_payment_rail.py"
      - "scripts/commerce_release_audit.py"
      - ".github/workflows/payment-rail-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hermetic test dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.116 "moto[dynamodb,cognitoidp]==5.2.4"

      - name: Compile payment Python
        run: |
          python -m compileall -q             amplify/functions/payments             amplify/functions/messaging/outbound-whatsapp             amplify/functions/messaging/whatsapp-business-api             amplify/functions/shared/lambda_utils/ecommerce             amplify/functions/shared/lambda_utils/template_media.py

      - name: Verify WhatsApp payment rail
        run: python scripts/verify_whatsapp_catalog_payment_rail.py

  workspace-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
