name: deps-upgrade-and-lock

# One-shot, manually triggered upgrade that runs on a networked GitHub runner
# and updates the existing root lockfile in place, optionally bumps current direct
# deps to @latest, verifies with both `npm run build` AND `npm ci` via
# scripts/npm_ci_gate.py, then commits the result back to `stack` (which triggers
# the Amplify deploy). Both gates must pass before anything is committed.
#
# The root npm ci gate is strict. Backend dependencies remain in amplify/.
# See docs/npm-ci-backend-isolation.md and scripts/npm_ci_gate.py.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "lock-only (update existing lock) or full-latest (upgrade current root deps)"
        type: choice
        default: lock-only
        options:
          - lock-only
          - full-latest

permissions:
  contents: write

concurrency:
  group: deps-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout stack
        uses: actions/checkout@v7
        with:
          ref: stack

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # For scripts/npm_ci_gate.py. Pinned rather than relying on `python` happening to
      # be on the runner's PATH: the image ships a python3, but an implicit alias is
      # precisely how a gate turns into a silent no-op. Same version and action as
      # build-test.yml and route-auth.yml. The script uses only the standard library, so
      # nothing is installed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bump current root dependencies (full-latest only)
        if: ${{ inputs.mode == 'full-latest' }}
        run: node scripts/upgrade-dependencies.mjs --apply

      - name: Update root lockfile in place
        run: npm install --no-audit --no-fund

      - name: Gate - build
        run: npm run build

      # Strict installation gate: preserve the root/backend install boundary and
      # fail on every lock inconsistency. Do not delete a good lockfile to upgrade.
      # Historical bundled backend issues: docs/npm-ci-backend-isolation.md.
      - name: Gate - npm ci from clean (catches lockfile drift)
        run: |
          rm -rf node_modules
          python scripts/npm_ci_gate.py -- --legacy-peer-deps

      - name: Commit consistent lockfile + manifest and push (triggers Amplify deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore(deps): clean-regen consistent lockfile (npm ci verified, mode=${{ inputs.mode }})"
            git push origin stack
          fi

      - name: Residual vulnerability summary
        run: npm audit || true
