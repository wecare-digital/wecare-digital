AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Captures failed asynchronous Lambda invocations: one encrypted SQS queue is the
  OnFailure destination of every EventBridge, Scheduler and in-code async target,
  with alarms on AsyncEventsDropped and on queue depth. Audit AWS-8.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: async invoke (EventBridge rule, Scheduler, InvocationType=Event) -> fn:qualifier -> retries exhausted or max age -> FailureQueue; alarms -> AlarmTopicName
    must:
      - one EventInvokeConfig per (fn, qualifier) actually invoked async; unqualified caller -> $LATEST config
      - skip any fn:qualifier that already has an EventInvokeConfig (wecare-secure-files:live -> wecare-lambda-async-dlq)
      - wecare-log-retention-enforcer stays out (its stack must not change; its role is CloudFormation-managed)
      - grant SendMessage only through SendFailureRecordsPolicy; wecare-digital-lambda-role has no inline-policy room and its inline policies stay unchanged
      - adding a target -> add its EventInvokeConfig + Dropped alarm here, and its role to SendFailureRecordsPolicy.Roles
Parameters:
  AlarmTopicName:
    Type: String
    Default: wecare-alarm-notifications
    AllowedPattern: '^[A-Za-z0-9_-]{1,256}$'
    Description: Existing SNS topic with a confirmed human (email) subscriber.
Resources:
  FailureQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: holds Lambda on-failure invocation records (request payload + error) for 14d so a failed async event can be inspected and replayed; SSE-SQS so no KMS grants are needed on 3 roles
        must:
          - standard queue (Lambda destinations reject FIFO)
          - Retain: records are evidence of lost work; drain before deleting by hand
        mutable: change-with-constraints
        mutability:
          QueueName: must-never-change
    Properties:
      QueueName: !Sub '${AWS::StackName}-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  FailureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: TLS-only access; Lambda writes with the function role's identity policy, so no Allow is needed here
    Properties:
      Queues:
        - !Ref FailureQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt FailureQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  SendFailureRecordsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Lambda sends on-failure records with the execution role, and PutFunctionEventInvokeConfig checks that permission, so every EventInvokeConfig depends on this
        must:
          - Roles = every execution role of a target below
          - customer-managed, never inline (shared role inline quota)
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-send'
      Description: Lets async-invoked WECARE Lambda functions write on-failure records to the async failure queue.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SendAsyncFailureRecords
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt FailureQueue.Arn
      Roles:
        - wecare-digital-lambda-role
        - wecare-service-requests-role
        - wecare-whatsapp-analytics-export-role
  # wecare-razorpay-webhook:live <- EventBridge wecare-commerce-customer-links; in-code from wecare-inbound-whatsapp
  OnFailureRazorpayWebhook:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: SendFailureRecordsPolicy
    Properties:
      FunctionName: wecare-razorpay-webhook
      Qualifier: 'live'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn
  # wecare-docs-scraper:$LATEST <- EventBridge wecare-docs-scraper-daily (unqualified target)
  OnFailureDocsScraper:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: SendFailureRecordsPolicy
    Properties:
      FunctionName: wecare-docs-scraper
      Qualifier: '$LATEST'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn
  # wecare-media-cleanup:$LATEST <- EventBridge wecare-media-cleanup-daily (unqualified target)
  OnFailureMediaCleanup:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: SendFailureRecordsPolicy
    Properties:
      FunctionName: wecare-media-cleanup
      Qualifier: '$LATEST'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn
  # wecare-partner-token-refresh:$LATEST <- EventBridge wecare-partner-token-refresh-daily (unqualified target)
  OnFailurePartnerTokenRefresh:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: SendFailureRecordsPolicy
