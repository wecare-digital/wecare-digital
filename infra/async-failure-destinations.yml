      FunctionName: wecare-partner-token-refresh
      Qualifier: '$LATEST'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn
  # wecare-scheduled-messages:live <- EventBridge wecare-scheduled-messages-trigger
  OnFailureScheduledMessages:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: SendFailureRecordsPolicy
    Properties:
      FunctionName: wecare-scheduled-messages
      Qualifier: 'live'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn
  # wecare-whatsapp-business-api:live <- EventBridge wecare-whatsapp-delivery-reconciliation and wecare-whatsapp-template-flow-meta-sync; in-code from razorpay-webhook, inbound-whatsapp and its own flows/submit_request.py
  OnFailureWhatsappBusinessApi:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: SendFailureRecordsPolicy
    Properties:
      FunctionName: wecare-whatsapp-business-api
      Qualifier: 'live'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureQueue.Arn
  # wecare-whatsapp-analytics-export:live <- EventBridge wecare-whatsapp-operational-analytics
  OnFailureWhatsappAnalyticsExport:
