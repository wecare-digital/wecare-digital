  DroppedRazorpayWebhook:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-dropped-wecare-razorpay-webhook'
      AlarmDescription: 'Lambda dropped an async event for wecare-razorpay-webhook after retries or max age. The on-failure record is in the async failure queue.'
      Namespace: AWS/Lambda
      MetricName: AsyncEventsDropped
      Dimensions:
        - Name: FunctionName
          Value: wecare-razorpay-webhook
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AlarmTopicName}'
      OKActions:
        - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AlarmTopicName}'
  DroppedDocsScraper:
