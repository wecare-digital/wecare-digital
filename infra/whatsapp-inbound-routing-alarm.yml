AWSTemplateFormatVersion: '2010-09-09'
Description: Alert when the WhatsApp inbound worker ignores retired Meta routing webhooks.
Metadata:
  com.aws.cloudformation.Context:
    Purpose: Detect a provider-side routing mismatch without writing customer payloads.
    Deployment: Create this monitoring-only stack before advancing the inbound worker alias.
    Prerequisites: The Lambda log group and the approved SNS alarm topic already exist.
Parameters:
  InboundLogGroup:
    Type: String
    Default: /aws/lambda/wecare-inbound-whatsapp
    Description: Existing inbound WhatsApp Lambda log group.
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^arn:[a-z0-9-]+:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$'
    Description: ARN of the existing, approved SNS alarm notification topic.
Resources:
  IgnoredRoutingMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref InboundLogGroup
      FilterName: !Sub '${AWS::StackName}-ignored-routing'
      # Works with Lambda's text prefix and the event's JSON message.
      FilterPattern: '"webhook_field_ignored"'
      MetricTransformations:
        - MetricNamespace: WECARE.DIGITAL/WhatsApp
          MetricName: !Sub '${AWS::StackName}-IgnoredRoutingEvents'
          MetricValue: '1'
          DefaultValue: 0
  IgnoredRoutingAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: IgnoredRoutingMetric
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ignored-routing'
      AlarmDescription: 'Standby or handover event ignored by the inbound worker. Check the Meta routing runbook before advancing the alias.'
      Namespace: WECARE.DIGITAL/WhatsApp
      MetricName: !Sub '${AWS::StackName}-IgnoredRoutingEvents'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopicArn
Outputs:
  AlarmName:
    Value: !Ref IgnoredRoutingAlarm
